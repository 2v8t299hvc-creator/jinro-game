function buildCharacterOutlook(observer,pub=buildSpeechPublicInformation(),publicOnly=false){
  const basis=publicOnly?'outward':'personal';
  const stored=publicOnly?observer.outwardOutlook:observer.characterOutlook;
  const previous=stored?.schemaVersion===CHARACTER_OUTLOOK_VERSION&&stored.visibility==='private'&&
    stored.observerId===observer.id&&stored.basis===basis?stored:null;
  const information=outlookInformation(observer,pub,publicOnly),informationKey=JSON.stringify(information);
  const model=buildRoleHypotheses(observer,pub.context,publicOnly),supported=model.supported;
  const info=publicOnly?{selfRole:null,knownWolfAllies:[]}:buildPrivateInfo(observer);
  const knownWolves=new Set(info.knownWolfAllies);
  if(info.selfRole==='wolf')knownWolves.add(observer.id);
  const policy=buildPublicExecutionEvaluation(observer),rows=[...pub.context.seerRows,...pub.context.mediumRows];
  const roleForRow=row=>row.record.seerId!=null?'seer':'medium';
  const sourceId=row=>row.record.seerId??row.record.mediumId;
  const publiclyTrue=row=>!pub.context.broken.has(sourceId(row))&&
    publiclyKnownRoleFor(sourceId(row),pub.context.confirmed)===roleForRow(row);
  const selected=row=>supported?.trueIds[roleForRow(row)].includes(sourceId(row));
  const roles={},roleTrustModel=getPersonalityRoleTrust(observer,pub.context,publicOnly);
  for(const role of ['seer','medium']){
    const ids=(supported?.trueIds[role]||[...pub.context.confirmed.keys()].filter(id=>publiclyKnownRoleFor(id,pub.context.confirmed)===role)).filter(id=>!pub.context.broken.has(id));
    const assessments={};
    for(const person of pub.context.claimants.filter(p=>p.role===role)){
      const publicTrue=publiclyKnownRoleFor(person.id,pub.context.confirmed)===role;
      const publicFalse=pub.context.broken.has(person.id),chosen=ids.includes(person.id);
      const view=publicFalse?'false':publicTrue||chosen?'true':supported?'false':'unknown';
      const publicEvidence=[];
      if(publicFalse)publicEvidence.push({type:'publicBreakdown',visibility:'public',snapshot:{playerId:person.id,reasons:[...pub.context.broken.get(person.id)]}});
      else if(publicTrue)publicEvidence.push({type:'publicRoleConfirmation',visibility:'public',snapshot:{playerId:person.id,role,reasons:[...pub.context.confirmed.get(person.id)]}});
      else if(chosen){
        for(const s of pub.context.seerRows)for(const m of pub.context.mediumRows){
          if(s.record.targetId!==m.record.targetId||s.record.black!==m.record.black||!selected(s)||!selected(m)||
            ![s.record.seerId,m.record.mediumId].includes(person.id))continue;
          publicEvidence.push({type:'hypothesisResultMatch',visibility:'public',sources:[s.source,m.source]});
        }
      }

      const roleTrust=roleTrustModel.roles[role][person.id];
      assessments[person.id]={targetId:person.id,view,certaintyScope:publicTrue||publicFalse?'public':
        roleTrust?.certaintyScope==='private'?'private':view==='unknown'?null:'inferred',
        judgmentReasons:JSON.parse(JSON.stringify(roleTrust?.evidence||[])),publicEvidence:copyPublicSpeechEvidence(publicEvidence)};
    }
    roles[role]={trueCandidateIds:[...ids],unknownTrueSlots:Math.max(0,(pub.context.counts[role]||0)-ids.length),assessments};
  }
  const people={};
  for(const target of pub.context.people){
    const id=target.id,publicRole=publiclyKnownRoleFor(id,pub.context.confirmed);
    const ownRole=!publicOnly&&id===observer.id?info.selfRole:null;
    const publicRows=rows.filter(row=>row.record.targetId===id&&publiclyTrue(row));
    const ownRows=!publicOnly&&['seer','medium'].includes(info.selfRole)?
      (observer[info.selfRole+'Results']||[]).filter(r=>(r.target??r.targetId)===id):[];
    const colors=new Set(publicRows.map(row=>!!row.record.black));
    if(publicRole)colors.add(publicRole==='wolf');
    if(ownRole)colors.add(ownRole==='wolf');
    if(knownWolves.has(id))colors.add(true);
    for(const r of ownRows)colors.add(!!r.black);
    if(supported&&Object.hasOwn(supported.colors,id))colors.add(supported.colors[id]);
    if(['seer','medium'].some(role=>roles[role].trueCandidateIds.includes(id)))colors.add(false);
    const conflictingInformation=colors.size>1;
    const black=colors.size===1?[...colors][0]:null;
    const wolfView=conflictingInformation||black===null?'unknown':black?'wolfLeaning':'nonWolfLeaning';
    const publicColor=publicRows.some(row=>row.record.black===black)||publicRole&&black===(publicRole==='wolf');
    const privateColor=ownRole||knownWolves.has(id)||ownRows.length;
    const wolfScope=wolfView==='unknown'?null:publicColor?'public':privateColor?'private':'inferred';
    const reportRoots=rows.filter(row=>row.record.targetId===id&&row.record.black===black&&(selected(row)||publiclyTrue(row)));
    const publicEvidence=reportRoots.slice(0,1).map(row=>({type:publiclyTrue(row)?black?'confirmedWolfResult':'seerWhite':'hypothesisResult',visibility:'public',
      source:row.source,...(publiclyTrue(row)?{roleTrust:{status:'true'}}:{})}));
    if(publicRole&&TEAM[publicRole]==='村人陣営')publicEvidence.unshift({type:'publicConfirmedVillage',visibility:'public',snapshot:{playerId:id,role:publicRole}});
    const survived=rows.find(row=>row.record.targetId===id&&row.record.seerId!=null&&!row.record.black&&divinationKillsFox(row.record.day)&&target.alive&&(selected(row)||publiclyTrue(row)));
    const privateNotFox=ownRole&&ownRole!=='fox'||knownWolves.has(id)||info.selfRole==='seer'&&ownRows.some(r=>divinationKillsFox(r.day))&&target.alive;
    const publicNotFox=(pub.context.counts.fox??0)===0||publicRole&&publicRole!=='fox'||survived&&publiclyTrue(survived);
    const inferredNotFox=supported?.notFoxIds.includes(id)||wolfView==='wolfLeaning'||['seer','medium'].some(role=>roles[role].trueCandidateIds.includes(id));
    const foxView=publicNotFox||privateNotFox||inferredNotFox?'unlikely':pub.context.counts.fox>0?'possible':'unknown';
    const foxEvidence=survived?[{type:'survivedPublicDivination',visibility:'public',source:survived.source,
      roleTrust:{status:publiclyTrue(survived)?'true':'unconfirmed'},snapshot:{playerId:id,alive:true}}]:[];
    const judgmentReasons=reportRoots.map(row=>({type:'supportedReportedResult',visibility:'public',source:row.source}));
    if(ownRole)judgmentReasons.push({type:'ownIdentity',visibility:'private',snapshot:{role:ownRole}});
    if(knownWolves.has(id))judgmentReasons.push({type:'knownWolf',visibility:'private',snapshot:{playerId:id}});
    for(const r of ownRows)judgmentReasons.push({type:info.selfRole==='seer'?'ownSeerResult':'ownMediumResult',visibility:'private',snapshot:{day:r.day,targetId:id,black:r.black}});
    if(publicRole)judgmentReasons.push({type:'publicRoleConfirmation',visibility:'public',snapshot:{playerId:id,role:publicRole}});
    people[id]={targetId:id,alive:target.alive,claimed:target.claimed,wolfView,wolfCertaintyScope:wolfScope,
      foxView,foxCertaintyScope:publicNotFox?'public':privateNotFox?'private':inferredNotFox?'inferred':null,
      knownRole:ownRole||publicRole||(knownWolves.has(id)?'wolf':null),conflictingInformation,
      judgmentReasons,publicEvidence:copyPublicSpeechEvidence(publicEvidence),foxEvidence:copyPublicSpeechEvidence(foxEvidence)};
  }
  for(const target of pub.context.people)people[target.id].intuitionSuspicion=intuitionAssessment(observer,target,pub.context,publicOnly,roleTrustModel);
  const eligible=pub.context.people.filter(p=>canOutlookLynch(observer,p,pub.context,policy)&&
    !people[p.id].conflictingInformation&&(people[p.id].wolfView==='wolfLeaning'||pub.context.broken.has(p.id)||people[p.id].intuitionSuspicion.lynchAllowed));
  const ranked=eligible.map(p=>{
    const publicCandidate=policy.candidates.find(c=>c.targetId===p.id);
    const tier=policy.wolfEvidence[p.id]?3:pub.context.broken.has(p.id)?2:1;
    const gut=people[p.id].intuitionSuspicion;
    return {id:p.id,tier,score:people[p.id].wolfView==='wolfLeaning'||pub.context.broken.has(p.id)?publicCandidate?.score||25:(publicCandidate?.score||0)+gut.lynchBonus};
  }).sort((a,b)=>b.tier-a.tier||b.score-a.score||
    (hypothesisBias(observer,'lynch:'+b.id)+(previous?.lynchPreference?.targetId===b.id ? .2 : 0))-
    (hypothesisBias(observer,'lynch:'+a.id)+(previous?.lynchPreference?.targetId===a.id ? .2 : 0))||a.id-b.id);
  const preferred=ranked[0],entry=preferred?people[preferred.id]:null;
  const lynchPreference=preferred?{targetId:preferred.id,reasonType:preferred.tier===3?'confirmedWolf':preferred.tier===2?'publicBreakdown':entry.wolfView==='wolfLeaning'?'hypothesisBlack':'intuition',
    certaintyScope:preferred.tier===3?'public':entry.wolfView==='wolfLeaning'?entry.wolfCertaintyScope:'inferred',eligibleTargetIds:ranked.map(p=>p.id)}:
    {targetId:null,reasonType:'noEligibleTarget',certaintyScope:null,eligibleTargetIds:[]};
  const protection=policy.keep.active?{targetIds:[policy.keep.keepId],reasonType:'publicWolfKeep',policy:JSON.parse(JSON.stringify(policy.keep))}:
    {targetIds:[],reasonType:null,policy:JSON.parse(JSON.stringify(policy.keep))};
  const socialReputation=buildSocialReputation(observer,pub,publicOnly);
  const core={roles,people,lynchPreference,protection,socialReputation};
  const predictionKey=JSON.stringify({supportKey:model.supportKey,roles:Object.fromEntries(Object.entries(roles).map(([role,r])=>[role,{trueCandidateIds:r.trueCandidateIds,views:Object.fromEntries(Object.entries(r.assessments).map(([id,a])=>[id,[a.view,a.certaintyScope]]))}])),
    people:Object.fromEntries(Object.entries(people).map(([id,p])=>[id,[p.wolfView,p.wolfCertaintyScope,p.foxView,p.foxCertaintyScope,p.knownRole,p.conflictingInformation]])),lynch:lynchPreference.targetId,protect:protection.targetIds});
  const changed=previous?.informationKey!==informationKey||previous?.predictionKey!==predictionKey;
  const causes=[];
  let oldInformation;
  try{oldInformation=previous?JSON.parse(previous.informationKey):null;}catch{}
  if(!oldInformation)causes.push('initial');
  else for(const key of Object.keys(information))if(JSON.stringify(oldInformation[key])!==JSON.stringify(information[key]))causes.push(key);
  if(!causes.length&&changed)causes.push('revalidated');
  const history=Array.isArray(previous?.updateHistory)?previous.updateHistory.slice(-15):[];
  const revisions=Number.isInteger(previous?.revision)?previous.revision:0;
  const revision=changed?revisions+1:revisions;
  const personState=p=>p?{alive:p.alive,wolfView:p.wolfView,wolfCertaintyScope:p.wolfCertaintyScope,
    foxView:p.foxView,foxCertaintyScope:p.foxCertaintyScope,knownRole:p.knownRole}:null;
  const peopleChanges=Object.keys(people).map(Number).map(id=>({targetId:id,before:personState(previous?.people?.[id]),after:personState(people[id])}))
    .filter(change=>JSON.stringify(change.before)!==JSON.stringify(change.after));
  const roleChanges=Object.entries(roles).filter(([role,r])=>JSON.stringify(previous?.roles?.[role])!==JSON.stringify(r))
    .map(([role,r])=>({role,previousTrueIds:previous?.roles?.[role]?.trueCandidateIds||[],trueIds:r.trueCandidateIds}));
  const event={revision,day:state.day,order:state.publicRecords.publishClock||0,causes,
    previousSupportKey:previous?.supportKey||null,supportKey:model.supportKey,
    changedPeople:peopleChanges.map(c=>c.targetId),peopleChanges,roleChanges,previousLynchId:previous?.lynchPreference?.targetId??null,lynchId:lynchPreference.targetId};
  return {schemaVersion:CHARACTER_OUTLOOK_VERSION,visibility:'private',basis,observerId:observer.id,
    informationKey,predictionKey,supportKey:model.supportKey,status:model.status,revision,
    updatedDay:changed?state.day:previous.updatedDay,updatedOrder:changed?state.publicRecords.publishClock||0:previous.updatedOrder,
    updateHistory:changed?[...history,event].slice(-16):Array.isArray(previous.updateHistory)?previous.updateHistory:[],...core};
}

function speechFitsOutlook(observer,topic,outlook){
  const id=topic.targetId,p=outlook.people[id];
  if(topic.variant==='roleTruth'||topic.variant==='roleFalse')return outlook.roles[topic.details.role]?.assessments[id]?.view===(topic.variant==='roleTruth'?'true':'false');
  if(topic.variant==='pastWhite')return historyWhiteAllowed(observer,id,outlook,buildSpeechPublicInformation())&&(outlook.socialReputation?.people[id]?.whiteBonus||0)>=1;
  if(topic.variant==='pastReliable')return (outlook.socialReputation?.people[id]?.reasoningBonus||0)>=3;
  if(topic.variant==='gutSuspect')return p?.intuitionSuspicion?.active===true;
  if(topic.variant==='gutLynch')return id===outlook.lynchPreference.targetId&&outlook.lynchPreference.reasonType==='intuition';
  if(topic.variant==='basicTrust')return p?.wolfView==='nonWolfLeaning'&&!p.conflictingInformation;
  if(topic.variant==='basicSuspect')return p?.wolfView==='wolfLeaning'&&!p.conflictingInformation;
  if(topic.variant==='nonFox')return p?.foxView==='unlikely'&&!p.conflictingInformation;
  if(topic.variant==='lynchProposal')return id===outlook.lynchPreference.targetId;
  if(topic.variant==='wolfKeep')return outlook.protection.targetIds.includes(topic.details.keepId??id);
  return true;
}
function buildMorningSpeechCandidates(observer){

  const topics=buildOutlookSpeechCandidates(observer,pub,outlook).filter(t=>speechFitsOutlook(observer,t,outlook));

// 朝一専用候補。通常意見の入口・信用点数・実投票は変更しない。

      details:{targetName:byId(person.id).name+(person.alive?"":"（死亡）"),role:person.claimed,
        roleLabel:person.claimed==="seer"?"占い師":"霊媒師",certainty:"confirmedFalse",
        evidence:[{type:"publicBreakdown",visibility:"public",snapshot:{playerId:person.id,reasons}}]}});
  }
  // 生存＋公開占いを根拠に狐を否定。占い師自身の真偽は個人判断で選別する。
  for(const target of pub.context.people){
    if(!target.alive||target.claimed||target.id===observer.id)continue;
    const person=decision.people.people[target.id];
    if(!person||person.conflictingCertainty||pub.people.people[target.id]?.conflictingCertainty)continue;
    for(const row of pub.context.seerRows.filter(r=>r.record.targetId===target.id&&!r.record.black&&divinationKillsFox(r.record.day)&&r.record.day<=state.day)){
      const id=row.record.seerId,publicRole=pub.roles.roles.seer[id],personalRole=decision.roles.roles.seer[id];
      if(!publicRole||!personalRole||publicRole.status==="false"||personalRole.status==="false"||
        publicRole.conflictingCertainty||personalRole.conflictingCertainty||
        publicRole.status==="true"&&publiclyKnownRoleFor(id,pub.context.confirmed)!=="seer")continue;
      const weight=personalSpeechWeight(personalRole.score,publicRole.score,true);
      if(!weight)continue;
      candidates.push({kind:"trust",variant:"nonFox",targetId:target.id,weight,
        details:{targetName:byId(target.id).name,certainty:publicRole.status==="true"?"confirmedNonFox":"inferred",
          evidence:[{type:"survivedPublicDivination",visibility:"public",source:JSON.parse(JSON.stringify(row.source)),
            roleTrust:JSON.parse(JSON.stringify(publicRole)),snapshot:{playerId:target.id,alive:true}}]}});
      // 同じ人物への複数の占いは候補数による加点にしない。
      break;
    }
  }
  const hypotheses=buildHypothesisMorningCandidates(observer,pub,outlook);
  if(hypotheses.length){
    // 予想の話題があれば、毎朝の真確定役職の復唱は候補から外す。
    const useful=candidates.filter(t=>t.variant!=="roleTruth"||t.details.certainty!=="confirmedRole"||
      !(observer.speechHistory||[]).some(h=>h.semantics?.variant==="roleTruth"&&h.semantics?.target?.playerId===t.targetId&&h.semantics?.claim?.certainty==="confirmedRole"));
    const supported={trueIds:Object.fromEntries(Object.entries(outlook.roles).map(([role,r])=>[role,r.trueCandidateIds]))};
    const coherent=useful.filter(t=>{
      if(t.details.certainty!=="inferred")return true;
      if(t.variant==="roleTruth")return supported.trueIds[t.details.role]?.includes(t.targetId);
      return (t.details.evidence||[]).every(e=>{
        const r=e.source?.snapshot,id=r?.seerId??r?.mediumId;
        return id==null||supported.trueIds[r.seerId!=null?"seer":"medium"].includes(id);
      });
    });
    return [...coherent,...buildHistorySpeechCandidates(observer,outlook,pub),...buildIntuitionSpeechCandidates(observer,outlook),...hypotheses.filter(t=>!coherent.some(c=>c.variant===t.variant&&c.targetId===t.targetId))];
  }
  const gut=[...buildIntuitionSpeechCandidates(observer,outlook),...buildHistorySpeechCandidates(observer,outlook,pub)];
  if(candidates.length||gut.length)return [...candidates,...gut];
  return buildMorningInformationCandidates(pub);
}
function buildMorningInformationCandidates(pub){
  const candidates=[];
  // 中立の報告を信用根拠に格上げしない。評価不能なら公開情報の整理へ。
  const reports=[...pub.context.seerRows,...pub.context.mediumRows].filter(row=>row.record.day<=state.day);
  const latest=new Map();
  for(const row of reports){
    const id=row.record.seerId??row.record.mediumId,old=latest.get(id);
    if(!old||row.record.day>old.record.day||row.record.day===old.record.day&&(row.record.order??0)>(old.record.order??0))latest.set(id,row);
  }
  for(const row of latest.values()){
    const r=row.record;
    candidates.push({kind:"information",variant:"morningInfo",targetId:r.targetId,weight:1,
      details:{certainty:"reported",evidence:[{type:"reportedResult",visibility:"public",source:JSON.parse(JSON.stringify(row.source))}]}});
  }
  for(const role of ["seer","medium","knight"]){
    const claimants=pub.context.people.filter(p=>p.claimed===role);
    if(!claimants.length)continue;
    candidates.push({kind:"information",variant:"morningInfo",targetId:null,weight:1,
      details:{certainty:"reported",evidence:[{type:"claimSummary",visibility:"public",snapshot:{role,
        claimants:claimants.map(p=>({playerId:p.id,alive:p.alive}))}}]}});
  }
  return candidates;
}
function selectMorningSpeechTopic(observer){
  const groups=buildMorningSelectionGroups(observer,buildMorningSpeechCandidates(observer));
  if(!groups.length)return {kind:"none",variant:"basicWait",targetId:null,details:{}};
  return weightedSpeechChoice(weightedSpeechChoice(groups).candidates).topic;
}
function morningVoiceFor(observer){
  return COM_MORNING_VOICES[observer.characterId]||COM_MORNING_VOICES.joshua;
}
function morningName(observer,id){
  const name=byId(id)?.name||"その人";
  return name+(["melbon","cortes"].includes(observer.characterId)?"様":observer.characterId==="naminami"?"さん":"");
}
function morningRoleLabel(role){return ({seer:"占い師",medium:"霊媒師",knight:"騎士"})[role]||"役職";}
// 理由は公開の構造記録から再構成。details.reasonの自由文・私的判断文は使わない。
function morningReason(observer,topic){
  const d=topic.details,evidence=copyPublicSpeechEvidence(d.evidence||[]),name=id=>morningName(observer,id);
  const broken=evidence.find(e=>e.type==="publicBreakdown");
  if(broken)return `「${broken.snapshot.reasons[0]}」という公開の矛盾がある`;
  const confirmed=evidence.find(e=>e.type==="publicRoleConfirmation");
  if(confirmed)return `公開情報で真${morningRoleLabel(confirmed.snapshot.role)}と確定している`;
  const village=evidence.find(e=>e.type==="publicConfirmedVillage");
  if(village)return "公開情報で村人陣営と確定している";
  const match=evidence.find(e=>e.type==="confirmedResultMatch");
  if(match){
    const partner=(match.sources||[]).find(s=>d.role==="seer"?s.snapshot?.mediumId!=null:s.snapshot?.seerId!=null);
    const id=d.role==="seer"?partner?.snapshot?.mediumId:partner?.snapshot?.seerId;
    return `公開した結果が、真確定した${name(id)}の${d.role==="seer"?"霊媒":"占い"}結果と一致している`;
  }
  const hypothesisMatch=evidence.find(e=>e.type==="hypothesisResultMatch");
  if(hypothesisMatch){
    const [s,m]=hypothesisMatch.sources.map(source=>source.snapshot);
    return `${name(s.seerId)}の占い結果と${name(m.mediumId)}の霊媒結果が、${name(s.targetId)}について一致している`;
  }
  const comparison=evidence.find(e=>e.type==="hypothesisRoleComparison");
  if(comparison)return null;
  const fox=evidence.find(e=>e.type==="survivedPublicDivination");
  if(fox)return `${fox.roleTrust.status==="true"?"真確定した":"真寄りに見ている"}${name(fox.source.snapshot.seerId)}に占われた後も生きている`;
  const result=evidence.filter(e=>e.source?.snapshot&&(e.source.snapshot.seerId!=null||e.source.snapshot.mediumId!=null))
    .sort((a,b)=>Math.abs(b.delta||0)-Math.abs(a.delta||0))[0];
  if(result){
    const r=result.source.snapshot;
    const prefix=result.type==="confirmedWolfResult"||result.roleTrust?.status==="true"?"真確定した":"真寄りに見ている";
    return `${prefix}${name(r.seerId??r.mediumId)}から${r.black?"黒":"白"}が出ている`;
  }
  return null;
}
function formatMorningConsideration(observer,topic){
  const d=topic.details||{},v=topic.variant,voice=morningVoiceFor(observer),name=morningName(observer,topic.targetId)+(["roleTruth","roleFalse"].includes(topic.variant)&&!byId(topic.targetId)?.alive?"（死亡）":"");
  const fill=(text,values)=>text.replace(/【(役職|名前|評価|理由|事実)】/g,(_,key)=>values[key]??"");
  if(v==='pastWhite'||v==='pastReliable'){
    const memory=d.evidence.find(e=>e.type==='rememberedSuspicion')?.snapshot;
    const broken=d.evidence.find(e=>e.type==='publicBreakdown');
    const medium=d.evidence.find(e=>e.type==='memoryMediumBlack');
    const target=morningName(observer,memory.targetId);
    const subjective=memory.detailed&&d.evidence.find(e=>e.type==='rememberedSuspicion')?.sources?.some(e=>e.type==='subjectiveIntuition');
    const claim=memory.type==='fake'?'偽寄りに見ていた':memory.type==='wolf'?'狼寄りに見ていた':subjective?'勘で疑っていた':'疑っていた';
    const basis=broken?`${target}が破綻する前から${claim}`:
      `${medium.snapshot.publiclyConfirmed?'真確定した':'真寄りに見ている'}${morningName(observer,medium.snapshot.mediumId)}の霊媒結果で黒が出た${target}を、結果が出る前から${claim}`;
    const line=v==='pastWhite'?fill(voice.person,{名前:name,評価:'白寄り'}):(COM_HISTORY_RELIABLE[observer.characterId]||COM_HISTORY_RELIABLE.joshua).replaceAll('【名前】',name);
    return line+fill(voice.reason,{理由:basis});
  }
  if(v==='gutSuspect'||v==='gutLynch'){
    const line=v==='gutLynch'?fill(voice.lynch,{名前:name}):fill(voice.person,{名前:name,評価:observer.characterId==='wanunu_iii'?'あやしい':'怪しい'});
    return line+(COM_INTUITION_REASONS[observer.characterId]||COM_INTUITION_REASONS.joshua);
  }
  if(v=="basicWait")return voice.wait;
  if(v==="morningInfo"){
    const report=d.evidence.find(e=>e.type==="reportedResult");
    const summary=d.evidence.find(e=>e.type==="claimSummary");
    let fact;
    if(report){const r=report.source.snapshot;fact=`${r.day}日目、${morningName(observer,r.seerId??r.mediumId)}は${morningName(observer,r.targetId)}に${r.black?"黒":"白"}を報告している。`;}
    else if(summary)fact=`${morningRoleLabel(summary.snapshot.role)}のCOは${summary.snapshot.claimants.length}人。そのうち生存者は${summary.snapshot.claimants.filter(p=>p.alive).length}人。`;
    else return voice.wait;
    if(observer.characterId==="wanunu_iii")fact=fact.replace(/報告している/g,"言ってる").replace(/生存者/g,"いきてるひと");
    return fill(voice.info,{事実:fact.replace(/。$/,""),});
  }
  if(v==="wolfKeep")return fill(voice.keep,{名前:morningName(observer,d.keepId)});
  const reason=morningReason(observer,topic);
  if(!reason&&!d.hypothesis)return voice.wait;
  if(d.hypothesis){
    const evaluation=v==="roleTruth"?"本物":v==="roleFalse"?"偽物":v==="basicSuspect"?"怪しい":v==="nonFox"?"狐ではなさそう":"人狼ではなさそう";
    const line=v==="lynchProposal"?fill(voice.lynch,{名前:name}):fill(["roleTruth","roleFalse"].includes(v)?voice.role:voice.person,
      {役職:d.roleLabel,名前:name,評価:observer.characterId==="wanunu_iii"?evaluation.replace("怪しい","あやしい").replace("人狼","おおかみ").replace("狐","きつね"):evaluation});
    return line+(reason?fill(voice.reason,{理由:reason}):"");
  }
  let template,evaluation;
  if(v==="roleTruth"||v==="roleFalse"){
    if(d.certainty==="confirmedRole")return fill(voice.confirmed,{名前:morningName(observer,topic.targetId)+(byId(topic.targetId)?.alive?"":"（死亡）"),評価:`真${d.roleLabel}`})+fill(voice.reason,{理由:reason});
    if(v==="roleFalse")return fill(voice.confirmed,{名前:morningName(observer,topic.targetId)+(byId(topic.targetId)?.alive?"":"（死亡）"),評価:"破綻している"})+fill(voice.reason,{理由:reason});
    template=voice.role;evaluation="本物っぽい";
  }else if(v==="lynchProposal"){
    const policy=d.evidence.find(e=>e.type==="executionPolicy")?.snapshot;
    const keep=d.keeping?`${morningName(observer,policy.keep.keepId)}は今日は残して、` : "";
    return keep+fill(voice.lynch,{名前:name})+fill(voice.reason,{理由:reason});
  }else{
    template=voice.person;
    evaluation=v==="nonFox"?"狐ではなさそう":v==="basicSuspect"?"怪しい":"人狼ではなさそう";
    if(d.certainty==="confirmedWolf")return fill(voice.confirmed,{名前:name,評価:observer.characterId==="wanunu_iii"?"おおかみ":"人狼"})+fill(voice.reason,{理由:reason});
    if(d.certainty==="confirmedNonWolf"||d.certainty==="confirmedVillage")return fill(voice.confirmed,{名前:name,評価:observer.characterId==="wanunu_iii"?"おおかみではない":"人狼ではない"})+fill(voice.reason,{理由:reason});
    if(d.certainty==="confirmedNonFox")return fill(voice.confirmed,{名前:name,評価:observer.characterId==="wanunu_iii"?"きつねではない":"狐ではない"})+fill(voice.reason,{理由:reason});
  }
  if(observer.characterId==="wanunu_iii")evaluation=evaluation.replace("怪しい","あやしい").replace("人狼","おおかみ").replace("狐","きつね");
  return fill(template,{役職:d.roleLabel,名前:name,評価:evaluation})+fill(voice.reason,{理由:reason});
}
function generateMorningComSpeech(observer){
  const voice=morningVoiceFor(observer);
  if(state.day===1){
    let text=voice.firstDay[Math.floor(Math.random()*voice.firstDay.length)];
    if(!COM_MORNING_VOICES[observer.characterId])text=text.replaceAll("ジョシュア",observer.name);
    const topic={kind:"greeting",targetId:null,variant:"firstDayGreeting",details:{}};
    return {kind:topic.kind,targetId:null,text,fullText:`${observer.name}：「${text}」`,semantics:describeComSpeech(observer,topic)};
  }
  const topic=publicSpeechTopic(selectMorningSpeechTopic(observer));
  const greeting=isPubliclyBroken(observer.id)?voice.brokenGreeting:voice.greeting;
  const text=greeting+formatMorningConsideration(observer,topic);
  return {kind:topic.kind,targetId:topic.targetId,text,fullText:`${observer.name}：「${text}」`,semantics:describeComSpeech(observer,topic)};
}

// 発言記録。公開根拠を保存し、通常発言の重複判定にも利用する。
// intentは文章から心理を推測せず、明示的な情報整理/質問だけを記録する。
const COM_SPEECH_SCHEMA_VERSION=1;
function describeComSpeech(observer,topic){
  const id=topic.targetId??null, d=topic.details||{}, v=topic.variant;
  if(["basicTrust","basicSuspect","basicWait","roleTruth","wolfKeep","lynchProposal","roleFalse","nonFox","morningInfo","firstDayGreeting","gutSuspect","gutLynch","pastWhite","pastReliable"].includes(v)){
    const evidence=copyPublicSpeechEvidence(d.evidence||[]);
    return {schemaVersion:COM_SPEECH_SCHEMA_VERSION,variant:v,
      target:id==null?null:{type:id===observer.id?"self":"individual",playerId:id},
      relatedPlayerIds:[...new Set(evidence.flatMap(e=>e.source?[e.source.snapshot?.seerId]:(e.sources||[]).flatMap(s=>[s.snapshot?.seerId,s.snapshot?.mediumId])).filter(x=>Number.isInteger(x)&&x!==id))],
      claim:["morningInfo","firstDayGreeting","basicWait"].includes(v)?null:{type:["wolfKeep","lynchProposal","gutLynch"].includes(v)?"proposal":"evaluation",certainty:d.certainty,strength:d.certainty==="conditional"?"conditional":d.certainty==="inferred"?"tentative":"confirmed"},
      evidence,evidenceCoverage:evidence.length?"complete":"unresolved",
      intent:v==='pastWhite'?'defense':v==='pastReliable'?'informationSharing':['gutSuspect','gutLynch'].includes(v)?'pursuit':["morningInfo","firstDayGreeting"].includes(v)?"informationSharing":["wolfKeep","lynchProposal"].includes(v)?(v==="wolfKeep"?"defense":"pursuit"):id==null?"informationSharing":["basicTrust","nonFox"].includes(v)?"defense":v==="roleTruth"?"informationSharing":"pursuit",replyTo:null,influence:null};
  }
  const evaluation=new Set(["confirmedSeerWhite","confirmedRolePremise","confirmed","firstDayConcern","firstDayUnknown","trustSeer","changedSuspect","suspect","trustWhite","grayConcern"]);
  const pointing=new Set(["broken","split","seerMediumConflict","peaceWithGuard","peaceWithoutGuard","multiSeer","multiMedium","multiKnight","confirmedMediumResult"]);
  const proposals=new Set(["confirmedSeerBlack","avoidCat","trustResonator","wait"]);
  const claim=evaluation.has(v)?"evaluation":pointing.has(v)?"pointing":proposals.has(v)?"proposal":v==="coChange"?"question":null;
  // 村全体への発言は今回の対象範囲外。nullを自分に置き換えない。
  const target=id==null?null:{type:id===observer.id?"self":"individual",playerId:id};
  const relatedPlayerIds=[d.seerId,d.mediumId,d.knightId,d.previousId].filter(x=>Number.isInteger(x)&&x!==id);
  const evidence=[];
  // 公開記録だけを保存。後の旧形式移行でも参照時点の事実を失わない。
  const publicSnapshot=r=>Object.fromEntries(["id","seerId","mediumId","knightId","targetId","playerId","black","day","order","role","kind"].filter(k=>r[k]!==undefined).map(k=>[k,r[k]]));
  const addRecords=(collection,predicate)=>{
    (state.publicRecords?.[collection]||[]).forEach((r,index)=>{
      if(predicate(r))evidence.push({type:"publicRole",source:{collection,index,day:r.day??null,order:r.order??null},snapshot:publicSnapshot(r),status:"reported"});
    });
  };
  const addClaim=()=>{
    const p=byId(id);
    if(p?.claimed)evidence.push({type:"coSituation",source:{playerId:id,claimed:p.claimed,observedDay:state.day},status:"reported"});
  };
  if(v==="split"||v==="trustWhite")addRecords("seerResults",r=>r.targetId===id&&(v!=="trustWhite"||!r.black));
  if(v==="coChange"){
    (state.publicRecords?.coEvents||[]).forEach((r,index)=>{
      if(r.playerId===id&&r.day===state.day&&r.kind==="withdraw")evidence.push({type:"coSituation",source:{collection:"coEvents",index,day:r.day,order:r.order??null},snapshot:publicSnapshot(r),status:"reported"});
    });
  }
  if(v==="avoidCat"||v==="confirmedRolePremise")addClaim();
  if(v==="confirmedSeerBlack"||v==="confirmedSeerWhite"){
    const r=latestPublicSeerResultFor(d.seerId);
    if(r)addRecords("seerResults",x=>x===r);
  }
  if(v==="confirmedMediumResult"){
    const r=latestPublicMediumResultFor(d.mediumId);
    if(r)addRecords("mediumResults",x=>x===r);
  }
  if(v==="peaceWithGuard"){
    const r=(state.publicRecords?.guards||[]).find(x=>x.day===state.day);
    if(r)addRecords("guards",x=>x===r);
  }
  // 証明済みかどうかは報告された結果とは別項目。解決器の再実行はしない。
  const confirmedId=["confirmedSeerBlack","confirmedSeerWhite"].includes(v)?d.seerId:v==="confirmedMediumResult"?d.mediumId:["confirmed","confirmedRolePremise"].includes(v)?id:null;
  if(confirmedId!=null){
    (state.publicRecords?.confirmedProofs||[]).forEach((r,index)=>{
      if(r.id===confirmedId)evidence.push({type:"publicRole",source:{collection:"confirmedProofs",index,day:r.day??null,order:null},snapshot:publicSnapshot(r),status:"confirmed"});
    });
  }
  return {schemaVersion:COM_SPEECH_SCHEMA_VERSION,variant:v,target,relatedPlayerIds:[...new Set(relatedPlayerIds)],
    claim:claim?{type:claim,certainty:null,strength:null}:null,
    evidence,evidenceCoverage:evidence.length?"partial":"unresolved",
    intent:v==="coChange"?"informationGathering":pointing.has(v)?"informationSharing":null,
    replyTo:null,influence:null};
}

function recordComSpeech(observer,speech){
  if(!Array.isArray(observer.speechHistory))observer.speechHistory=[];
  const historyIndex=observer.speechHistory.length;
  observer.speechHistory.push({day:state.day,kind:speech.kind,targetId:speech.targetId,text:speech.text,
    recordId:{speakerId:observer.id,historyIndex},
    semantics:speech.semantics?JSON.parse(JSON.stringify(speech.semantics)):null});
  rememberSuspicionSpeech(observer,speech,historyIndex);
  if(speech.targetId!=null&&["suspect","gray","seerMediumConflict","broken"].includes(speech.kind))observer.lastSuspectId=speech.targetId;
  observer.lastSpeechDay=state.day;
  observer.lastSpeechText=speech.fullText;
}

// 人物候補は個人判断で選別。文面・断定・根拠は独立した公開信用だけから作る。
function buildBasicSpeechCandidates(observer){
  const publicInformation=buildSpeechPublicInformation();
  const {context,people:publicPeople}=publicInformation;
  const decision=buildSpeechDecisionInformation(observer,publicInformation);
  const people=publicPeople.people;
  const candidates=[];
  for(const target of context.people){
    if(!target.alive||target.id===observer.id||target.claimed)continue;
    const entry=people[target.id];
    const personal=decision.people.people[target.id];
    if(!entry||!personal||entry.conflictingCertainty||personal.conflictingCertainty)continue;
    const positive=personal.score>=58;
    const weight=personalSpeechWeight(personal.score,entry.score,positive);
    if(!weight)continue;
    const supporting=entry.evidence.filter(e=>e.visibility==="public"&&(
      positive?["publicConfirmedVillage","seerWhite"].includes(e.type):e.type==="seerBlack")).filter(e=>{
        const seerId=e.source?.snapshot?.seerId;
        const personalRole=seerId==null?null:decision.roles.roles.seer[seerId];
        return seerId==null||personalRole&&personalRole.status!=="false"&&!personalRole.conflictingCertainty;
      });
    if(!supporting.length)continue;
    const evidence=JSON.parse(JSON.stringify(supporting));
    let reason,certainty="inferred";
    const known=evidence.find(e=>["publicConfirmedVillage"].includes(e.type));
    const result=evidence.filter(e=>e.source).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta))[0];
    if(known){reason="公開情報で村人陣営と確定しているからです";certainty="confirmedVillage";}
    else if(result){
      const row=result.source.snapshot;
      const sourceName=byId(row.seerId)?.name;
      if(!sourceName)continue;
      const color=positive?"白":"黒";
      if(result.roleTrust.status==="true"){
        reason=`真確定した${sourceName}さんから${color}が出ているからです`;
        certainty=positive?"confirmedNonWolf":"confirmedWolf";
      }else reason=`${sourceName}さんから${color}が出ていて、その占い師の公開信用も材料にしています`;
    }else continue;
    candidates.push({kind:positive?"trust":"suspect",targetId:target.id,
      variant:positive?"basicTrust":"basicSuspect",weight,
      details:{targetName:byId(target.id).name,reason,certainty,evidence}});
  }
  return candidates;
}
// 個人信用で真候補を選び、理由・断定は公開役職信用だけを使う。
function buildRoleTruthSpeechCandidates(observer){
  const publicInformation=buildSpeechPublicInformation();
  const {context,roles:publicRoles}=publicInformation;
  const decision=buildSpeechDecisionInformation(observer,publicInformation);
  const candidates=[];
  for(const role of ["seer","medium"]){
    const entries=Object.values(publicRoles.roles[role]||{}).filter(e=>{
      const personal=decision.roles.roles[role]?.[e.claimantId];
      return e.claimantId!==observer.id&&e.status!=="false"&&!e.conflictingCertainty&&e.score>50&&
        personal&&personal.status!=="false"&&!personal.conflictingCertainty&&personal.score>=58&&
        (e.status!=="true"||publiclyKnownRoleFor(e.claimantId,context.confirmed)===role);
    });
    if(!entries.length)continue;
    // 条件を満たす候補は最高点以外も残し、対象抽選に渡す。
    for(const entry of entries){
      const id=entry.claimantId;
      if(id===observer.id)continue;
      const target=byId(id);
      if(!target||target.claimed!==role)continue;
      let evidence,reason,certainty;
      if(entry.status==="true"){
        evidence=[{type:"publicRoleConfirmation",visibility:"public",snapshot:{playerId:id,role,
          reasons:JSON.parse(JSON.stringify(context.confirmed.get(id)||[]))}}];
        reason="公開情報でこの役職が確定しているからです";certainty="confirmedRole";
      }else{
        evidence=entry.evidence.filter(e=>e.visibility==="public"&&e.type==="confirmedResultMatch"&&e.delta>0&&
          e.sources.some(s=>{const r=s.snapshot,partnerId=role==="seer"?r?.mediumId:r?.seerId;
            return partnerId!=null&&publiclyKnownRoleFor(partnerId,context.confirmed)===(role==="seer"?"medium":"seer");}));
        if(!evidence.length)continue;
        const partnerRole=role==="seer"?"medium":"seer";
        const source=evidence[0].sources.find(s=>s.snapshot?.[partnerRole==="seer"?"seerId":"mediumId"]!=null);
        const partner=byId(source?.snapshot?.[partnerRole==="seer"?"seerId":"mediumId"]);
        if(!partner)continue;
        reason=`公開された結果が、真確定した${partner.name}さんの${partnerRole==="seer"?"占い":"霊媒"}結果と一致しているからです`;
        certainty="inferred";
      }
      candidates.push({kind:"roleTruth",targetId:id,variant:"roleTruth",weight:personalSpeechWeight(decision.roles.roles[role][id].score,entry.score,true),
        details:{targetName:target.name+(target.alive?"":"（死亡）"),role,roleLabel:role==="seer"?"占い師":"霊媒師",
          certainty,tied:Object.values(publicRoles.roles[role]||{}).filter(e=>e.status!=="false"&&!e.conflictingCertainty&&e.score>=entry.score).length>1,
          reason,evidence:JSON.parse(JSON.stringify(evidence))}});
    }
  }
  return candidates;
}
// 公開事実だけから飼いと吊り提案を評価。実投票/秘密役職/夜の実結果は参照しない。
function buildPublicExecutionEvaluation(observer){
  const {context,roles}=buildSpeechPublicInformation();
  const colors=new Map(),wolfEvidence=new Map();
  for(const row of [...context.seerRows,...context.mediumRows]){
    const r=row.record,role=r.seerId!=null?"seer":"medium",sourceId=r.seerId??r.mediumId;
    if(context.broken.has(sourceId)||publiclyKnownRoleFor(sourceId,context.confirmed)!==role)continue;
    if(!context.people.some(p=>p.id===r.targetId))continue;
    if(!colors.has(r.targetId))colors.set(r.targetId,new Set());
    colors.get(r.targetId).add(!!r.black);
    if(r.black){if(!wolfEvidence.has(r.targetId))wolfEvidence.set(r.targetId,[]);
      wolfEvidence.get(r.targetId).push({type:"confirmedWolfResult",visibility:"public",source:JSON.parse(JSON.stringify(row.source))});}
  }
  const knownWolves=context.people.filter(p=>colors.get(p.id)?.size===1&&colors.get(p.id).has(true)&&!context.knownVillageIds.has(p.id));
  const deadWolfIds=knownWolves.filter(p=>!p.alive).map(p=>p.id),aliveWolfIds=knownWolves.filter(p=>p.alive).map(p=>p.id);
  const initialWolves=context.counts.wolf,initialFoxes=context.counts.fox??(state.publicRoleCounts?0:null);
  const validWolves=Number.isInteger(initialWolves)&&initialWolves>=0&&knownWolves.length<=initialWolves&&![...colors.values()].some(c=>c.size>1);
  const lower=aliveWolfIds.length,upper=validWolves?initialWolves-deadWolfIds.length:null;
  const exactOne=validWolves&&lower===1&&upper===1;
  const alive=context.people.filter(p=>p.alive);
  // 白は狐を否定しない。狐不在は配役0、または全生存者が公開村/狼と証明された場合だけ。
  const foxCandidates=alive.filter(p=>!context.knownVillageIds.has(p.id)&&!aliveWolfIds.includes(p.id));
  const validFoxes=Number.isInteger(initialFoxes)&&initialFoxes>=0;
  const foxPossible=validFoxes?initialFoxes>0&&foxCandidates.length>0:true;
  const maxFoxes=validFoxes?Math.min(initialFoxes,foxCandidates.length):null;
  // 非猫の処刑1人＋夜襲撃1人を村側の損失として見積もり、狐を除く他者が狼より多いか。
  const safe=exactOne&&maxFoxes!==null&&alive.length-1-maxFoxes-2>1;
  const keep={active:exactOne&&foxPossible&&safe,keepId:exactOne?aliveWolfIds[0]:null,
    reason:!exactOne?"remainingWolfUncertain":!foxPossible?"noFoxPossible":!safe?"insufficientMargin":"lastWolfWithFoxRisk",
    safe,aliveCount:alive.length,maxFoxes};
  const candidates=[];
  for(const target of alive){
    if(target.id===observer.id||context.knownVillageIds.has(target.id)||keep.active&&target.id===keep.keepId)continue;
    const id=target.id,isWolf=aliveWolfIds.includes(id),broken=context.broken.has(id);
    if(colors.get(id)?.size>1)continue;
    if(target.claimed==="cat"&&!broken&&!isWolf)continue;
    let tier,score,reason,evidence,certainty;
    if(isWolf){tier=3;score=100;certainty="confirmedWolf";evidence=wolfEvidence.get(id);
      reason="真確定した役職の公開結果で人狼と確定しているからです";}
    else if(broken){tier=2;score=70;certainty="inferred";
      evidence=[{type:"publicBreakdown",visibility:"public",snapshot:{playerId:id,reasons:[...context.broken.get(id)]}}];
      reason=`公開情報で破綻しています（${context.broken.get(id)[0]}）`;}
    else{
      // 全狼枠が公開確定者で埋まったなら、別の黒を新たな狼候補にしない。
      if(validWolves&&knownWolves.length===initialWolves)continue;
      // 真の白等で非狼が公開確定した人を、他の黒だけで狼疑いとして吊らない。
      if(colors.get(id)?.has(false))continue;
      const rows=context.seerRows.filter(row=>row.record.targetId===id&&row.record.black&&
        !context.broken.has(row.record.seerId)&&(roles.roles.seer[row.record.seerId]?.score??0)>=60);
      rows.sort((a,b)=>roles.roles.seer[b.record.seerId].score-roles.roles.seer[a.record.seerId].score);
      const row=rows[0];if(!row)continue;
      tier=1;score=roles.roles.seer[row.record.seerId].score;certainty="inferred";
      evidence=[{type:"credibleSeerBlack",visibility:"public",source:JSON.parse(JSON.stringify(row.source)),
        roleTrust:JSON.parse(JSON.stringify(roles.roles.seer[row.record.seerId]))}];
      reason=`公開信用を得ている${byId(row.record.seerId).name}さんから黒が出ているからです`;
    }
    candidates.push({targetId:id,tier,score,reason,certainty,evidence:JSON.parse(JSON.stringify(evidence)),catClaim:target.claimed==="cat"});
  }
  candidates.sort((a,b)=>b.tier-a.tier||b.score-a.score||a.targetId-b.targetId);
  return {basis:"public",remainingWolves:{lower,upper,exactOne,consistent:validWolves,deadWolfIds,aliveWolfIds},
    fox:{possible:foxPossible,max:maxFoxes,candidateIds:foxCandidates.map(p=>p.id)},wolfEvidence:Object.fromEntries(wolfEvidence),keep,candidates};
}
function buildExecutionSpeechCandidates(observer){
  const evaluation=buildPublicExecutionEvaluation(observer),{keep}=evaluation;
  const candidates=evaluation.candidates;
  const snapshot={type:"executionPolicy",visibility:"public",snapshot:{remainingWolves:evaluation.remainingWolves,fox:evaluation.fox,keep}};
  const topics=candidates.map(c=>({kind:"lynch",variant:"lynchProposal",targetId:c.targetId,weight:Math.min(20,c.score/5),
    details:{targetName:byId(c.targetId).name,reason:c.reason,certainty:c.certainty,keeping:keep.active,
      catClaim:c.catClaim,evidence:[...c.evidence,JSON.parse(JSON.stringify(snapshot))]}}));
  if(keep.active){
    const id=keep.keepId;
    topics.unshift({kind:"wolfKeep",variant:"wolfKeep",targetId:id===observer.id?null:id,weight:20,
      details:{targetName:byId(id).name,certainty:"conditional",keepId:id,
        evidence:[...JSON.parse(JSON.stringify(evaluation.wolfEvidence[id]||[])),...evaluation.remainingWolves.deadWolfIds.flatMap(deadId=>JSON.parse(JSON.stringify(evaluation.wolfEvidence[deadId]||[]))),snapshot],
        noAlternative:!topics.length}});
  }
  return {evaluation,topics,priority:keep.active||candidates.some(c=>c.tier===3)};
}
// 対象・主張・公開根拠の同一性。記録順、名前、言い回し、私的候補点は比較しない。
function speechRepeatKey(topic){
  const variants=["basicTrust","basicSuspect","roleTruth","lynchProposal","wolfKeep","roleFalse","nonFox","morningInfo","gutSuspect","gutLynch","pastWhite","pastReliable"];
  if(!topic||!variants.includes(topic.variant))return null;
  const details=topic.details||topic;
  const evidence=details.evidence||[];
  if(hasPrivateSpeechData(evidence))return null;
  const normalize=value=>{
    if(Array.isArray(value))return value.map(normalize).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
    if(!value||typeof value!=="object")return value;
    return Object.fromEntries(Object.keys(value).sort().filter(k=>
      !["index","order","observedDay","updatedDay","updatedOrder","targetName","seerName","mediumName","key"].includes(k)
    ).map(k=>[k,normalize(value[k])]));
  };
  const policy=evidence.find(e=>e.type==="executionPolicy")?.snapshot;
  const roots=evidence.filter(e=>e.type!=="executionPolicy").map(normalize);
  // 飼い方針はその公開条件も根拠。普通の吊りは無関係な盤面変化で補正解除しない。
  if(topic.variant==="wolfKeep"||details.keeping||policy?.keep?.active&&topic.variant==="lynchProposal"){
    if(policy)roots.push(normalize({type:"keepConditions",remainingWolves:policy.remainingWolves,
      fox:{possible:policy.fox?.possible,max:policy.fox?.max},keep:policy.keep}));
  }
  const targetId=topic.variant==="wolfKeep"?(details.keepId??policy?.keep?.keepId??topic.targetId??topic.target?.playerId??null):
    topic.targetId??topic.target?.playerId??null;
  return JSON.stringify({variant:topic.variant,targetId,
    certainty:details.certainty??topic.claim?.certainty??null,
    roots:[...new Set(roots.map(r=>JSON.stringify(r)))].sort()});
}
function buildSpeechRepetitionContext(observer){
  const today=new Map(),previous=new Set();
  for(const player of state.players){
    for(const history of player.speechHistory||[]){
      const sameDay=player.id!==observer.id&&history.day===state.day;
      const previousDay=player.id===observer.id&&history.day===state.day-1;
      if(!sameDay&&!previousDay)continue;
      const key=speechRepeatKey(history.semantics);
      if(!key)continue;
      if(sameDay)today.set(key,(today.get(key)||0)+1);
      if(previousDay)previous.add(key);
    }
  }
  return {today,previous};
}
function speechRepetitionFactor(observer,topic){
  const key=speechRepeatKey(topic);if(!key)return 1;
  const last=(observer.speechHistory||[]).filter(h=>h.day===state.day-1);
  if(!last.some(h=>speechRepeatKey(h.semantics)===key))return 1;
  const earlier=(observer.speechHistory||[]).filter(h=>h.day===state.day-2);
  return earlier.some(h=>speechRepeatKey(h.semantics)===key)?.25:.5;
}
function buildSpeechSelectionGroups(observer,candidates){
  const groups=new Map(),repetition=buildSpeechRepetitionContext(observer);
  for(const topic of candidates){
    if(!Number.isFinite(topic.weight)||topic.weight<=0)continue;
    const factor=speechRepetitionFactor(observer,topic,repetition);
    const urgent=topic.variant==="wolfKeep"||topic.variant==="lynchProposal"&&topic.details.certainty==="confirmedWolf";
    const groupKey=topic.variant==="roleFalse"?"roleTruth":topic.variant==="nonFox"?"basicTrust":topic.variant;
    if(!groups.has(groupKey))groups.set(groupKey,{variant:groupKey,baseWeight:1,freshness:0,candidates:[]});
    const group=groups.get(groupKey);
    group.baseWeight=Math.max(group.baseWeight,urgent?2:1);
    group.freshness=Math.max(group.freshness,factor);
    const personality=personalitySpeechFactor(observer,topic);
    group.candidates.push({topic,weight:topic.weight*factor*personality});
    group.beforePersonality=(group.beforePersonality||0)+topic.weight*factor;
    group.afterPersonality=(group.afterPersonality||0)+topic.weight*factor*personality;
  }
  // 候補人数で話題点を増やさない。各話題で最も重複の少ない候補の補正を使う。
  return [...groups.values()].map(g=>({...g,weight:g.baseWeight*g.freshness*g.afterPersonality/g.beforePersonality}));
}
function weightedSpeechChoice(items){
  const total=items.reduce((n,c)=>n+c.weight,0);
  let draw=Math.random()*total;
  for(const item of items){draw-=item.weight;if(draw<0)return item;}
  return items[items.length-1];
}
function selectSpeechTopic(observer){
  if(!observer?.alive)return {kind:"none",targetId:null,variant:"basicWait",details:{}};
  const execution=buildExecutionSpeechCandidates(observer);
  const candidates=[...buildBasicSpeechCandidates(observer),...buildRoleTruthSpeechCandidates(observer),...execution.topics];
  const groups=buildSpeechSelectionGroups(observer,candidates);
  if(!groups.length)return {kind:"none",targetId:null,variant:"basicWait",details:{}};
  const group=weightedSpeechChoice(groups);
  return weightedSpeechChoice(group.candidates).topic;
}
function selectLegacySpeechTopic(observer){
  const publicInfo=buildPublicInfo();
  const privateInfo=buildPrivateInfo(observer);

  const candidates=publicInfo.players.filter(p=>p.alive&&p.id!==observer.id);
  if(!candidates.length)return {kind:"none",targetId:null,variant:"none",details:{}};

  const evals=shuffle([...candidates])
    .map(target=>{
      const pub=estimatePublicSuspicion(publicInfo,observer.id,target.id);
      return applyPrivateStrategy(observer,privateInfo,publicInfo,{target,...pub});
    })
    .sort((a,b)=>b.score-a.score);

  const priority=selectPrioritySpeechTopic(observer,publicInfo,candidates);
  if(priority)return priority;

  const top=evals.find(e=>!isPubliclyConfirmedTrue(e.target.id)&&speechTopicCountToday("gray",e.target.id)<2)||evals[0];

  if(publicInfo.day===1)return selectFirstDaySpeechTopic(top,evals);

  // 公開結果から信用できる占い師がいる場合は、疑い以外の意見も出す
  const trustedSeer=chooseTrustedSeer(publicInfo);
  if(trustedSeer &&
     speechTopicCountToday("trustSeer",trustedSeer.seer.id)<2 &&
     !observerMentionedRecently(observer,"trustSeer",trustedSeer.seer.id,1) &&
     Math.random()<0.34){
    const reason=trustedSeer.reasons[0]||"これまでの結果に大きな矛盾がありません";
    return {kind:"trustSeer",targetId:trustedSeer.seer.id,variant:"trustSeer",details:{targetName:trustedSeer.seer.name,reason:reason}};
  }

  if(top.score>=3){
    const reason=top.reasons[0]||"公開情報を見るとかなり気になります";
    if(observer.lastSuspectId!=null&&observer.lastSuspectId!==top.target.id){
      const prev=publicInfo.players.find(p=>p.id===observer.lastSuspectId);
      if(prev)return {kind:"suspect",targetId:top.target.id,variant:"changedSuspect",details:{previousId:prev.id,previousName:prev.name,targetName:top.target.name,reason:reason}};
    }
    return {kind:"suspect",targetId:top.target.id,variant:"suspect",details:{targetName:top.target.name,reason:reason}};
  }

  const split=publicInfo.players.find(p=>p.alive&&targetResultConflict(publicInfo,p.id));
  if(split)return {kind:"split",targetId:split.id,variant:"split",details:{targetName:split.name}};

  for(const s of publicInfo.players.filter(p=>p.alive&&p.claimed==="seer")){
    const c=seerVsMediumConflict(publicInfo,s.id);
    if(c)return {kind:"seerMediumConflict",targetId:s.id,variant:"seerMediumConflict",details:{targetName:s.name,resultTargetName:c.targetName||"処刑者"}};
  }

  if(publicInfo.peace){
    const g=publicInfo.guardHints.find(x=>x.day===publicInfo.day);
    if(g)return {kind:"peace",targetId:g.targetId,variant:"peaceWithGuard",details:{knightId:g.knightId,knightName:g.knightName,targetName:g.targetName}};
    return {kind:"peace",targetId:null,variant:"peaceWithoutGuard",details:{}};
  }

  const seers=publicInfo.players.filter(p=>p.alive&&p.claimed==="seer");
  const meds=publicInfo.players.filter(p=>p.alive&&p.claimed==="medium");
  const knights=publicInfo.players.filter(p=>p.alive&&p.claimed==="knight");

  if(seers.length>=2&&speechTopicCountToday("multiSeer")<2&&!observerMentionedRecently(observer,"multiSeer",null,1))
    return {kind:"multiSeer",targetId:null,variant:"multiSeer",details:{}};
  if(meds.length>=2&&speechTopicCountToday("multiMedium")<2&&!observerMentionedRecently(observer,"multiMedium",null,1))
    return {kind:"multiMedium",targetId:null,variant:"multiMedium",details:{}};
  if(knights.length>=2&&speechTopicCountToday("multiKnight")<2&&!observerMentionedRecently(observer,"multiKnight",null,1))
    return {kind:"multiKnight",targetId:null,variant:"multiKnight",details:{}};

  const res=publicInfo.players.find(p=>p.alive&&p.claimed==="resonator");
  if(res && speechTopicCountToday("trustResonator")<1 && Math.random()<0.12)
    return {kind:"trustResonator",targetId:res.id,variant:"trustResonator",details:{}};

  // 白結果が重なっている人物への軽い信用
  const whiteCounts=new Map();
  publicInfo.seerResults.filter(r=>!r.black).forEach(r=>whiteCounts.set(r.targetId,(whiteCounts.get(r.targetId)||0)+1));
  const trustedWhite=publicInfo.players
    .filter(p=>p.alive&&p.id!==observer.id&&(whiteCounts.get(p.id)||0)>=2)
    .sort((a,b)=>(whiteCounts.get(b.id)||0)-(whiteCounts.get(a.id)||0))[0];
  if(trustedWhite){
    return {kind:"trustWhite",targetId:trustedWhite.id,variant:"trustWhite",details:{targetName:trustedWhite.name}};
  }

  const cat=publicInfo.players.find(p=>p.alive&&p.claimed==="cat");
  if(cat)return {kind:"avoidCat",targetId:cat.id,variant:"avoidCat",details:{targetName:cat.name}};

  if(top.score>=1){
    const reason=top.reasons[0]||"まだ情報が少ないです";
    return {kind:"gray",targetId:top.target.id,variant:"grayConcern",details:{targetName:top.target.name,reason:reason}};
  }

  return {kind:"wait",targetId:null,variant:"wait",details:{}};
}

function runDaySpeeches(){

// 夜処理の各段階。日付の更新はresolveNightが最後に行う。
function chooseNightGuardTargets(){
  const guardTargets=[];
  roleLiving("knight").forEach(k=>{
    // 本人指示も無効な指示と同様に扱い、個別の通知なしで通常の自動護衛へ。
    let t=k.forcedGuardTarget!=null&&byId(k.forcedGuardTarget)?.alive?byId(k.forcedGuardTarget):null;
    if(t?.id===k.id)t=null;
    if(!t)t=randomChoice(living().filter(p=>p.id!==k.id));
    if(t){
      guardTargets.push(t.id);
      if(!k.guardHistory)k.guardHistory=[];
      k.guardHistory.push({day:state.day+1,target:t.id});
    }
  });
  // 騙りの指示もこの夜で消費。日記は日付付きの履歴を参照する。
  state.players.forEach(p=>p.forcedGuardTarget=null);
  return guardTargets;
}

function resolveNightDivinations(){
  const seersBefore=roleLiving("seer").slice();
  const fakeSeersBefore=living().filter(p=>hostile(p)).slice();

  let foxKilled=[];
  seersBefore.forEach(s=>{
    // 襲撃死予定でも占い能力は成立。死亡した本人だけ結果を報告できない。
    let t=s.forcedSeerTarget!=null&&byId(s.forcedSeerTarget)?.alive?byId(s.forcedSeerTarget):null;
    if(t?.id===s.id)t=null;
    if(!t)t=autoSeerTarget(s,s.seerResults);
    if(t){
      s.seerResults.push({day:state.day+1,target:t.id,black:t.role==="wolf"});
      if(t.role==="fox")foxKilled.push(t.id);
    }
    s.forcedSeerTarget=null;
  });

  fakeSeersBefore.forEach(s=>{
    recordFakeSeerOpportunity(s,state.day+1);
    s.forcedSeerTarget=null;
  });

  return [...new Set(foxKilled)];
}

function recordNightVictim(player){
  player.alive=false;
  recordPublicDeath(player,state.day+1,"night","found-dead");
  log(`${player.name} が無残な姿で発見されました。`,"death");
}

function applyNightFoxDeaths(foxKilled){
  foxKilled.forEach(id=>{
    const p=byId(id);
    if(p&&p.alive){
      recordNightVictim(p);
    }
  });

}

function resolveNightWolfAttack(attacked,guardTargets,foxKilled){
  let attackDied=false;
  if(attacked&&attacked.alive){
    if(guardTargets.includes(attacked.id)){
      if(!foxKilled.length)log("平和な朝がやってきました。","result");
    }else if(attacked.role==="fox"){
      // 妖狐は人狼の襲撃では死亡しない。
      // ただし同じ夜に呪殺死体が出ている場合は「平和な朝」とは表示しない。
      if(!foxKilled.length)log("平和な朝がやってきました。","result");
    }else{
      recordNightVictim(attacked);
      attackDied=true;

      // 猫又が人狼に襲撃された場合、生存している人狼からランダムに1匹を道連れ
      if(attacked.role==="cat"){
        const wolfVictim=randomChoice(roleLiving("wolf"));
        if(wolfVictim){
          // 通常の襲撃死と同じ公開記録・メッセージを使用する。
          recordNightVictim(wolfVictim);
        }
      }
    }
  }else if(!foxKilled.length){
    log("平和な朝がやってきました。","result");
  }

  return attackDied;
}

  living().filter(p=>p.claimed==="seer").forEach(p=>{

    else if(p.fakeClaimRole==="seer")reportFakeSeer(p,false);

function resolveNight(){
  if(state.phase!=="night"||state.winner)return;
  // 襲撃を決めてから実護衛を抽選。襲撃評価にその夜の秘密の護衛結果を渡さない。
  const attacked=roleLiving("wolf").length?chooseWolfAttackTarget():null;
  const guardTargets=chooseNightGuardTargets();
  // 襲撃予定者も占いを実行し、死亡処理後の生存者だけが報告する。
  const foxKilled=resolveNightDivinations();
  applyNightFoxDeaths(foxKilled);
  const attackDied=resolveNightWolfAttack(attacked,guardTargets,foxKilled);
  prepareMorningMediumResults();
  commitPublicTruthProofs();
  updateWolfAIAfterNight(attacked,guardTargets,attackDied);
  const winner=checkWin();
  if(winner){finish(winner);return;}
  state.day++;
  state.phase="day";
  log(`${state.day}日目の朝になりました。`,"system");
  publishMorningRoleReports();
  runDaySpeeches();
  save();renderAll();
}

function checkWin(){
  const a=living(),w=a.filter(p=>p.role==="wolf").length,f=a.filter(p=>p.role==="fox").length,o=a.length-w-f;
  if(w===0)return f>0?"妖狐陣営の勝利":"村人陣営の勝利";
  if(w>=o)return f>0?"妖狐陣営の勝利":"人狼陣営の勝利";
  return null;
}

    const candidate=JSON.parse(r);
    if(!isValidSavedGame(candidate))throw new Error("Invalid saved game");
    const hasGuardInstructions=Array.isArray(candidate.publicRecords?.guardInstructions);
    state=candidate;
    state.selectionMode=null;state.selectionTitle=null;state._selectionAllowed=null;state._selectionCallback=null;
    if(state.logPersonFilterId===undefined)state.logPersonFilterId=null;
    if(!state.uiSettings)state.uiSettings={showConfirmedBadges:true,showBrokenBadges:true};
    if(state.uiSettings.showConfirmedBadges===undefined)state.uiSettings.showConfirmedBadges=true;
    if(state.uiSettings.showBrokenBadges===undefined)state.uiSettings.showBrokenBadges=true;
    ensurePublicRecords();
    (state.players||[]).forEach(p=>{
      if(p.coCheckedNone===undefined)p.coCheckedNone=false;
      if(!Array.isArray(p.coHistory))p.coHistory=[];
      if(p.villagerAnswerLocked===undefined)p.villagerAnswerLocked=p.villagerClaim!==null;
      if(!Array.isArray(p.speechHistory))p.speechHistory=[];
      if(p.deathDay===undefined)p.deathDay=null;
      if(p.deathPhase===undefined)p.deathPhase=null;
    });
    ensureCharacterMetadata();
    if(!hasGuardInstructions)state.players.filter(hostile).forEach(p=>p.forcedGuardTarget=null);
    state.players.filter(hostile).forEach(ensureFakeSeerTimeline);
    migrateLegacyFullCoResponses();
    ensureWolfSeerPlan();
    commitPublicTruthProofs();
    if(state.speechMemoryEnabled!==false&&!state.speechMemorySystem){
      const system=ensureSpeechMemorySystem();
      for(const [id] of getPublicBreakdowns())system.breakdowns[id]={order:socialOrder(),day:null};

}

function discussionEvidenceValid(evidence){
 if(!Array.isArray(evidence))return false;
 try{copyPublicSpeechEvidence(evidence);}catch{return false;}
 const check=v=>{
  if(!v||typeof v!=='object')return true;
  if(v.collection&&Number.isInteger(v.index)){
   const row=state.publicRecords?.[v.collection]?.[v.index];if(!row)return false;
   if(v.snapshot&&JSON.stringify(row)!==JSON.stringify(v.snapshot))return false;

  return Object.values(v).every(check);
 };return evidence.every(check);
}

function discussionCandidates(observer){

 const groups=buildMorningSelectionGroups(observer,raw),total=groups.reduce((a,g)=>a+g.weight,0);

  c.subjectId??=null;c.recipientId??=null;c.replyTo??=null;c.originEventId??=c.replyTo;c.evidence??=[];

  if(c.subjectId!=null&&!byId(c.subjectId)||c.recipientId!=null&&!byId(c.recipientId)?.alive)return;

  seen.add(c.semanticReasonKey);out.push(c);
 };

 }}

 }

 const views=buildCharacterOutlook(observer,pub,observer.role==='wolf');
 for(const e of recent){
  if(e.speakerId===observer.id||!byId(e.speakerId)?.alive||!['suspect','trust','propose','answer'].includes(e.command)||e.subjectId==null)continue;

   if(negative&&e.subjectId!==observer.id)add({command:'defend',recipientId:e.speakerId,subjectId:e.subjectId,replyTo:e.id,claim:'positive',evidence:[...counter.details.evidence,discussionRef(e)],topicForReason:counter,weight:.4});

 }

 return discussionState().events.some(e=>!e.replyTo&&e.subjectId===c.subjectId&&e.claim===c.claim&&sources.every(s=>e.evidence.some(x=>x.source?.snapshot&&JSON.stringify(x.source.snapshot)===s)));
}
function strategyCandidateGoal(observer,c,plan){
 const negative=c.claim==='negative'||c.claim==='lynch',positive=c.claim==='positive'||c.claim==='keep'||c.command==='defend'||c.command==='rebut'&&c.claim==null;
 if(observer.role==='wolf'){
  const allies=buildPrivateInfo(observer).knownWolfAllies;
  if(allies.includes(c.subjectId))return negative?(c.subjectId===plan.cutId?'cutAlly':'avoidAllyPressure'):positive?(c.subjectId===plan.cutId?'avoidDoomedDefense':'protectAlly'):'neutral';
  if(c.subjectId===plan.pressureId&&negative)return 'redirectPressure';
 }else if(observer.role==='madman'){
  if(c.subjectId===plan.protectId)return positive?'protectPredictedWolf':negative?'avoidPredictedWolfPressure':'neutral';
  if(c.subjectId===plan.pressureId&&negative)return 'redirectPressure';
 }else if(observer.role==='fox'){
  if(c.subjectId===plan.protectId)return positive?'preserveWolf':negative?'avoidLastWolfPressure':'neutral';
  if(c.subjectId===plan.pressureId&&negative)return 'redirectPressure';
 }
 return 'neutral';
}
function strategicCandidateFactor(observer,c,plan){
 const goal=strategyCandidateGoal(observer,c,plan),stats=personalityProfile(observer)?.stats||{coordination:3,willingnessToCut:3};
 const factors={cutAlly:1.2+.2*stats.willingnessToCut,protectAlly:1.3+.2*stats.coordination,protectPredictedWolf:1.7,preserveWolf:1.8,redirectPressure:1.8,avoidAllyPressure:.2,avoidDoomedDefense:.25,avoidPredictedWolfPressure:.3,avoidLastWolfPressure:.2};
 let f=factors[goal]??1;
 if(plan.route==='credit'&&c.claim==='positive'&&byId(c.subjectId)?.claimed==='seer'&&goal==='protectAlly')f*=1.25;
 if(plan.route==='challenge'&&c.command==='question'&&byId(c.recipientId)?.claimed==='seer')f*=1.2;
 if(plan.route==='listen'&&['question','answer','hold'].includes(c.command))f*=1.15;
 if(plan.route==='compare'&&['organize','rebut'].includes(c.command))f*=1.15;
 return f;
}
const affinityDiscussionCandidates=discussionCandidates;
function normalizeNonFoxDiscussionCandidate(c){
 if(!c||c.topic?.variant!=='nonFox')return c;
 const copy={...c,claim:null,topic:{...c.topic,kind:'trust'}};copy.semanticReasonKey=discussionSemanticKey(copy);return copy;
}
discussionCandidates=observer=>{
 let base=affinityDiscussionCandidates(observer);if(!isStrategicDiscussionVillage())return base;
 // 「非狐」は非狼や白評価とは別。旧見立てのkind書換えに伴う負のclaimを引き継がない。
 base=base.map(normalizeNonFoxDiscussionCandidate);
 const pub=buildSpeechPublicInformation(),plan=buildDiscussionPlan(observer,pub),hostile=['wolf','madman','fox'].includes(observer.role),all=[...base];
 {
  // 文型そのものを人外専用にしない。村側は本人の既知情報・見立てに反する候補を除く。
  const personal=hostile?null:buildSpeechDecisionInformation(observer,pub),view=hostile?null:buildCharacterOutlook(observer,pub,false);
  const alternatives=strategyPublicAlternatives(observer,pub).filter(c=>{
   if(hostile)return true;
   const person=personal.people.people[c.subjectId];
   if(person?.conflictingCertainty)return false;
   if(person?.wolfStatus==='wolf'&&c.claim==='positive'||person?.wolfStatus==='nonWolf'&&c.claim==='negative')return false;
   if(c.variant==='reportedRoleComparison'){const assessment=view.roles.seer?.assessments[c.subjectId];return assessment?.view===(c.claim==='positive'?'true':'false');}
   return c.evidence.every(e=>personal.roles.roles.seer[e.source.snapshot.seerId]?.status!=='false');
  });
  for(const c of alternatives){c.semanticReasonKey=discussionSemanticKey(c);if(!discussionDay().keys.includes(c.semanticReasonKey)&&!base.some(b=>b.subjectId===c.subjectId&&b.claim===c.claim))all.push({...c,weight:c.weight*affinityCandidateFactor(observer,c)});}
  const remembered=new Set((state.affinity.argumentMemories[observer.id]||[]).map(m=>m.eventId));
  for(const e of discussionState().events.slice(-18)){
   if(!remembered.has(e.id)||e.speakerId===observer.id||!byId(e.speakerId)?.alive||!byId(e.subjectId)?.alive||(e.depth||0)>=3||!['negative','lynch'].includes(e.claim)||discussionState().events.some(x=>x.speakerId===observer.id&&x.replyTo===e.id))continue;
   const pair=[observer.id,e.speakerId].sort((a,b)=>a-b).join(':');if((discussionDay().pairs[pair]||0)>=3)continue;
   const counter=alternatives.find(c=>c.subjectId===e.subjectId&&c.claim==='positive');if(!counter)continue;
   const c={...counter,command:'defend',recipientId:e.speakerId,replyTo:e.id,originEventId:e.id,variant:counter.variant==='reportedRoleComparison'?'reportedRoleDefense':'reportedDefense',evidence:[...counter.evidence,discussionRef(e)],weight:.20};c.semanticReasonKey=discussionSemanticKey(c);
   if(!discussionDay().keys.includes(c.semanticReasonKey)&&!all.some(x=>x.command===c.command&&x.replyTo===e.id))all.push({...c,weight:c.weight*affinityCandidateFactor(observer,c)});
  }
 }
 return all.filter(c=>!discussionSelfConsideration(observer,c)&&!strategicRepeatedClaim(c)).map(c=>({...c,weight:c.weight*strategicCandidateFactor(observer,c,plan)}));
};
const affinityDiscussionText=discussionText;
discussionText=(observer,c)=>{
 if(!isStrategicDiscussionVillage()||!['reportedPossibility','reportedDefense','reportedRoleComparison','reportedRoleDefense'].includes(c.variant))return affinityDiscussionText(observer,c);
 const row=c.evidence.find(e=>e.type==='reportedResult')?.source.snapshot;
 if(!row)return affinityDiscussionText(observer,c);
 if(['reportedRoleComparison','reportedRoleDefense'].includes(c.variant)){
  const other=c.evidence.filter(e=>e.type==='reportedResult')[1].source.snapshot;
  const text=`${morningName(observer,row.seerId)}と${morningName(observer,other.seerId)}の${morningName(observer,row.targetId)}についての結果が割れている。今は${morningName(observer,c.subjectId)}を${c.claim==='positive'?'真':'偽'}寄りに見ている。結果が割れただけでどちらかが偽と確定するわけではない`;
  return affinityTone(observer,c,discussionVoice(observer,(c.command==='defend'?`${morningName(observer,c.recipientId)}の疑いには、その見方から擁護を加えたい。`:'')+text));
 }
 const basis=`${morningName(observer,row.seerId)}が${morningName(observer,row.targetId)}に${row.black?'黒':'白'}を報告している。この結果を材料の一つとして、${morningName(observer,row.targetId)}を${row.black?'疑う方向':'白寄り'}で考えたい。占い師が真かどうかで変わる予想だ`;
 return affinityTone(observer,c,discussionVoice(observer,c.command==='defend'?`${morningName(observer,c.recipientId)}の疑いには、別の結果も踏まえて擁護したい。${basis}`:basis));
};
function strategicIntuitionCategory(observer,c,goal){
 // 的中情報はここだけ。COM候補／感情解釈／公開projectionへ渡さない。
 if(goal==='neutral'||goal.startsWith('avoid'))return 'true';
 const target=byId(c.subjectId);if(!target||!c.claim)return 'fakeCorrect';
 if(['positive','negative','lynch'].includes(c.claim)){const actualPositive=['seer','medium'].includes(target.claimed)?target.role===target.claimed:target.role!=='wolf';return ((c.claim==='positive')===actualPositive)?'fakeCorrect':'fakeWrong';}
 return 'fakeCorrect';
}
function captureStrategicIntuition(observer,c,event,plan){
 const system=state.strategicDiscussion;if(system.intuitionEvents[event.id])return;
 const goal=strategyCandidateGoal(observer,c,plan),hostile=['wolf','madman','fox'].includes(observer.role),strategic=hostile&&goal!=='neutral'&&!goal.startsWith('avoid');
 system.intentions[event.id]={visibility:'private',ownerId:observer.id,goal,route:plan.route,strategic};
 // 根拠のある通常の擁護／反論も誤検知対象。question/answerには新機会を作らない。
 if(!['defend','rebut'].includes(c.command)||state.intuitionEnabled===false)return;
 const category=strategic?strategicIntuitionCategory(observer,c,goal):'true',deception=personalityProfile(observer)?.stats.deception??3;
 const judgments=[];
 for(const listener of living().filter(p=>!p.isSelf&&p.id!==observer.id)){
  const observation=personalityProfile(listener)?.stats.observation??3,p=intuitionDetectionProbability(observation,deception,category),rng=affinityRng(system.seed,event.id,listener.id,'strategicIntuition');
  const felt=affinityNext(rng)<p;listener.intuitionJudgments??=[];listener.intuitionJudgments.push({schemaVersion:1,eventId:'S:'+event.id,subjectId:observer.id,day:state.day,felt});judgments.push({ownerId:listener.id,felt});
 }
 system.intuitionEvents[event.id]={visibility:'private',category,deception,judgments};
}
const affinityCommitDiscussion=commitDiscussionSpeech;
commitDiscussionSpeech=(observer,c)=>{
 if(!isStrategicDiscussionVillage())return affinityCommitDiscussion(observer,c);
 if(!observer?.alive||observer.isSelf||state.phase!=='day'||state.winner||discussionSelfConsideration(observer,c)||!discussionEvidenceValid(c.evidence)||discussionDay().keys.includes(c.semanticReasonKey))return null;
 const saved=JSON.parse(JSON.stringify(state));
 try{const plan=buildDiscussionPlan(observer),event=affinityCommitDiscussion(observer,c);if(event)captureStrategicIntuition(observer,c,event,plan);return event;}catch(error){state=saved;throw error;}
};
function validateStrategicDiscussion(value){
 const s=value.strategicDiscussion,ids=new Set(value.players.map(p=>p.id)),events=new Set(value.discussion.events.map(e=>e.id));
 if(!s||s.schemaVersion!==1||s.visibility!=='private'||!Number.isInteger(s.seed)||s.seed!==affinityHash(value.affinity.seed+'|strategy')||!s.plans||!s.intentions||!s.intuitionEvents)return false;
 const routes=['compare','listen','credit','challenge','wait','supportSuspectedWolf','preserveLastWolf','avoidAttention'];
 for(const [id,p]of Object.entries(s.plans))if(!ids.has(+id)||p.ownerId!==+id||p.visibility!=='private'||!routes.includes(p.route)||!Number.isInteger(p.day)||p.day<1||p.day>value.day||!Number.isInteger(p.changedDay)||p.changedDay<1||p.changedDay>p.day||typeof p.informationKey!=='string'||!Array.isArray(p.history)||[p.protectId,p.pressureId,p.cutId].some(x=>x!=null&&(!ids.has(x)||x===+id)))return false;
 for(const [id,i]of Object.entries(s.intentions))if(!events.has(id)||i.visibility!=='private'||!ids.has(i.ownerId)||value.discussion.events.find(e=>e.id===id).speakerId!==i.ownerId||typeof i.strategic!=='boolean')return false;
 for(const [id,e]of Object.entries(s.intuitionEvents)){
  if(!events.has(id)||!s.intentions[id]||e.visibility!=='private'||!['true','fakeCorrect','fakeWrong'].includes(e.category)||!Number.isInteger(e.deception)||e.deception<1||e.deception>5||!Array.isArray(e.judgments)||new Set(e.judgments.map(j=>j.ownerId)).size!==e.judgments.length)return false;
  const event=value.discussion.events.find(x=>x.id===id);
  if(!['defend','rebut'].includes(event.command))return false;
  for(const j of e.judgments){const owner=value.players.find(p=>p.id===j.ownerId),felt=(owner?.intuitionJudgments||[]).filter(x=>x.eventId==='S:'+id);if(!owner||owner.isSelf||owner.id===event.speakerId||typeof j.felt!=='boolean'||felt.length!==1||felt[0].felt!==j.felt||felt[0].subjectId!==event.speakerId)return false;}
 }
 return true;
}
const affinityValidSavedGame=isValidSavedGame;
isValidSavedGame=value=>value?.discussionMode==='stage3'?affinityValidSavedGame({...value,discussionMode:'stage2'})&&validateStrategicDiscussion(value):affinityValidSavedGame(value);
const affinityPlayerDiscussionCandidate=playerDiscussionCandidate;
playerDiscussionCandidate=(subjectId,command)=>{const c=affinityPlayerDiscussionCandidate(subjectId,command);return isStrategicDiscussionVillage()?normalizeNonFoxDiscussionCandidate(c):c;};
