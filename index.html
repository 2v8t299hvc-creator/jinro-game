/* 自動選択は確定者を除外してから未占いを優先。明示指示は呼び出し側が扱う。 */
function isProtectedSeerTarget(target,confirmed=getPublicConfirmations()){
  if(confirmed.has(target.id))return true;
  if(target.claimed!=='resonator'||getPublicBreakdowns().has(target.id))return false;
  const claims=latestResonatorClaims(state.publicRecords.resonatorClaims||[]);
  const members=resonatorLineMembers(claims),count=publicRoleCount('resonator');
  if(count!=null&&members.size>count)return false;
  for(const claim of claims.values())for(const id of claim.partnerIds||[]){
    const partner=byId(id);
    if(partner?.alive&&partner.claimed&&partner.claimed!=='resonator')return false;
  }
  return true;
}
function preferredSeerTargets(observer,targets,results,confirmed=getPublicConfirmations()){
  const seen=new Set(results.map(r=>r.target??r.targetId));
  const useful=targets.filter(p=>p.id!==observer.id&&!isProtectedSeerTarget(p,confirmed));
  const fresh=useful.filter(p=>!seen.has(p.id));
  const pool=fresh.length?fresh:useful;
  const reported=new Set((state.publicRecords.seerResults||[]).filter(r=>r.seerId!==observer.id).map(r=>r.targetId));
  const tier=p=>p.claimed?2:reported.has(p.id)?1:0;
  const best=Math.min(...pool.map(tier));
  return pool.filter(p=>tier(p)===best);
}

// 襲撃の評価は決定的に作り、抽選は最後に1回だけ行う。数値は推定指標で確率ではない。
const WOLF_ATTACK_WEIGHTS={base:10,guardDiscount:0.70,executionDiscount:0.50,
  claimedCatPenalty:30,trueCatPenalty:55,failureStep:8,failureCap:25,
  middleWindow:15,endWindow:8,temperature:8};
function publicRoleTrustStrength(entry){
  if(!entry||entry.status==="false"||entry.conflictingCertainty)return 0;
  return entry.status==="true"?1:clamp((entry.score-50)/50,0,1)*clamp(entry.confidence/100,0,1);

function wolfAttackPublicContext(){
  const context=roleTrustPublicContext();
  const publicRoles=computeObserverRoleTrust(null,context,true);
  const wolves=state.players.filter(p=>p.alive&&p.role==="wolf");
  const knownWolves=new Set(wolves.flatMap(p=>[p.id,...buildPrivateInfo(p).knownWolfAllies]));
  const threats=wolves.map(p=>({observerId:p.id,
    model:computeWolfThreat(p,context,publicRoles,computeObserverRoleTrust(p,context))}));
  const knownRoles=new Map(context.people.map(p=>[p.id,publiclyKnownRoleFor(p.id,context.confirmed)]));
  const knightCount=context.counts.knight;
  const confirmedDeadKnights=context.people.filter(p=>!p.alive&&knownRoles.get(p.id)==="knight").length;
  // 全員COという指示だけでは護衛不在を断定しない。配役0か全員の公開死亡証明が必要。
  const noGuard=knightCount===0||Number.isInteger(knightCount)&&knightCount>0&&confirmedDeadKnights>=knightCount;
  const knightCandidates=noGuard?[]:context.people.filter(p=>p.alive&&!knownWolves.has(p.id)&&
    (!knownRoles.get(p.id)||knownRoles.get(p.id)==="knight")&&
    !(p.claimed==="knight"&&context.broken.has(p.id)));

function wolfAttackGuardRisk(target,attack){
  const {context,publicRoles,knownRoles,noGuard,knightCandidates}=attack;
  if(noGuard)return {score:0,noGuard:true,evidence:[{type:"publicGuardAbsent"}]};
  const possible=knightCandidates.filter(p=>p.id!==target.id);
  if(!possible.length)return {score:0,noGuard:false,evidence:[]};
  const evidence=[];
  // 公開記録の当夜・最後の指示だけ。本人のforcedGuardTarget/護衛日記は参照しない。
  let directed=0;
  for(const knight of possible){
    const instruction=guardInstructionForDay(knight,state.day+1);
    if(!instruction||instruction.targetId!==target.id)continue;
    const strength=knownRoles.get(knight.id)==="knight"?0.85:knight.claimed==="knight"?0.55:0.20;
    directed=Math.max(directed,strength);
    evidence.push({type:"guardInstruction",kind:instruction.kind,recipientId:knight.id,
      targetId:target.id,resultDay:instruction.resultDay,order:instruction.order,weight:strength});
  }
  // 指示が別人に出ている候補は自然護衛の見積もりから外す。有効な自護衛指示は代替先不明。
  const free=possible.some(p=>{
    const instruction=guardInstructionForDay(p,state.day+1);
    const destination=instruction&&context.people.find(x=>x.id===instruction.targetId&&x.alive);
    return !destination||destination.id===p.id;
  });
  let natural=0;
  if(free){
    const role=target.claimed;
    const entry=publicRoles.roles[role]?.[target.id];
    const strength=publicRoleTrustStrength(entry);
    if(role==="seer")natural=0.35*strength;
    else if(role==="medium")natural=0.20*strength;
    else if(context.knownVillageIds.has(target.id))natural=0.10;
    const informationCandidates=context.people.filter(p=>p.alive&&["seer","medium"].includes(p.claimed)&&
      !context.broken.has(p.id)).length;
    natural/=Math.sqrt(Math.max(1,informationCandidates));
    if(natural>0)evidence.push({type:"naturalGuardExpectation",weight:natural});
  }
  // 同じ保護理由を足し重ねない。複数の不確かな指示も最大値に留める。
  return {score:Math.max(directed,natural),noGuard:false,evidence};
}
function wolfAttackExecutionRisk(target,attack){
  const {context,publicRoles}=attack;
  if(context.knownVillageIds.has(target.id))return {score:0,evidence:[{type:"publicVillage"}]};
  if(context.broken.has(target.id))return {score:0.85,evidence:[{type:"publicBroken"}]};
  const latest=new Map();
  for(const row of context.seerRows.filter(x=>x.record.targetId===target.id)){
    const old=latest.get(row.record.seerId);
    if(!old||row.record.day>old.record.day||row.record.day===old.record.day&&
      (row.record.order??row.source.index)>=(old.record.order??old.source.index))latest.set(row.record.seerId,row);
  }
  const evidence=[];
  let score=0;
  for(const row of latest.values()){
    if(!row.record.black)continue;
    const strength=publicRoleTrustStrength(publicRoles.roles.seer[row.record.seerId]);
    if(strength<=0)continue;
    score=Math.max(score,0.70*strength);
    evidence.push({type:"crediblePublicBlack",seerId:row.record.seerId,
      day:row.record.day,order:row.record.order??null,weight:0.70*strength});
  }
  // 投票機能/発言からの処刑推定は未接続。黒だけで処刑確実にはしない。
  return {score,evidence};
}
function buildWolfAttackEvaluation(attack=wolfAttackPublicContext()){
  const candidates=[];
  if(attack.wolves.length)for(const target of attack.context.people){
    if(!target.alive||attack.knownWolves.has(target.id))continue;
    const observerScores=attack.threats.map(x=>({observerId:x.observerId,score:x.model.people[target.id].score}));
    const threat=observerScores.reduce((sum,x)=>sum+x.score,0)/observerScores.length;
    const guard=wolfAttackGuardRisk(target,attack),execution=wolfAttackExecutionRisk(target,attack);
    const publicCat=attack.knownRoles.get(target.id)==="cat";
    const claimedCat=target.claimed==="cat"&&!attack.context.broken.has(target.id);
    const catPenalty=publicCat?WOLF_ATTACK_WEIGHTS.trueCatPenalty:
      claimedCat?WOLF_ATTACK_WEIGHTS.claimedCatPenalty:0;
    // 旧保存のsuspectedFoxは襲撃失敗の記憶としてのみ使い、狐確定とは扱わない。
    const remembered=Number(state.wolfAI?.suspectedFox?.[target.id]);
    const failures=Number.isFinite(remembered)?Math.max(0,remembered):0;
    const failurePenalty=Math.min(WOLF_ATTACK_WEIGHTS.failureCap,failures*WOLF_ATTACK_WEIGHTS.failureStep);
    const score=(WOLF_ATTACK_WEIGHTS.base+threat)*(1-WOLF_ATTACK_WEIGHTS.guardDiscount*guard.score)*
      (1-WOLF_ATTACK_WEIGHTS.executionDiscount*execution.score)-catPenalty-failurePenalty;
    candidates.push({targetId:target.id,threat,observerScores,guard,execution,catPenalty,failurePenalty,
      score:Math.round(score*100)/100});
  }
  return {schemaVersion:1,basis:"wolfAttack",visibility:"private",updatedDay:state.day,
    updatedOrder:state.publicRecords?.publishClock||0,candidates};
}
function wolfAttackScore(target){
  return buildWolfAttackEvaluation().candidates.find(x=>x.targetId===target.id)?.score??-999;
}
function chooseWolfAttackTarget(){return chooseStrategicWolfAttack();}

// 狼陣営の路線と今夜の行動。診断・路線・抽選結果は私的な保存データ。
const WOLF_STRATEGY_VERSION=1;
function villageRoleCredit(entry){return !entry||entry.status==='false'||entry.conflictingCertainty?0:entry.status==='true'?100:clamp(entry.score,0,100);}
function elementarySubsetWeight(weights,k){
  if(k<0||k>weights.length)return 0;
  const dp=Array(k+1).fill(0);dp[0]=1;
  for(const w of weights)for(let j=k;j>0;j--)dp[j]+=dp[j-1]*w;
  return dp[k];
}
function buildKnightSurvivalModel(attack){
  const {context,knownRoles,knownWolves,publicRoles}=attack;
  const count=Number.isInteger(context.counts.knight)?Math.max(0,context.counts.knight):0;
  const publicPeople=computePublicPersonTrust(context,publicRoles);
  const candidates=context.people.filter(p=>!knownWolves.has(p.id)&&
    (!knownRoles.get(p.id)||knownRoles.get(p.id)==='knight')&&
    (!p.claimed||p.claimed==='knight')&&!context.broken.has(p.id));
  const fixed=candidates.filter(p=>knownRoles.get(p.id)==='knight');
  const unknown=candidates.filter(p=>knownRoles.get(p.id)!=='knight').map(p=>{
    let credit=clamp((publicPeople.people[p.id]?.score??50)/100,.05,.95);
    if(p.claimed==='knight'){
      for(const row of context.seerRows.filter(row=>row.record.targetId===p.id&&row.record.black))
        credit*=1-.75*villageRoleCredit(publicRoles.roles.seer[row.record.seerId])/100;
    }
    return {id:p.id,alive:p.alive,claimed:p.claimed,credit,weight:p.claimed==='knight'?1+5*credit:1};
  });
  const remaining=Math.min(Math.max(0,count-fixed.length),unknown.length);
  const denominator=elementarySubsetWeight(unknown.map(p=>p.weight),remaining);
  const probabilityNone=modifier=>{
    if(count===0)return 1;
    if(!denominator)return 0; // 不整合盤面では安全側へ倒す。
    const forced=fixed.reduce((n,p)=>n*modifier(p),1);
    return clamp(forced*elementarySubsetWeight(unknown.map(p=>p.weight*modifier(p)),remaining)/denominator,0,1);
  };
  const probabilities=Object.fromEntries(fixed.map(p=>[p.id,1]));
  for(const p of unknown)probabilities[p.id]=remaining&&denominator?
    clamp(p.weight*elementarySubsetWeight(unknown.filter(q=>q.id!==p.id).map(q=>q.weight),remaining-1)/denominator,0,1):0;
  return {count,fixed,unknown,remaining,probabilities,
    livingUnknown:unknown.filter(p=>p.alive&&!p.claimed).length,
    deadUnknown:unknown.filter(p=>!p.alive&&!p.claimed).length,
    survival:1-probabilityNone(p=>p.alive?0:1),probabilityNone};
}
function wolfSeerGuardConcentrations(attack){
  const seers=attack.context.people.filter(p=>p.alive&&p.claimed==='seer'&&!attack.context.broken.has(p.id));
  const weights=seers.map(p=>({id:p.id,credit:villageRoleCredit(attack.publicRoles.roles.seer[p.id])}));
  const total=weights.reduce((n,p)=>n+Math.exp((p.credit-50)/15),0);
  return Object.fromEntries(weights.map(p=>[p.id,.9*Math.exp((p.credit-50)/15)/total]));
}
function strategicGuardChance(knight,target,attack,concentrations){
  if(!knight.alive||knight.id===target.id)return 0;
  const seerTotal=Object.keys(concentrations).length;
  const others=attack.context.people.filter(p=>p.alive&&p.id!==knight.id&&!Object.hasOwn(concentrations,p.id));
  const natural=concentrations[target.id]??(others.length?(seerTotal?.1:1)/others.length:0);
  const instruction=guardInstructionForDay(knight,state.day+1);
  const destination=instruction&&attack.context.people.find(p=>p.id===instruction.targetId&&p.alive&&p.id!==knight.id);
  if(!destination)return natural;
  const strength=instruction.kind==='public'?.95:.90;
  return target.id===destination.id?Math.max(strength,natural):(1-strength)*natural;
}
function ownWolfBlackSources(targetId,attack){
  return [...new Set(attack.context.seerRows.filter(row=>row.record.targetId===targetId&&row.record.black&&
    attack.knownWolves.has(row.record.seerId)&&attack.context.people.some(p=>p.id===row.record.seerId&&p.alive&&p.claimed==='seer')&&
    !attack.context.broken.has(row.record.seerId)).map(row=>row.record.seerId))];
}
function buildStrategicWolfAttack(){
  const attack=wolfAttackPublicContext(),baseline=buildWolfAttackEvaluation(attack);
  const knight=buildKnightSurvivalModel(attack),concentrations=wolfSeerGuardConcentrations(attack);
  const style=attack.wolves.length?attack.wolves.reduce((sum,w)=>{
    const stats=w.characterProfile?.stats||CHARACTER_ROSTER.find(p=>p.id===w.characterId)?.stats;
    return sum+(stats?(stats.emotionality-stats.logic)/24:0);
  },0)/attack.wolves.length:0;
  const seers=attack.context.people.filter(p=>p.alive&&p.claimed==='seer'&&!attack.context.broken.has(p.id)&&!attack.knownWolves.has(p.id));
  const own=attack.context.people.filter(p=>p.alive&&p.claimed==='seer'&&!attack.context.broken.has(p.id)&&attack.knownWolves.has(p.id));
  const privateRoles=attack.threats.map(w=>computeObserverRoleTrust(byId(w.observerId),attack.context));
  const candidates=baseline.candidates.map(c=>{
    const target=attack.context.people.find(p=>p.id===c.targetId);
    const guardRisk=1-knight.probabilityNone(k=>1-strategicGuardChance(k,target,attack,concentrations));
    const concentration=concentrations[target.id]??0;
    const A=[.2,.4,.7,1][Math.min(3,knight.deadUnknown)];
    const modifier=knight.survival===0?1:1-concentration*(1-A);
    const challengeProbability=clamp(.65*(1-guardRisk)*modifier*(1+style),.02,.85);
    const ownBlackSources=ownWolfBlackSources(target.id,attack);
    const friendlyFakeBlack=attack.context.seerRows.filter(row=>row.record.targetId===target.id&&row.record.black&&
      !attack.knownWolves.has(row.record.seerId)&&privateRoles.some(model=>model.roles.seer[row.record.seerId]?.status==='false'));
    const friendlyPenalty=friendlyFakeBlack.length?20:0;
    const score=(WOLF_ATTACK_WEIGHTS.base+c.threat)*(1-.7*guardRisk)*(1-.5*c.execution.score)-c.catPenalty-c.failurePenalty-friendlyPenalty;
    return {...c,guardRisk,concentration,challengeProbability,knightProbability:knight.probabilities[target.id]||0,
      ownBlackSources,friendlyPenalty,strategyScore:score};
  });
  const safe=candidates.filter(c=>!c.ownBlackSources.length);
  const allowed=safe.length?safe:candidates;
  const relevant=seers.map(p=>allowed.find(c=>c.targetId===p.id)).filter(Boolean);
  const primary=[...relevant].sort((a,b)=>
    (.65*villageRoleCredit(attack.publicRoles.roles.seer[b.targetId])/100+.35*b.threat/100)-
    (.65*villageRoleCredit(attack.publicRoles.roles.seer[a.targetId])/100+.35*a.threat/100)||a.targetId-b.targetId)[0];
  const hunts=allowed.filter(c=>c.knightProbability>0&&c.targetId!==primary?.targetId&&c.catPenalty===0);
  const rivalCredit=Math.max(0,...relevant.map(c=>villageRoleCredit(attack.publicRoles.roles.seer[c.targetId])));
  const ownCredit=Math.max(0,...own.map(p=>villageRoleCredit(attack.publicRoles.roles.seer[p.id])));
  const C=own.length?clamp(.5+(ownCredit-rivalCredit)/100,0,1):0;
  const T=primary?clamp(primary.threat/100,0,1):0;
  const prior=knight.count/Math.max(1,knight.fixed.length+knight.unknown.length);
  const H=hunts.length?clamp(Math.max(...hunts.map(c=>c.knightProbability*(1-c.execution.score)))/Math.max(.1,prior),0,1):0;
  const P=primary?.challengeProbability??0;
  const scores={credit:60*C+20*(1-T)+20*(1-P),challenge:40*T+35*H+25*P};
  const stored=state.wolfAI?.strategy;
  const previous=stored?.schemaVersion===WOLF_STRATEGY_VERSION?stored:null;
  let route=primary?(own.length?(scores.credit>=scores.challenge?'credit':'challenge'):'challenge'):'wait';
  let reason=!primary?'noPublicSeer':!own.length?'noViableWolfSeer':'scoreComparison';
  if(previous&&previous.route!=='wait'&&primary&&own.length){
    route=previous.route;
    const rival=route==='credit'?'challenge':'credit';
    if(state.day-previous.changedDay>=2&&scores[rival]>=scores[route]+15){route=rival;reason='advantageOver15';}
    else reason='maintainRoute';
  }
  if(previous?.route==='credit'&&!own.length&&primary)reason='wolfSeerLost';
  const changed=!previous||route!==previous.route;
  const history=changed?[...(previous?.history||[]),{day:state.day,from:previous?.route||null,to:route,reason}].slice(-16):previous.history;
  const strategy={schemaVersion:1,visibility:'private',route,changedDay:changed?state.day:previous.changedDay,
    reason,scores,history,primarySeerId:primary?.targetId??null};
  return {schemaVersion:1,visibility:'private',basis:'wolfStrategy',day:state.day,baseline,strategy,
    knight:{count:knight.count,survival:knight.survival,livingUnknown:knight.livingUnknown,deadUnknown:knight.deadUnknown,
      candidates:[...knight.fixed.map(p=>({id:p.id,alive:p.alive,confirmed:true})),...knight.unknown],probabilities:knight.probabilities},
    concentrations,candidates,allowedTargetIds:allowed.map(c=>c.targetId),huntTargetIds:hunts.map(c=>c.targetId),
    primarySeerId:primary?.targetId??null,challengeProbability:P,emergencyOwnBlack:!safe.length&&!!candidates.length};
}
function chooseStrategicWolfAttack(){
  const old=state.wolfAI?.attackDecision;
  if(old?.day===state.day){
    const target=old.targetId==null?null:byId(old.targetId);
    if(target==null||target.alive&&target.role!=='wolf')return target;
  }
  const e=buildStrategicWolfAttack(),allowed=e.candidates.filter(c=>e.allowedTargetIds.includes(c.targetId));
  let pool=allowed,action='fallback';
  const primary=allowed.find(c=>c.targetId===e.primarySeerId);
  if(e.strategy.route==='challenge'&&primary){
    if(Math.random()<e.challengeProbability){pool=allowed.filter(c=>c.targetId===primary.targetId);action='seerChallenge';}
    else if(e.huntTargetIds.length){pool=allowed.filter(c=>e.huntTargetIds.includes(c.targetId));action='knightHunt';}
  }else if(e.strategy.route==='credit'){
    const creditPool=allowed.filter(c=>byId(c.targetId).claimed!=='seer');
    if(creditPool.length)pool=creditPool;
    action='creditPressure';
  }
  let selected=null;
  if(pool.length){
    const best=Math.max(...pool.map(c=>c.strategyScore));
    const window=living().length<=5?WOLF_ATTACK_WEIGHTS.endWindow:WOLF_ATTACK_WEIGHTS.middleWindow;
    const close=pool.filter(c=>best-c.strategyScore<=window);
    const weights=close.map(c=>({...c,weight:Math.exp((c.strategyScore-best)/WOLF_ATTACK_WEIGHTS.temperature)}));
    let draw=Math.random()*weights.reduce((n,c)=>n+c.weight,0);
    selected=weights.at(-1).targetId;
    for(const c of weights){draw-=c.weight;if(draw<=0){selected=c.targetId;break;}}
  }
  state.wolfAI=state.wolfAI||{suspectedFox:{},lastAttackTarget:null,lastAttackWasPeace:false};
  state.wolfAI.strategy=e.strategy;
  state.wolfAI.attackEvaluation={...e.baseline,selectedTargetId:selected};
  state.wolfAI.strategicAttackEvaluation={...e,selectedTargetId:selected,action};
  state.wolfAI.attackDecision={day:state.day,targetId:selected,action,route:e.strategy.route};
  return selected==null?null:byId(selected);
}

function updateWolfAIAfterNight(attacked,guardTargets,attackDied){
  if(!state.wolfAI) state.wolfAI={suspectedFox:{},lastAttackTarget:null,lastAttackWasPeace:false};
  state.wolfAI.lastAttackTarget=attacked?.id ?? null;

  if(!attacked){
    state.wolfAI.lastAttackWasPeace=false;
    return;
  }

  // 狼が観測できるのは襲撃対象の生死だけ。護衛成功か狐噛みかは不明。
  const peace=!attackDied;

  state.wolfAI.lastAttackWasPeace=peace;

  // 原因不明の襲撃失敗を記憶。護衛対象引数は結果解決用で、この記憶には使わない。
  if(peace){
    let delta=0.9;
    if(attacked.claimed==="cat") delta=0.2;
    state.wolfAI.suspectedFox[attacked.id]=(state.wolfAI.suspectedFox[attacked.id]||0)+delta;
  }else{
    // 噛めた相手は狐ではないと判断
    state.wolfAI.suspectedFox[attacked.id]=0;
  }
}

// 公開基準と個人の役職信用。通常発言は個人判断で候補を選別し、根拠は公開基準で作る。
const ROLE_TRUST_SCHEMA_VERSION=1;
const ROLE_TRUST_WEIGHTS={publicMatch:12,privateMatch:8,knownNonWolfWhite:3,knownWolfBlack:3};
function roleTrustPublicContext(){
  // 解決器の旧記録補完が保存前の実状態を書き換えないよう、公開記録のコピーで評価。
  const original=state;
  let truth,records;
  try{
    state={...original,publicRecords:JSON.parse(JSON.stringify(original.publicRecords||{}))};
    truth=solvePublicTruth();records=state.publicRecords;
  }finally{state=original;}
  const rows=collection=>(records[collection]||[]).map((r,index)=>({record:r,source:{
    collection,index,day:r.day??null,order:r.order??null,
    snapshot:{...r}}}));
  return {confirmed:truth.confirmed,broken:truth.broken,
    counts:{...(state.publicRoleCounts||{})},
    knownVillageIds:new Set(truth.confirmed.keys()),
    people:state.players.map(p=>({id:p.id,claimed:p.claimed,alive:p.alive})),
    claimants:state.players.filter(p=>["seer","medium"].includes(p.claimed))
      .map(p=>({id:p.id,role:p.claimed})),
    seerRows:rows("seerResults"),mediumRows:rows("mediumResults")};
}
function computeObserverRoleTrust(observer,context,publicOnly=false){
  const privateInfo=publicOnly?{selfRole:null,knownWolfAllies:[]}:buildPrivateInfo(observer);
  const knownWolves=new Set(privateInfo.knownWolfAllies);
  if(privateInfo.selfRole==="wolf")knownWolves.add(observer.id);
  const roles={seer:{},medium:{}};
  for(const candidate of context.claimants){
    const evidence=new Map();
    const add=(key,type,delta,visibility,sources=[],verdict=null)=>{
      // 同対象の一致加点は1回。公開+12と本人+8なら強い方だけ。
      if(!evidence.has(key)||key.startsWith("match:")&&delta>evidence.get(key).delta)
        evidence.set(key,{key,type,delta,visibility,sources,verdict});
    };
    const id=candidate.id,role=candidate.role;
    if(context.confirmed.has(id))add("publicConfirmed","publicConfirmed",0,"public",[],"true");
    if(context.broken.has(id))add("publicBroken","publicBroken",0,"public",[],"false");
    // 本人は自分の役職を知る。配役が同役職1人なら対抗の偽も知る。
    if(!publicOnly&&id===observer.id)add("ownRole","ownRole",0,"private",[],privateInfo.selfRole===role?"true":"false");
    else if(privateInfo.selfRole===role&&context.counts[role]===1)
      add("onlyRoleHolder","onlyRoleHolder",0,"private",[],"false");
    if(knownWolves.has(id))add("knownWolfClaimant","knownWolfClaimant",0,"private",[],"false");
    const ownRows=(role==="seer"?context.seerRows:context.mediumRows)
      .filter(x=>x.record[role==="seer"?"seerId":"mediumId"]===id);
    const otherRows=role==="seer"?context.mediumRows:context.seerRows;
    for(const row of ownRows){
      const r=row.record;
      if(r.black&&context.knownVillageIds.has(r.targetId))
        add(`knownVillageBlack:${r.targetId}`,"knownVillageBlack",0,"public",[row.source],"false");
      // 真確定している反対側の役職との一致だけを加点。未確定同士のラインは加点しない。
      const partnerKey=role==="seer"?"mediumId":"seerId";
      const matches=otherRows.filter(x=>x.record.targetId===r.targetId&&context.confirmed.has(x.record[partnerKey]));
      for(const other of matches){
        if(!!r.black!==!!other.record.black)
          add(`publicConflict:${r.targetId}`,"confirmedResultConflict",0,"public",[row.source,other.source],"false");
        else add(`match:${r.targetId}`,"confirmedResultMatch",ROLE_TRUST_WEIGHTS.publicMatch,"public",[row.source,other.source]);
      }
      if(role==="seer"){
        // 生存狐は自分への占い報告が真占いのものではないと本人だけが分かる。
        // 公開された報告は根拠の一部だが、狐の正体と生存による推論は非公開。
        if(!publicOnly&&privateInfo.selfRole==="fox"&&observer.alive&&divinationKillsFox(r.day)&&r.targetId===observer.id){
          add("survivingFoxResult","survivingFoxResult",0,"private",[row.source],"false");
        }else if(!publicOnly&&r.targetId===observer.id&&!knownWolves.has(observer.id)){
          if(r.black)add("selfBlack","selfBlack",0,"private",[row.source],"false");
          else add(`match:${r.targetId}`,"selfWhite",ROLE_TRUST_WEIGHTS.knownNonWolfWhite,"private",[row.source]);
        }
        if(knownWolves.has(r.targetId)){
          if(!r.black)add(`wolfWhite:${r.targetId}`,"knownWolfWhite",0,"private",[row.source],"false");
          else add(`match:${r.targetId}`,"knownWolfBlack",ROLE_TRUST_WEIGHTS.knownWolfBlack,"private",[row.source]);
        }
      }else if(knownWolves.has(r.targetId)){
        if(!r.black)add(`wolfWhite:${r.targetId}`,"knownWolfWhite",0,"private",[row.source],"false");
        else add(`match:${r.targetId}`,"knownWolfBlack",ROLE_TRUST_WEIGHTS.knownWolfBlack,"private",[row.source]);
      }
      // 真役職本人の未公表結果は、その本人の見立てにだけ利用。
      const privateResults=publicOnly||id===observer.id?[]:
        privateInfo.selfRole==="medium"?observer.mediumResults:
        privateInfo.selfRole==="seer"?observer.seerResults:[];
      for(const own of privateResults||[]){
        if(own.target!==r.targetId)continue;
        if(!!own.black!==!!r.black)
          add(`privateConflict:${r.targetId}`,"ownResultConflict",0,"private",[row.source],"false");
        else add(`match:${r.targetId}`,"ownResultMatch",ROLE_TRUST_WEIGHTS.privateMatch,"private",[row.source]);
      }
    }
    const reasons=[...evidence.values()];
    const hasTrue=reasons.some(x=>x.verdict==="true"),hasFalse=reasons.some(x=>x.verdict==="false");
    const status=hasFalse?"false":hasTrue?"true":"unconfirmed";
    const score=status==="true"?100:status==="false"?0:clamp(50+reasons.reduce((n,x)=>n+x.delta,0),1,99);
    const confidence=status!=="unconfirmed"?100:Math.min(99,reasons.reduce((n,x)=>n+Math.abs(x.delta),0));
    roles[role][id]={claimantId:id,role,score,confidence,status,
      certaintyScope:status==="unconfirmed"?null:reasons.some(x=>x.verdict===status&&x.visibility==="public")?"public":"private",
      conflictingCertainty:hasTrue&&hasFalse,evidence:JSON.parse(JSON.stringify(reasons))};
  }
  return {schemaVersion:ROLE_TRUST_SCHEMA_VERSION,updatedDay:state.day,
    updatedOrder:state.publicRecords.publishClock||0,roles};
}
// 公開情報だけの人物信用。個人のroleTrustや未公開結果を読まない。
const PERSON_TRUST_SCHEMA_VERSION=1;
const PERSON_TRUST_WEIGHTS={white:8,black:25,whiteCap:16,blackCap:50,material:20};
function computePublicPersonTrust(context,publicRoles){
  const people={};
  for(const target of context.people.filter(p=>!p.claimed)){
    const evidence=[];
    let white=0,black=0,material=0,knownWolf=false,knownNonWolf=false;
    const knownVillage=context.confirmed.has(target.id);
    if(knownVillage){
      knownNonWolf=true;
      evidence.push({key:"knownVillage",type:"publicConfirmedVillage",visibility:"public",delta:0});
    }
    // 一人の占い師からは同対象の最新結果だけを使う。公開矛盾のある占い師は下で除外。
    const latest=new Map();
    for(const row of context.seerRows.filter(x=>x.record.targetId===target.id)){
      const previous=latest.get(row.record.seerId);
      if(!previous||row.record.day>previous.record.day||row.record.day===previous.record.day&&
        (row.record.order??row.source.index)>=(previous.record.order??previous.source.index))latest.set(row.record.seerId,row);
    }
    for(const [seerId,row] of latest){
      const trust=publicRoles.roles.seer[seerId];
      if(!trust||trust.status==="false")continue;
      const strength=trust.status==="true"?1:Math.max(0,(trust.score-50)/50)*(trust.confidence/100);
      if(strength<=0)continue;
      const isBlack=!!row.record.black;
      const delta=(isBlack?-PERSON_TRUST_WEIGHTS.black:PERSON_TRUST_WEIGHTS.white)*strength;
      if(isBlack)black-=delta;else white+=delta;
      material+=PERSON_TRUST_WEIGHTS.material*strength;
      if(trust.status==="true"){if(isBlack)knownWolf=true;else knownNonWolf=true;}
      evidence.push({key:`seer:${seerId}`,type:isBlack?"seerBlack":"seerWhite",visibility:"public",
        source:row.source,roleTrust:{score:trust.score,confidence:trust.confidence,status:trust.status},strength,delta});
    }
    const conflictingCertainty=knownWolf&&knownNonWolf;
    const wolfStatus=conflictingCertainty?"conflict":knownWolf?"wolf":knownNonWolf?"nonWolf":"unknown";
    const villageStatus=conflictingCertainty?"unknown":knownVillage?"village":knownWolf?"nonVillage":"unknown";
    const score=villageStatus==="village"?100:villageStatus==="nonVillage"?0:
      clamp(50+Math.min(PERSON_TRUST_WEIGHTS.whiteCap,white)-Math.min(PERSON_TRUST_WEIGHTS.blackCap,black),1,99);
    people[target.id]={targetId:target.id,score:Math.round(score*100)/100,
      confidence:wolfStatus!=="unknown"&&wolfStatus!=="conflict"?100:Math.min(99,Math.round(material*100)/100),
      wolfStatus,villageStatus,certaintyScope:wolfStatus!=="unknown"&&wolfStatus!=="conflict"?"public":null,
      conflictingCertainty,evidence};
  }
  return {schemaVersion:PERSON_TRUST_SCHEMA_VERSION,basis:"public",updatedDay:state.day,
    updatedOrder:state.publicRecords.publishClock||0,people};
}

// 個人の見立ては公開基準とは別に保存。候補選別に使い、文面・公開根拠へ渡さない。
function computePrivatePersonTrust(observer,publicPeople){
  const result=JSON.parse(JSON.stringify(publicPeople));
  result.basis="personal";
  const info=buildPrivateInfo(observer);
  const knownWolves=new Set(info.knownWolfAllies);
  if(info.selfRole==="wolf")knownWolves.add(observer.id);
  result.knownWolfIds=[...knownWolves].sort((a,b)=>a-b);
  const ownRoleIsVillage=["villager","seer","medium","knight","resonator","cat"].includes(info.selfRole);
  const ownRoleIsNonWolf=info.selfRole!=="wolf";
  const ownRoleIsHostile=["wolf","madman","fox"].includes(info.selfRole);
  const collection=info.selfRole==="seer"?"seerResults":info.selfRole==="medium"?"mediumResults":null;
  const ownRows=collection?(observer[collection]||[]):[];
  for(const entry of Object.values(result.people)){
    const baseline=publicPeople.people[entry.targetId];
    entry.publicBaseline={score:baseline.score,confidence:baseline.confidence,wolfStatus:baseline.wolfStatus,
      villageStatus:baseline.villageStatus,certaintyScope:baseline.certaintyScope};
    const privateEvidence=[];
    let wolf=false,nonWolf=false,village=false,nonVillage=false;
    if(entry.targetId===observer.id){
      wolf=info.selfRole==="wolf";nonWolf=ownRoleIsNonWolf;village=ownRoleIsVillage;nonVillage=ownRoleIsHostile;
      privateEvidence.push({key:"ownIdentity",type:"ownIdentity",visibility:"private",wolf,nonWolf,village,nonVillage});
    }
    if(knownWolves.has(entry.targetId)){
      wolf=true;
      privateEvidence.push({key:"knownWolf",type:"knownWolf",visibility:"private",targetId:entry.targetId});
    }
    // 同対象の本人結果は1件にまとめる。矛盾した旧データは隠さずconflictとして記録。
    const matches=ownRows.map((r,index)=>({record:r,index})).filter(x=>x.record.target===entry.targetId);
    const resultsByColor=new Map();
    for(const row of matches)resultsByColor.set(!!row.record.black,row);
    for(const [black,row] of resultsByColor){
      if(black)wolf=true;else nonWolf=true;
      const r=row.record,ownerKey=collection==="seerResults"?"seerId":"mediumId";
      const publishedIndex=(state.publicRecords?.[collection]||[]).findIndex(x=>x[ownerKey]===observer.id&&
        x.targetId===r.target&&x.day===r.day&&!!x.black===black);
      // 結果の報告有無と、「本人が真だと知る」私的な確定根拠は別。
      privateEvidence.push({key:`ownResult:${black}`,type:collection==="seerResults"?"ownSeerResult":"ownMediumResult",
        visibility:"private",resultVisibility:publishedIndex>=0?"public":"private",
        source:{observerId:observer.id,collection,index:row.index,day:r.day,targetId:r.target,black},
        publishedSource:publishedIndex>=0?{collection,index:publishedIndex}:null});
    }
    if(wolf||nonWolf){
      entry.conflictingCertainty=baseline.conflictingCertainty||wolf&&nonWolf||
        wolf&&baseline.wolfStatus==="nonWolf"||nonWolf&&baseline.wolfStatus==="wolf";
      if(wolf&&nonWolf){
        entry.wolfStatus="conflict";entry.villageStatus="unknown";
        entry.score=clamp(baseline.score,1,99);entry.confidence=99;entry.certaintyScope=null;
      }else{
        // 確かな本人情報を優先し、公開基準との不整合もフラグで残す。
        entry.wolfStatus=wolf?"wolf":"nonWolf";
        entry.villageStatus=wolf||nonVillage?"nonVillage":village?"village":baseline.villageStatus==="village"?"village":"unknown";
        entry.score=entry.villageStatus==="nonVillage"?0:entry.villageStatus==="village"?100:Math.max(58,baseline.score);
        entry.confidence=100;
        const samePublic=baseline.wolfStatus===entry.wolfStatus&&
          baseline.villageStatus===entry.villageStatus;
        entry.certaintyScope=samePublic?"public":"private";
      }
    }
    entry.privateEvidence=privateEvidence;
    entry.evidence.push(...privateEvidence);
  }
  return applySocialPersonTrust(observer,result);
}
// 発言用の信用は公開記録から作った基準だけ。個人版の数値/確定/根拠を投影しない。
function getSpeechPersonTrust(observer,targetId){
  if(observer.personTrust?.basis!=="public")return null;
  const entry=observer.personTrust.people?.[targetId];
  if(!entry||entry.certaintyScope==="private"||(entry.evidence||[]).some(e=>e.visibility!=="public"))return null;
  return JSON.parse(JSON.stringify(entry));
}

// 狼の表向き評価は公開基準から独立コピー。擁護/身内切り方針は次の段階。
function computeWolfOutwardTrust(observer,publicPeople,publicRoles){
  if(observer.role!=="wolf")return null;
  return {schemaVersion:1,basis:"outward",policy:"publicBaseline",updatedDay:state.day,
    updatedOrder:state.publicRecords.publishClock||0,
    people:JSON.parse(JSON.stringify(publicPeople.people)),
    roles:JSON.parse(JSON.stringify(publicRoles.roles))};
}
const WOLF_THREAT_WEIGHTS={trueSeer:35,trueMedium:20,credibleSeer:30,credibleMedium:15,
  livingWolfBlack:25,deadWolfBlack:10,publicVillage:25};
function computeWolfThreat(observer,context,publicRoles,personalRoles){
  if(observer.role!=="wolf")return null;
  const knownWolves=new Set([observer.id,...buildPrivateInfo(observer).knownWolfAllies]);
  const aliveIds=new Set(context.people.filter(p=>p.alive).map(p=>p.id));
  const people={};
  for(const target of context.people){
    const excludedReason=target.id===observer.id?"self":knownWolves.has(target.id)?"knownWolf":
      !target.alive?"dead":null;
    const evidence=[];
    if(!excludedReason){
      const role=["seer","medium"].includes(target.claimed)?target.claimed:null;
      const publicTrust=role?publicRoles.roles[role][target.id]:null;
      const personalTrust=role?personalRoles.roles[role][target.id]:null;
      // 真の能力と公開信用は同じ枠。真確定に信用分を重ねて足さない。
      if(personalTrust?.status==="true"&&!personalTrust.conflictingCertainty){
        evidence.push({key:"roleAbility",type:"knownTrueRole",visibility:personalTrust.certaintyScope,
          delta:role==="seer"?WOLF_THREAT_WEIGHTS.trueSeer:WOLF_THREAT_WEIGHTS.trueMedium,
          role,trust:JSON.parse(JSON.stringify(personalTrust))});
      }else if(publicTrust&&publicTrust.status!=="false"){
        const strength=publicTrust.status==="true"?1:Math.max(0,(publicTrust.score-50)/50)*(publicTrust.confidence/100);
        const delta=(role==="seer"?WOLF_THREAT_WEIGHTS.credibleSeer:WOLF_THREAT_WEIGHTS.credibleMedium)*strength;
        if(delta>0)evidence.push({key:"roleAbility",type:"publicRoleCredibility",visibility:"public",delta,role,
          trust:JSON.parse(JSON.stringify(publicTrust))});
      }
      // 黒の圧力は真偽と別。私的に偽でも公開で破綻していなければ仲間を吊らせ得る。
      if(role==="seer"&&publicTrust?.status!=="false"){
        const latest=new Map();
        for(const row of context.seerRows.filter(x=>x.record.seerId===target.id)){
          const old=latest.get(row.record.targetId);
          if(!old||row.record.day>old.record.day||row.record.day===old.record.day&&
            (row.record.order??row.source.index)>=(old.record.order??old.source.index))latest.set(row.record.targetId,row);
        }
        const blackRows=[...latest.values()].filter(x=>x.record.black&&knownWolves.has(x.record.targetId));
        if(blackRows.length){
          const delta=Math.min(WOLF_THREAT_WEIGHTS.livingWolfBlack,blackRows.reduce((sum,row)=>sum+
            (aliveIds.has(row.record.targetId)?WOLF_THREAT_WEIGHTS.livingWolfBlack:WOLF_THREAT_WEIGHTS.deadWolfBlack),0));
          evidence.push({key:"wolfBlackPressure",type:"blackOnKnownWolf",visibility:"private",delta,
            sources:blackRows.map(x=>JSON.parse(JSON.stringify(x.source)))});
        }
      }
      if(context.knownVillageIds.has(target.id))evidence.push({key:"publicVillage",type:"publicVillageProtection",
        visibility:"public",delta:WOLF_THREAT_WEIGHTS.publicVillage});
    }
    people[target.id]={targetId:target.id,eligible:!excludedReason,excludedReason,
      score:Math.round(clamp(evidence.reduce((sum,e)=>sum+e.delta,0),0,100)*100)/100,evidence};
  }
  return {schemaVersion:1,basis:"wolfThreat",visibility:"private",updatedDay:state.day,
    updatedOrder:state.publicRecords.publishClock||0,people};
}
// 将来の狼発言用境界。脅威度・私的確定・私的根拠を受け付けない。
function getWolfSpeechTrust(observer,targetId){
  const model=observer.wolfOutwardTrust;
  if(observer.role!=="wolf"||model?.basis!=="outward"||model.policy!=="publicBaseline")return null;
  const role=byId(targetId)?.claimed;
  const entry=model.roles?.[role]?.[targetId]||model.people?.[targetId];
  if(!entry||entry.certaintyScope==="private"||(entry.evidence||[]).some(e=>e.visibility!=="public"))return null;
  return JSON.parse(JSON.stringify(entry));
}

// 判断用と発言根拠用は別の入口。個人信用から公開根拠を切り出さず公開盤面から再計算。
function buildSpeechPublicInformation(){
  const context=roleTrustPublicContext();
  const roles=computeObserverRoleTrust(null,context,true);
  const people=computePublicPersonTrust(context,roles);
  return {visibility:"public",context,roles,people};
}
function buildPersonalDecisionInformation(observer,publicInformation=buildSpeechPublicInformation()){
  return {visibility:"private",observerId:observer.id,
    roles:getPersonalityRoleTrust(observer,publicInformation.context),
    people:computePrivatePersonTrust(observer,publicInformation.people)};
}
// 人狼は表向きの公開基準のみ。他役職は本人情報で候補を選別し、根拠は公開モデルから作る。
function buildSpeechDecisionInformation(observer,publicInformation){
  if(observer.role==="wolf")return {roles:getPersonalityRoleTrust(observer,publicInformation.context,true),people:applySocialPersonTrust(observer,JSON.parse(JSON.stringify(publicInformation.people)),true)};
  return buildPersonalDecisionInformation(observer,publicInformation);
}
function personalSpeechWeight(personalScore,publicScore,positive){
  const eligible=score=>positive?score>=58:score<=42;
  if(!eligible(personalScore))return 0;
  const sameDirection=positive?publicScore>50:publicScore<50;
  if(!sameDirection)return 0;
  return Math.min(20,Math.abs(personalScore-50),Math.abs(publicScore-50));
}
// 文面と記録の直前にも境界を確認。私的根拠が混ざった提案は全体を保留へ戻す。
function hasPrivateSpeechData(value){
  if(!value||typeof value!=="object")return false;
  if(value.visibility==="private"||value.certaintyScope==="private"||value.basis==="personal"||value.basis==="wolfThreat")return true;
  return Object.values(value).some(hasPrivateSpeechData);
}
function copyPublicSpeechEvidence(evidence){
  if(!Array.isArray(evidence)||evidence.some(e=>!e||e.visibility!=="public"||hasPrivateSpeechData(e)))
    throw new Error("Private evidence cannot be published as COM speech");
  return JSON.parse(JSON.stringify(evidence));
}
function publicSpeechTopic(topic){
  try{
    copyPublicSpeechEvidence(topic.details?.evidence||[]);
    if(hasPrivateSpeechData(topic))throw new Error("Private speech topic");
    return topic;
  }catch{
    return {kind:"none",targetId:null,variant:"basicWait",details:{}};
  }
}

function refreshRoleTrust(){
  if(!state)return;
  const context=roleTrustPublicContext();
  state.publicRoleTrust=computeObserverRoleTrust(null,context,true);
  const publicPeople=computePublicPersonTrust(context,state.publicRoleTrust);
  // 死亡後の見立ては更新しない。生存者は同じ公開盤面から独立して計算。
  for(const observer of state.players.filter(p=>p.alive)){
    observer.roleTrust=getPersonalityRoleTrust(observer,context);
    observer.personTrust=JSON.parse(JSON.stringify(publicPeople));
    observer.privatePersonTrust=computePrivatePersonTrust(observer,publicPeople);
    observer.wolfOutwardTrust=computeWolfOutwardTrust(observer,publicPeople,state.publicRoleTrust);
    observer.wolfThreat=computeWolfThreat(observer,context,state.publicRoleTrust,observer.roleTrust);
  }
}

function targetResultConflict(publicInfo,targetId){
  const rs=publicInfo.seerResults.filter(r=>r.targetId===targetId);
  return rs.some(r=>r.black)&&rs.some(r=>!r.black);
}

function seerVsMediumConflict(publicInfo,seerId){
  const own=publicInfo.seerResults.filter(r=>r.seerId===seerId);
  for(const r of own){
    const ms=publicInfo.mediumResults.filter(m=>m.targetId===r.targetId);
    if(ms.some(m=>m.black!==r.black))return {targetId:r.targetId,targetName:r.targetName};
  }
  return null;
}

function latestResonatorClaims(records){
  const latest=new Map();
  for(const claim of records||[])latest.set(claim.playerId,claim);
  return latest;
}
function resonatorLineMembers(latest){
  const involved=new Set();
  for(const [id,claim] of latest){
    involved.add(id);
    (claim.partnerIds||[]).forEach(x=>involved.add(x));
  }
  return involved;
}
function matchingResonatorPartners(claim,members,id){
  const expected=[...members].filter(x=>x!==id).sort((a,b)=>a-b);
  const actual=[...(claim.partnerIds||[])].sort((a,b)=>a-b);
  return expected.length===actual.length&&expected.every((x,i)=>x===actual[i]);
}

// 信用評価用の相方確認。真確定の証明とは別で、公開された宣言だけを使う。
function hasPublicResonatorSupport(publicInfo,targetId){
  const count=publicInfo.roleCounts?.resonator;
  if(count==null||count<2)return false;
  const latest=latestResonatorClaims(publicInfo.resonatorClaims);
  const involved=resonatorLineMembers(latest);
  if(involved.size>count)return false; // 対抗ラインがある場合は相方確認の信用加点を保留。
  const targetClaim=latest.get(targetId);
  if(!targetClaim)return false;
  const members=[targetId,...(targetClaim.partnerIds||[])];
  if(members.length!==count||new Set(members).size!==count)return false;
  for(const id of members){
    if(publicInfo.players.find(p=>p.id===id)?.claimed!=="resonator")return false;
    const claim=latest.get(id);
    if(!claim)return false;
    if(!matchingResonatorPartners(claim,members,id))return false;
  }
  return true;
}

function estimatePublicSuspicion(publicInfo,observerId,targetId){
  const target=publicInfo.players.find(p=>p.id===targetId);
  if(!target||!target.alive||target.id===observerId)return {score:-999,reasons:[]};
  if(isPubliclyConfirmedTrue(targetId)){
    return {score:-12,reasons:["公開情報から真役職として確定しています"]};
  }

  let score=0;
  const reasons=[];
  const black=publicInfo.seerResults.filter(r=>r.targetId===targetId&&r.black);
  const white=publicInfo.seerResults.filter(r=>r.targetId===targetId&&!r.black);

  if(black.length){
    score+=4.2*black.length;
    reasons.push(`${black[0].seerName}さんから黒が出ています`);
  }
  if(white.length){
    score-=1.4*white.length;
    reasons.push(`${white[0].seerName}さんから白が出ています`);
  }
  if(targetResultConflict(publicInfo,targetId)){
    score+=1.6;
    reasons.unshift("占い結果が白黒に割れています");
  }

  if(target.claimed==="resonator"&&hasPublicResonatorSupport(publicInfo,targetId)){
    score-=5;
    reasons.push("共鳴者COで相方確認があります");
  }
  if(target.claimed==="cat"){
    score-=3.2;
    reasons.push("猫又COなので処刑は慎重にしたいです");
  }
  if(!target.claimed&&target.villagerClaim!==true){
    score+=0.45;
    reasons.push("まだCOも白結果もありません");
  }

  if(target.claimed==="seer"){
    const c=seerVsMediumConflict(publicInfo,targetId);
    if(c){
      score+=3.6;
      reasons.unshift(`${c.targetName||"処刑者"}の判定が霊媒結果と食い違っています`);
    }
    if(publicInfo.players.filter(p=>p.alive&&p.claimed==="seer").length>=2){
      score+=0.5;
      reasons.push("占い師COが複数います");
    }
  }

  if(target.claimed==="medium"&&publicInfo.players.filter(p=>p.alive&&p.claimed==="medium").length>=2){
    score+=0.8;
    reasons.push("霊媒師COが複数います");
  }
  if(target.claimed==="knight"&&publicInfo.players.filter(p=>p.alive&&p.claimed==="knight").length>=2){
    score+=0.7;
    reasons.push("騎士COが複数います");
  }

  if(publicInfo.day===1){
    score=Math.max(-2,Math.min(2.2,score));
  }

  return {score,reasons};
}

function applyPrivateStrategy(observer,privateInfo,publicInfo,entry){
  // 秘密情報は「誰が真役職か」等の判定には絶対使わない。
  // 現在は人狼が既知の仲間を露骨に吊り推ししない程度の微調整のみ。
  let score=entry.score;

  if(privateInfo.selfRole==="wolf"&&privateInfo.knownWolfAllies.includes(entry.target.id)){
    score-=0.6;
  }

  // 狂人・妖狐は現段階では内部役職情報を推理に使わない。
  return {...entry,score};
}



function getBasePublicBreakdowns(){
  ensurePublicRecords();
  const r=state.publicRecords;
  const broken=new Map();
  const add=(id,reason)=>{
    if(id==null)return;
    if(!broken.has(id))broken.set(id,[]);
    if(!broken.get(id).includes(reason))broken.get(id).push(reason);
  };

  const playerBy=id=>state.players.find(p=>p.id===id);

  // A. 占い師：同じ相手への白黒自己矛盾
  const seerClaims=new Map();
  for(const x of r.seerResults){
    const key=`${x.seerId}:${x.targetId}`;
    if(!seerClaims.has(key))seerClaims.set(key,new Set());
    seerClaims.get(key).add(x.black?"black":"white");
  }
  for(const [key,set] of seerClaims){
    if(set.size>1)add(+key.split(":")[0],"同じ人物に白と黒の両方を出している");
  }

  // B. 占い師：その結果日より前に死亡済みの人物を占った
  for(const x of r.seerResults){
    const death=r.deaths.find(d=>d.playerId===x.targetId);
    if(death && death.day < x.day){
      add(x.seerId,`${playerBy(x.targetId)?.name||"死亡者"}は占い結果の日より前に死亡している`);
    }
  }

  // C. 霊媒師：同じ処刑者への白黒自己矛盾
  const medClaims=new Map();
  for(const x of r.mediumResults){
    const key=`${x.mediumId}:${x.targetId}`;
    if(!medClaims.has(key))medClaims.set(key,new Set());
    medClaims.get(key).add(x.black?"black":"white");
  }
  for(const [key,set] of medClaims){
    if(set.size>1)add(+key.split(":")[0],"同じ処刑者に白と黒の両方の霊媒結果を出している");
  }

  // D. 霊媒師：処刑されていない人物への結果 / 結果日の不整合
  for(const x of r.mediumResults){
    const ex=r.executions.find(e=>e.playerId===x.targetId);
    if(!ex){
      add(x.mediumId,`${playerBy(x.targetId)?.name||"対象"}は処刑されていない`);
    }else if(x.day!==ex.day+1){
      add(x.mediumId,`${playerBy(x.targetId)?.name||"対象"}の霊媒結果を出した日が成立しない`);
    }
  }

  // E. 騎士：自護衛 / 同夜複数護衛 / 死亡済み護衛
  const guardDays=new Map();
  for(const g of r.guards){
    if(g.knightId===g.targetId)add(g.knightId,"自分自身を護衛している");
    const key=`${g.knightId}:${g.day}`;
    if(!guardDays.has(key))guardDays.set(key,new Set());
    guardDays.get(key).add(g.targetId);

    const death=r.deaths.find(d=>d.playerId===g.targetId);
    if(death && death.day < g.day){
      add(g.knightId,`${playerBy(g.targetId)?.name||"死亡者"}は護衛日の前に死亡している`);
    }
  }
  for(const [key,set] of guardDays){
    if(set.size>1)add(+key.split(":")[0],"同じ夜に複数人を護衛したと主張している");
  }

  // F. 共鳴者：相方宣言の不一致 / 配役人数超過
  const latestRes=latestResonatorClaims(r.resonatorClaims);
  for(const [id,c] of latestRes){
    for(const partnerId of c.partnerIds||[]){
      const back=latestRes.get(partnerId);
      if(back && !(back.partnerIds||[]).includes(id)){
        add(id,`${playerBy(partnerId)?.name||"相方"}との相方宣言が一致していない`);
        add(partnerId,`${playerBy(id)?.name||"相方"}との相方宣言が一致していない`);
      }
    }
  }
  const resCount=publicRoleCount("resonator");
  if(resCount!=null){
    const involved=resonatorLineMembers(latestRes);
    if(involved.size>resCount){
      for(const id of involved)add(id,`共鳴者の公開ラインが配役数${resCount}人を超えている`);
    }
  }

  // G. 猫又：処刑された猫又CO者なのに専用道連れがない
  for(const ex of r.executions){
    const p=playerBy(ex.playerId);
    if(p?.claimed==="cat"||(r.coEvents||[]).some(e=>e.playerId===ex.playerId&&e.role==="cat"&&e.kind==="claim"&&e.day<=ex.day)){
      const chain=r.catChains.find(c=>c.catId===p.id&&c.day===ex.day);
      if(!chain)add(p.id,"猫又COで処刑されたが専用の道連れが起きていない");
    }
  }

  // H. 猫又処刑＋専用道連れが起きた人物は公開上の真猫又確定。
  // 猫又1人配役なら他の猫又COは破綻。
  const confirmedCats=new Set(r.catChains.map(c=>c.catId));
  const catCount=publicRoleCount("cat");
  if(catCount!=null && confirmedCats.size>=catCount && catCount>0){
    for(const p of state.players){
      if(p.claimed==="cat"&&!confirmedCats.has(p.id)){
        add(p.id,"配役上の猫又枠が真確定した猫又で埋まっている");
      }
    }
  }

  // I. 真確定した猫又に黒を出した占い師は破綻
  for(const x of r.seerResults){
    if(x.black && confirmedCats.has(x.targetId)){
      add(x.seerId,`${playerBy(x.targetId)?.name||"真猫又"}は猫又として公開確定しているのに黒を出している`);
    }
  }

  return broken;
}


// 公開情報の推理・真確定判定を役割ごとに分割。公開記録と推理結果を扱い、画面は操作しない。
function addTruthReason(map,id,reason){
  if(id==null)return false;
  if(!map.has(id))map.set(id,[]);
  if(map.get(id).includes(reason))return false;
  map.get(id).push(reason);
  return true;
}

function createPublicTruthContext(){
  const broken=new Map([...getBasePublicBreakdowns()].map(([id,reasons])=>[id,[...reasons]]));
  const confirmed=new Map();
  // 保存証明の読み込みは従来と同じ順序で行う。
  for(const proof of state.publicRecords.confirmedProofs||[]){
    if(!confirmed.has(proof.id))confirmed.set(proof.id,[]);
    confirmed.get(proof.id).push(proof.reason);
  }
  return {
    broken,confirmed,
    addBroken:(id,reason)=>addTruthReason(broken,id,reason),
    addConfirmed:(id,reason)=>id!=null&&!broken.has(id)?addTruthReason(confirmed,id,reason):false
  };
}

function applyPublicJusatsuBreakdowns({addBroken,confirmed}){
  const count=publicRoleCount('seer'),cats=publicRoleCount('cat');
  const firstFull=(state.publicRecords.fullCoRequests||[]).find(x=>x.role==='seer'&&x.day===1);
  // 犠牲者OFFの開始死体は、公開ルールだけで狐と分かる。
  const opening=openingPublicDeaths();
  if(!state.firstVictimEnabled&&opening.length){
    for(const r of state.publicRecords.seerResults||[])if(r.black&&opening.some(d=>d.playerId===r.targetId))
      addBroken(r.seerId,'初日犠牲者なしの開始死体は妖狐なのに黒を出している');
  }
  if(!firstFull||count!==1)return;
  // 全員CO前の死亡者に真占いがいた可能性を残す。欠けた真の未報告呪殺もあり得る。
  if(priorDeadIdsForFullCo(firstFull).some(id=>!excludesDeadRoleCandidate(id,'seer',confirmed)))return;
  const byNight=new Map();
  for(const d of state.publicRecords.deaths||[]){
    if(d.phase!=='night')continue;
    if(d.day===1&&state.openingRulesVersion!==1)continue;
    if(!byNight.has(d.day))byNight.set(d.day,[]);
    byNight.get(d.day).push(d.playerId);
  }
  for(const [day,deaths] of byNight){
    const guaranteed=day===1&&!state.firstVictimEnabled?deaths.length>0:cats===0&&deaths.length>=2;
    if(!guaranteed)continue;
    const declared=state.players.filter(p=>p.claimed==='seer');
    if(declared.some(p=>(state.publicRecords.deaths||[]).some(d=>d.playerId===p.id&&d.day===day)))continue;
    for(const r of state.publicRecords.seerResults||[]){
      if(r.day===day&&declared.some(p=>p.id===r.seerId)&&(!deaths.includes(r.targetId)||r.black))
        addBroken(r.seerId,`${day}日目は呪殺確定なのに死者への白結果を出していない`);
    }
  }
}

// 全員COの時点で死亡していた人物だけを潜伏真の候補にする。
function priorDeadIdsForFullCo(request){
  if(Array.isArray(request.priorDeadIds))return [...new Set(request.priorDeadIds)];
  if(Array.isArray(request.aliveIds))return state.players.filter(p=>!p.alive&&!request.aliveIds.includes(p.id)).map(p=>p.id);
  // 時点の記録がない旧保存は、同日死亡や死亡日欠落を保守的に残す。
  return state.players.filter(p=>!p.alive&&(!(state.publicRecords.deaths||[]).some(d=>d.playerId===p.id)||
    (state.publicRecords.deaths||[]).some(d=>d.playerId===p.id&&d.day<=request.day))).map(p=>p.id);
}
function publiclyKnownRoleFor(id,confirmed){
  if(!confirmed.has(id))return null;
  const proof=(state.publicRecords.confirmedProofs||[]).find(x=>x.id===id&&x.role);
  if(proof)return proof.role;
  if((state.publicRecords.catChains||[]).some(x=>x.catId===id))return "cat";
  return byId(id)?.claimed||null;
}
function excludesDeadRoleCandidate(id,role,confirmed){
  if(!openingAllowsRole(id,role))return true;
  if(byId(id)?.claimed===role)return true; // CO者は別途その役職候補に数える。
  const knownRole=publiclyKnownRoleFor(id,confirmed);
  if(knownRole&&knownRole!==role)return true;
  return (state.publicRecords.mediumResults||[]).some(r=>r.targetId===id&&r.black&&
    publiclyKnownRoleFor(r.mediumId,confirmed)==="medium");
}

function confirmPublicResonators({confirmed,broken,addConfirmed}){
  const request=(state.publicRecords.fullCoRequests||[]).find(x=>x.role==="resonator");
  const count=publicRoleCount("resonator");
  if(!request||count==null||count<2)return false;
  const latest=latestResonatorClaims(state.publicRecords.resonatorClaims);
  const involved=resonatorLineMembers(latest);
  if(involved.size!==count)return false;
  for(const id of involved){
    const player=byId(id),claim=latest.get(id);
    if(!player||player.claimed!=="resonator"||broken.has(id)||!claim)return false;
    if(!matchingResonatorPartners(claim,involved,id))return false;
  }
  // 指示時点の死亡者を最優先。旧保存形式は死亡日から保守的に復元する。
  const priorDeadIds=priorDeadIdsForFullCo(request);
  for(const id of priorDeadIds){
    // 相互宣言済みの死者は潜伏不明枠ではない。ただし死亡後の宣言は証拠に使えない。
    const claim=latest.get(id);
    const death=(state.publicRecords.deaths||[]).find(d=>d.playerId===id);
    if(involved.has(id)&&claim&&death&&claim.day<death.day)continue;
    const knownRole=publiclyKnownRoleFor(id,confirmed);
    const certainlyWolf=(state.publicRecords.mediumResults||[]).some(r=>r.targetId===id&&r.black&&
      publiclyKnownRoleFor(r.mediumId,confirmed)==="medium");
    if(openingAllowsRole(id,"resonator")&&!(knownRole&&knownRole!=="resonator")&&!certainlyWolf)return false;
  }
  let changed=false;
  for(const id of involved){
    if(addConfirmed(id,`共鳴者の全員CO後、${count}人の相方関係が相互一致し、死亡潜伏真の可能性を排除した`))changed=true;
  }
  return changed;
}

function confirmFullCoRoles({confirmed,broken,addConfirmed},fullCoRoles){
  let changed=false;
  // 全員CO指示済みの単独役職。
  // 「配役人数ぶんだけ非破綻COが残った」なら、その全員が真。
  for(const role of ["seer","medium","knight","cat"]){
    if(!fullCoRoles.has(role))continue;
    const count=publicRoleCount(role);
    if(count==null||count<=0)continue;

    const claimants=state.players.filter(p=>p.claimed===role);
    const viable=claimants.filter(p=>!broken.has(p.id));

    // 生存者への全員COだけでは、未CO死亡者の潜伏真を排除できない。
    // 公開証明で別役職と分かった死者は、COの有無にかかわらず除外する。
    const request=(state.publicRecords.fullCoRequests||[]).find(x=>x.role===role);
    const unexcludedDeaths=priorDeadIdsForFullCo(request)
      .filter(id=>!excludesDeadRoleCandidate(id,role,confirmed));
    if(viable.length===count&&unexcludedDeaths.length===0){
      for(const p of viable){
        if(addConfirmed(p.id,
          claimants.length===count
            ? `${roleName(role)}の全員CO後、CO者数が配役数${count}人と一致した`
            : `${roleName(role)}の対抗が全員破綻し、配役数${count}人ぶんだけ残った`
        ))changed=true;
      }
    }
  }

  return changed;
}

function applyConfirmedRoleBreakdowns({confirmed,addBroken}){
  let changed=false;
  // 配役枠が真確定者で埋まったら、他の同役職COは破綻。
  for(const role of ["seer","medium","knight","cat","resonator"]){
    const count=publicRoleCount(role);
    if(count==null||count<=0)continue;
    const confirmedOfRole=[...confirmed.keys()]
      .filter(id=>(state.publicRecords.confirmedProofs||[]).some(x=>x.id===id&&x.role===role)||(!(state.publicRecords.confirmedProofs||[]).some(x=>x.id===id)&&byId(id)?.claimed===role));
    if(confirmedOfRole.length>=count){
      for(const p of state.players.filter(p=>p.claimed===role)){
        if(!confirmed.has(p.id)){
          if(addBroken(p.id,`${roleName(role)}の配役枠${count}人が真確定者で埋まっている`))changed=true;
        }
      }
    }
  }

  // 真確定した村役職に黒を出した占い師は破綻。
  for(const x of state.publicRecords.seerResults||[]){
    if(!x.black)continue;
    const target=byId(x.targetId);
    if(!target||!confirmed.has(target.id))continue;
    if(["seer","medium","knight","resonator","cat"].includes(target.claimed)){
      if(addBroken(x.seerId,`${target.name}さんは${roleName(target.claimed)}として真確定しているのに黒を出している`))changed=true;
    }
  }

  // 真確定霊媒と占い結果が食い違えば、占い師側が破綻。
  const trueMediumIds=[...confirmed.keys()].filter(id=>(state.publicRecords.confirmedProofs||[]).some(p=>p.id===id&&p.role==="medium")||byId(id)?.claimed==="medium");
  for(const mid of trueMediumIds){
    const medResults=(state.publicRecords.mediumResults||[]).filter(r=>r.mediumId===mid);
    for(const mr of medResults){
      const seerResults=(state.publicRecords.seerResults||[]).filter(r=>r.targetId===mr.targetId);
      for(const sr of seerResults){
        if(sr.black!==mr.black){
          const target=byId(mr.targetId);
          if(addBroken(sr.seerId,`${target?.name||"処刑者"}さんの判定が真確定霊媒の結果と食い違っている`))changed=true;
        }
      }
    }
  }

  return changed;
}

function solvePublicTruth(){
  ensurePublicRecords();
  const truth=createPublicTruthContext();
  applyPublicJusatsuBreakdowns(truth);
  const fullCoRoles=new Set((state.publicRecords.fullCoRequests||[]).map(x=>x.role));
  for(const c of state.publicRecords.catChains||[]){
    truth.addConfirmed(c.catId,"処刑時に猫又専用の道連れが発生した");
  }
  // 各段階を必ず順番に実行する。短絡評価で後続の判定を省略しない。
  for(let pass=0;pass<8;pass++){
    let changed=confirmFullCoRoles(truth,fullCoRoles);
    if(confirmPublicResonators(truth))changed=true;
    if(applyConfirmedRoleBreakdowns(truth))changed=true;
    if(!changed)break;
  }
  return {broken:truth.broken,confirmed:truth.confirmed};
}

function getPublicBreakdowns(){
  return solvePublicTruth().broken;
}
function getPublicConfirmations(){
  return solvePublicTruth().confirmed;
}

function commitPublicTruthProofs(){
  ensurePublicRecords();
  // 未COでも、公開された処刑道連れは猫又の役職証明。CO履歴は作らない。
  const publicCatIds=new Set(state.publicRecords.catChains.map(x=>x.catId));
  state.publicRecords.confirmedProofs.forEach(proof=>{
    if(!proof.role&&publicCatIds.has(proof.id))proof.role="cat";
  });
  const known=new Set(state.publicRecords.confirmedProofs.map(x=>x.id));
  const confirmations=solvePublicTruth().confirmed;
  for(const [id,reasons] of confirmations){
    if(!known.has(id)&&reasons.length){
      state.publicRecords.confirmedProofs.push({id,role:publicCatIds.has(id)?"cat":byId(id)?.claimed,day:state.day,reason:reasons[0]});
      known.add(id);
    }
  }
}

function brokenReasonsFor(id){
  return getPublicBreakdowns().get(id)||[];
}
function isPubliclyBroken(id){
  return brokenReasonsFor(id).length>0;
}
function confirmedReasonsFor(id){
  return getPublicConfirmations().get(id)||[];
}
function isPubliclyConfirmedTrue(id){
  return confirmedReasonsFor(id).length>0;
}
function publicSeerCredibility(publicInfo,seerId){
  const seer=publicInfo.players.find(p=>p.id===seerId);
  if(!seer||seer.claimed!=="seer")return {score:0,reasons:[]};
  let score=0;
  const reasons=[];
  const results=publicInfo.seerResults.filter(r=>r.seerId===seerId);
  const confirmations=state.publicRecords?.confirmedProofs||[];
  for(const r of results){
    const trueMediumIds=new Set(confirmations.filter(c=>c.role==="medium").map(c=>c.id));
    const meds=publicInfo.mediumResults.filter(m=>m.targetId===r.targetId&&trueMediumIds.has(m.mediumId));
    for(const m of meds){
      if(m.black!==r.black){score-=3.4;reasons.push(`${r.targetName}さんの判定が真霊媒結果と食い違っています`);}
      else if(r.order!=null&&m.order!=null&&r.order<m.order){
        score+=2.4;reasons.push(`${r.targetName}さんの先出し判定が真霊媒結果と一致しています`);
      }
    }
    const target=publicInfo.players.find(p=>p.id===r.targetId);
    const proof=confirmations.find(x=>x.id===r.targetId&&x.role==="resonator");
    const resCO=(state.publicRecords?.coEvents||[]).find(e=>e.playerId===r.targetId&&e.kind==="claim"&&e.role==="resonator");
    if(target&&proof&&!r.black&&resCO&&r.order!=null&&resCO.order!=null&&r.order<resCO.order){
      score+=0.25;reasons.push(`${target.name}さんの共鳴CO前に白を出しています`);
    }
  }
  if(results.length>=2&&score>=0){score+=0.2;reasons.push("公開結果に明確な矛盾はありません");}
  return {score,reasons};
}
function chooseTrustedSeer(publicInfo){
  const seers=publicInfo.players.filter(p=>p.alive&&p.claimed==="seer");
  if(!seers.length)return null;
  const ranked=seers.map(s=>({seer:s,...publicSeerCredibility(publicInfo,s.id)}))
                    .sort((a,b)=>b.score-a.score);
  return ranked[0]?.score>=1.0?ranked[0]:null;
}

function selectPrioritySpeechTopic(observer,publicInfo,candidates){
  const brokenMap=getPublicBreakdowns();
  const brokenTarget=candidates.find(p=>
    brokenMap.has(p.id) &&
    speechTopicCountToday("broken",p.id)<2 &&
    !observerMentionedRecently(observer,"broken",p.id,1)
  );
  if(brokenTarget){
    const reason=brokenMap.get(brokenTarget.id)[0];
    return {kind:"broken",targetId:brokenTarget.id,variant:"broken",details:{targetName:brokenTarget.name,reason:reason}};
  }

  const changedCo=(publicInfo.coEvents||[]).find(e=>e.day===state.day&&e.kind==="withdraw"&&
    candidates.some(p=>p.id===e.playerId)&&speechTopicCountToday("coChange",e.playerId)<2);
  if(changedCo){
    const p=publicInfo.players.find(x=>x.id===changedCo.playerId);
    return {kind:"coChange",targetId:p.id,variant:"coChange",details:{targetName:p.name}};
  }

  const confirmedMap=getPublicConfirmations();

  // 真確定は「全員が毎日復唱する情報」ではなく、原則として推理の前提に使う。
  // まだ誰もその確定に触れていない場合だけ、当日は最大2人まで直接言及。
  const newlyMentionable=candidates.find(p=>
    confirmedMap.has(p.id) && p.claimed!=="resonator" &&
    truthFirstMentionDay("confirmed",p.id)===null &&
    speechTopicCountToday("confirmed",p.id)<2
  );
  if(newlyMentionable && Math.random()<0.55){
    const reason=confirmedMap.get(newlyMentionable.id)[0];
    return {kind:"confirmed",targetId:newlyMentionable.id,variant:"confirmed",details:{targetName:newlyMentionable.name,reason:reason}};
  }

  // 既知の真確定情報は、一定確率で「次の推理」へ接続する。
  // 同じCOMが前日も同じ前提話題を話していたら抑制。
  if(speechTopicCountToday("confirmedPremise")<Math.max(1,Math.ceil(candidates.length/3))){
    const premise=selectConfirmedPremiseTopic(observer,publicInfo,confirmedMap);
    if(premise && !observerMentionedRecently(observer,"confirmedPremise",premise.targetId,1) && Math.random()<0.38){
      return premise;
    }
  }

  return null;
}
function selectFirstDaySpeechTopic(top,evals){
  const strongPublic=top.reasons.some(r=>r.includes("黒が出ています")||r.includes("白黒に割れています")||r.includes("食い違っています"));
  if(strongPublic&&top.score>=1.8){
    const reason=top.reasons[0]||"公開情報を見ると少し気になります";
    return {kind:"gray",targetId:top.target.id,variant:"firstDayConcern",details:{targetName:top.target.name,reason:reason}};
  }
  const gray=randomChoice(evals.filter(e=>!e.target.claimed&&e.target.villagerClaim!==true&&e.score>-10));
  if(gray&&Math.random()<0.45){
    return {kind:"gray",targetId:gray.target.id,variant:"firstDayUnknown",details:{targetName:gray.target.name}};
  }
  return {kind:"wait",targetId:null,variant:"wait",details:{}};
}

// 発言記憶と事後評価。保存されるのは聞いた公開主張、内部分類や身内切り判定ではない。
const SPEECH_MEMORY_VERSION=1;
let socialMorningBasis=null;
function ensureSpeechMemorySystem(){
  if(state.speechMemorySystem?.schemaVersion===1)return state.speechMemorySystem;
  let seed=196613;for(const c of state.players.map(p=>p.characterId||p.name).join('|')){seed^=c.charCodeAt(0);seed=Math.imul(seed,16777619);}
  if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1);globalThis.crypto.getRandomValues(a);seed=a[0];}
  return state.speechMemorySystem={schemaVersion:1,visibility:'private',seed:(seed>>>0)||97531,clock:0,breakdowns:{},mediumOrders:{},seerOrders:{}};
}
function socialOrder(){return ++ensureSpeechMemorySystem().clock;}
function captureSocialBreakdowns(context=null){
  if(!state||state.speechMemoryEnabled===false)return;
  const system=ensureSpeechMemorySystem(),broken=context?.broken||getPublicBreakdowns();
  for(const [id] of broken)if(!system.breakdowns[id])system.breakdowns[id]={order:socialOrder(),day:state.day};
}
function noteSocialMediumPublication(row){
  if(state.speechMemoryEnabled===false)return;
  ensureSpeechMemorySystem().mediumOrders[row.order]={order:socialOrder(),day:state.day};
}
function noteSocialSeerPublication(row){
  if(state.speechMemoryEnabled===false)return;
  const system=ensureSpeechMemorySystem();system.seerOrders??={};
  system.seerOrders[row.order]={order:socialOrder(),day:state.day};
}
function speechMemoryProbabilities(listener,impression){
  const stats=personalityProfile(listener)?.stats||{logic:3,emotionality:3};
  return {basic:Math.min(99,[50,65,80,90,99][stats.logic-1]+4*(stats.emotionality-1)*(impression?1:0))/100,
    details:[60,70,80,90,99][stats.logic-1]/100};
}
function suspicionTypeFromSpeech(semantics){
  const variant=semantics?.variant;
  return semantics?.suspicionType||(variant==='roleFalse'?'fake':
    ['basicSuspect','gutSuspect','gutLynch','lynchProposal'].includes(variant)?'vague':null);
}
function rememberSuspicionSpeech(speaker,speech,historyIndex){
  if(state.speechMemoryEnabled===false)return;
  const semantics=speech.semantics;if(!semantics||speech.targetId==null)return;
  const variant=semantics.variant;
  const type=suspicionTypeFromSpeech(semantics);
  if(!['wolf','fake','vague'].includes(type))return;
  captureSocialBreakdowns();
  const order=socialOrder(),system=ensureSpeechMemorySystem();
  for(const listener of living().filter(p=>!p.isSelf&&p.id!==speaker.id)){
    const relation=personalityProfile(listener)?.relationships?.find(r=>r.targetId===speaker.characterId);
    const outlook=listener.role==='wolf'?listener.outwardOutlook:listener.characterOutlook;
    const person=outlook?.people[speech.targetId];
    const impression=relation?.affinity>=4||person?.wolfView==='wolfLeaning'||person?.intuitionSuspicion?.active||
      Object.values(outlook?.roles||{}).some(r=>r.assessments[speech.targetId]?.view==='false');
    const qOther=person?.wolfView==='wolfLeaning'||person?.intuitionSuspicion?.active||Object.values(outlook?.roles||{}).some(r=>r.assessments[speech.targetId]?.view==='false');
    const rates=isAffinityVillage()?affinityMemoryRates(listener,speaker.id,qOther):speechMemoryProbabilities(listener,impression);
    if(intuitionRandom(system)>=rates.basic)continue;
    const detailed=intuitionRandom(system)<rates.details;
    listener.suspicionMemories??=[];
    listener.suspicionMemories.push({schemaVersion:1,speakerId:speaker.id,targetId:speech.targetId,type,day:state.day,order,
      source:{speakerId:speaker.id,historyIndex},detailed,
      evidence:detailed?JSON.parse(JSON.stringify(semantics.evidence||[])):[]});
  }
}
function socialSourceStrength(entry){
  if(!entry||entry.status==='false'||entry.conflictingCertainty)return 0;
  return entry.status==='true'?1:clamp((entry.score-50)/30,0,.8);
}
function buildSocialReputation(observer,pub=buildSpeechPublicInformation(),publicOnly=observer.role==='wolf'){

    const possible=context.claimants.filter(p=>p.role===role&&!required.includes(p.id)&&
      !context.broken.has(p.id)&&!fixed.has(p.id)&&trust.roles[role][p.id]?.status!=='false').map(p=>p.id);
    let beam=[{ids:required,score:0}];
    for(const id of possible){
      const entry=trust.roles[role][id],value=personalityCandidateEvaluation(observer,entry);
      const score=entry.status==='unconfirmed'?value.evaluation:0;
      beam=beam.flatMap(o=>[o,...(o.ids.length<counts[role]?[{ids:[...o.ids,id],score:o.score+2+score}]:[])])
        .sort((a,b)=>b.score-a.score).slice(0,32);
    }
    options[role]=beam.filter(o=>o.ids.length<=counts[role]);
  }
  const hypotheses=[];
  for(const seer of options.seer)for(const medium of options.medium){
    const trueIds={seer:seer.ids,medium:medium.ids},colors=new Map(),notFox=new Set();
    let conflict=false;
    function color(id,black){
      if(colors.has(id)&&colors.get(id)!==black)conflict=true;
      colors.set(id,black);
    }
    const rows=[...context.seerRows.filter(r=>seer.ids.includes(r.record.seerId)),
      ...context.mediumRows.filter(r=>medium.ids.includes(r.record.mediumId))];
    for(const {record:r} of rows){color(r.targetId,r.black);if(r.seerId!=null&&divinationKillsFox(r.day)&&byId(r.targetId)?.alive)notFox.add(r.targetId);}
    for(const r of privateRows){color(r.targetId,r.black);if(privateInfo.selfRole==='seer'&&divinationKillsFox(r.day)&&byId(r.targetId)?.alive)notFox.add(r.targetId);}
    const openingDeaths=openingPublicDeaths().map(d=>d.playerId);
    const openingJusatsu=openingDeaths.length>0&&(!state.firstVictimEnabled||counts.cat===0&&openingDeaths.length>=2);
    if(openingJusatsu&&counts.seer===1){
      const selected=seer.ids[0];
      if(selected!=null&&byId(selected)?.alive){
        const first=rows.filter(row=>row.record.seerId===selected&&row.record.day===1);
        if(first.some(row=>row.record.black||!openingDeaths.includes(row.record.targetId)))conflict=true;
      }
    }
    if(conflict)continue;
    const closed=new Map(['seer','medium'].map(role=>{
      const request=(state.publicRecords.fullCoRequests||[]).find(r=>r.role===role);
      return [role,request?new Set(priorDeadIdsForFullCo(request)):null];
    }));
    const domains=context.people.map(person=>{
      let roles=roleNames.filter(r=>counts[r]>0&&openingAllowsRole(person.id,r));
      if(fixed.has(person.id))roles=roles.filter(r=>r===fixed.get(person.id));
      for(const role of ['seer','medium']){
        if(trueIds[role].includes(person.id))roles=roles.filter(r=>r===role);
        else if(person.claimed===role||closed.get(role)&&!closed.get(role).has(person.id))roles=roles.filter(r=>r!==role);
      }
      // 村側の役職COは本当の役職、人外の役職COは騙り。
      if(person.claimed)roles=roles.filter(r=>r===person.claimed||['wolf','madman','fox'].includes(r));
      if(context.broken.has(person.id))roles=roles.filter(r=>['wolf','madman','fox'].includes(r));
      if(colors.has(person.id))roles=roles.filter(r=>colors.get(person.id)?r==='wolf':r!=='wolf');
      if(notFox.has(person.id))roles=roles.filter(r=>r!=='fox');
      return {id:person.id,roles};
    });
    const assignment=matchOpeningHypothesisRoles(domains,counts);
    if(!assignment)continue;
    const key='seer:'+seer.ids.slice().sort((a,b)=>a-b).join(',')+'|medium:'+medium.ids.slice().sort((a,b)=>a-b).join(',');
    const personality=personalityHypothesisEvaluation(observer,trust,context,trueIds);
    const score=personality.score;
    hypotheses.push({key,trueIds,score,assignment,personality,
      colors:Object.fromEntries(colors),notFoxIds:[...notFox],
      possibleRoles:Object.fromEntries(domains.map(d=>[d.id,d.roles]))});
  }
  hypotheses.sort((a,b)=>(b.score+(b.key===previous?.supportKey?2:0))-(a.score+(a.key===previous?.supportKey?2:0))||a.key.localeCompare(b.key));
  const roleEvaluation=JSON.parse(JSON.stringify(trust));
  roleEvaluation.personalityVersion=PERSONALITY_EVALUATION_VERSION;
  for(const role of ['seer','medium'])for(const entry of Object.values(roleEvaluation.roles[role])){
    // 最良の成立仮説のうち本人を含むものから評価。支持されたという理由では加点しない。
    const compatible=hypotheses.find(h=>h.trueIds[role].includes(entry.claimantId));
    const value=compatible?.personality.roles[role][entry.claimantId]||personalityCandidateEvaluation(observer,entry);
    entry.score=value.credit;entry.personality=value;
  }
  const model={schemaVersion:ROLE_HYPOTHESIS_VERSION,visibility:'private',basis:publicOnly?'outward':'personal',
    personalityVersion:PERSONALITY_EVALUATION_VERSION,roleEvaluation,
    supportKey:hypotheses[0]?.key||null,supported:hypotheses[0]||null,alternatives:hypotheses.slice(0,8),
    evaluatedCount:hypotheses.length,status:hypotheses.length?'supported':'inconsistent'};
  roleHypothesisCache.set(observer,{key:cacheKey,model});
  return model;
}
function refreshRoleHypotheses(){

function buildHypothesisMorningCandidates(observer,pub,outlook){
  outlook=outlook||buildCharacterOutlook(observer,pub,observer.role==='wolf');
  const candidates=[];
  const add=(variant,id,weight,evidence,extra={})=>candidates.push({kind:variant==='roleTruth'?'roleTruth':variant==='basicTrust'?'trust':variant==='lynchProposal'?'lynch':'suspect',
    variant,targetId:id,weight,details:{certainty:'inferred',hypothesis:true,evidence:JSON.parse(JSON.stringify(evidence)),...extra}});
  for(const role of ['seer','medium'])for(const entry of Object.values(outlook.roles[role].assessments)){
    if(entry.targetId===observer.id||entry.view==='unknown'||entry.certaintyScope==='public'||outlook.people[entry.targetId]?.intuitionSuspicion?.active)continue;
    add(entry.view==='true'?'roleTruth':'roleFalse',entry.targetId,3,entry.publicEvidence,{role,roleLabel:morningRoleLabel(role)});
  }
  for(const entry of Object.values(outlook.people)){
    const id=entry.targetId;
    if(!entry.alive||id===observer.id||entry.conflictingInformation)continue;
    if(!entry.claimed&&entry.wolfView!=='unknown'){
      add(entry.wolfView==='wolfLeaning'?'basicSuspect':'basicTrust',id,entry.wolfView==='wolfLeaning'?6:3,entry.publicEvidence);
      if(entry.wolfView==='nonWolfLeaning'&&entry.foxView==='unlikely'&&entry.foxEvidence.length)add('nonFox',id,2,entry.foxEvidence);
    }
    if(id===outlook.lynchPreference.targetId&&entry.wolfView==='wolfLeaning')add('lynchProposal',id,5,entry.publicEvidence);
  }
  return candidates;
}
