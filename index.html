<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>個人用人狼アプリ v0.1</title>
<style>
:root{--bg:#0f1117;--panel:#171a22;--panel2:#202532;--text:#f5f7fb;--muted:#9ca6b7;--accent:#7c9cff;--danger:#ff6b6b;--ok:#5fd3a2;--line:#2b3140;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:white;font-weight:700;cursor:pointer}button.secondary{background:var(--panel2)}button.danger{background:var(--danger)}button.ghost{background:transparent;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:980px;margin:auto;padding:18px}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}.grid{display:grid;gap:10px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:700px){.cols2,.cols3{grid-template-columns:1fr}}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.role-row{display:grid;grid-template-columns:1fr 90px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.role-row:last-child{border-bottom:0}input[type=number],select,input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0d1016;color:var(--text)}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{padding:6px 9px;border-radius:999px;background:var(--panel2);font-size:13px}.player{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px}.player.dead{opacity:.5}.player .name{font-weight:800}.player .meta{margin-top:5px;font-size:13px;color:var(--muted)}.player .claim{margin-top:7px;color:var(--warn);font-size:13px}.log{height:320px;overflow:auto;background:#0d1016;border-radius:12px;padding:12px;border:1px solid var(--line)}.log p{margin:0 0 9px;line-height:1.5}.log .system{color:#c7d2fe}.log .death{color:#ff9a9a}.log .result{color:#a7f3d0}.hidden{display:none!important}hr{border:0;border-top:1px solid var(--line);margin:14px 0}.notice{padding:10px 12px;border-radius:12px;background:#111827;border:1px solid var(--line)}.target-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin-top:10px}.target-list button{background:var(--panel2);border:1px solid var(--line)}.footer{color:var(--muted);font-size:12px;text-align:center;padding:20px 0}
</style>
</head>
<body><div class="wrap">
<h1>個人用人狼アプリ <span class="muted">v0.1</span></h1><div class="muted">自分＝村人固定 / 5〜20人 / ローカル保存</div>
<section id="setupScreen"><div class="card"><h2>ゲーム設定</h2><div class="grid cols2"><label>参加人数<input id="playerCount" type="number" min="5" max="20" value="9"></label><label>自分の名前<input id="selfName" type="text" value="あなた" maxlength="12"></label></div><hr><h2>配役</h2><div id="roleConfig"></div><div class="notice" id="sumNotice"></div><div class="row" style="margin-top:14px"><button id="startBtn">ゲーム開始</button><button class="secondary" id="loadBtn">保存データを再開</button></div></div></section>
<section id="gameScreen" class="hidden"><div class="card"><div class="row" style="justify-content:space-between"><div><h2 id="phaseTitle">1日目・昼</h2><div class="status" id="statusBadges"></div></div><div class="row"><button class="ghost" id="debugBtn">デバッグ</button><button class="danger" id="resetBtn">ゲーム終了</button></div></div></div>
<div class="grid cols2"><div class="card"><h2>生存者</h2><div id="players" class="grid cols2"></div></div><div class="card"><h2>公開ログ</h2><div id="log" class="log"></div></div></div>
<div class="card"><h2>指示</h2><div class="grid cols3"><button id="blackSeerBtn">黒出し占い師CO</button><button id="blackMediumBtn">黒出し霊媒師CO</button><button id="roleCoBtn">役職CO</button><button id="hiddenSeerBtn" class="secondary">潜伏占い指示</button><button id="hiddenGuardBtn" class="secondary">潜伏護衛指示</button></div><div id="actionPanel" class="hidden" style="margin-top:14px"></div></div>
<div class="card"><h2>進行</h2><div class="row"><button id="executeBtn">処刑対象を選ぶ</button><button id="nightBtn" class="secondary" disabled>夜を解決する</button></div><div class="muted" style="margin-top:8px">v0.1では投票AIは未実装。処刑対象は自分で選択します。</div></div>
<div id="debugPanel" class="card hidden"><h2>デバッグ情報</h2><div id="debugText" class="muted"></div></div></section><div class="footer">この版は端末内だけで動作します。サーバー通信はありません。</div></div>
<script>
const ROLES=[["villager","村人"],["seer","占い師"],["knight","騎士"],["medium","霊媒師"],["madman","狂人"],["wolf","人狼"],["fox","妖狐"]];const TEAM={villager:"村人陣営",seer:"村人陣営",knight:"村人陣営",medium:"村人陣営",madman:"人狼陣営",wolf:"人狼陣営",fox:"妖狐陣営"};let state=null;const $=s=>document.querySelector(s);const roleName=r=>ROLES.find(x=>x[0]===r)?.[1]??r;function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function defaultCounts(n){const b={villager:3,seer:1,knight:1,medium:1,madman:1,wolf:2,fox:0};if(n<9){b.villager=Math.max(1,n-4);b.medium=n>=7?1:0;b.madman=n>=6?1:0;b.knight=n>=6?1:0;b.wolf=n>=7?2:1;b.seer=1}else if(n>9)b.villager+=n-9;return b}
function renderRoleConfig(){const n=clamp(+$("#playerCount").value,5,20);const saved={};document.querySelectorAll("[data-role-count]").forEach(e=>saved[e.dataset.roleCount]=+e.value||0);const c=Object.keys(saved).length?saved:defaultCounts(n);$("#roleConfig").innerHTML=ROLES.map(([k,nm])=>`<div class="role-row"><div><b>${nm}</b><div class="muted">${TEAM[k]}</div></div><input type="number" min="0" max="20" value="${c[k]??0}" data-role-count="${k}"></div>`).join("");document.querySelectorAll("[data-role-count]").forEach(e=>e.addEventListener("input",updateSum));updateSum()}
function getRoleCounts(){const o={};document.querySelectorAll("[data-role-count]").forEach(e=>o[e.dataset.roleCount]=Math.max(0,+e.value||0));return o}function updateSum(){const n=+$("#playerCount").value,c=getRoleCounts(),sum=Object.values(c).reduce((a,b)=>a+b,0),ok=sum===n&&c.villager>=1&&c.wolf>=1;$("#sumNotice").innerHTML=`配役合計 <b>${sum}</b> / ${n}人　${ok?"✅ 開始できます":"⚠️ 合計人数を合わせ、村人1人以上・人狼1人以上にしてください"}`;$("#startBtn").disabled=!ok}
function startGame(){const n=clamp(+$("#playerCount").value,5,20),c=getRoleCounts();if(Object.values(c).reduce((a,b)=>a+b,0)!==n||c.villager<1||c.wolf<1)return;const roles=[],assign={...c,villager:c.villager-1};for(const[r]of ROLES)for(let i=0;i<assign[r];i++)roles.push(r);shuffle(roles);const self=$("#selfName").value.trim()||"あなた",names=["アキ","ユウ","ハル","レン","ミオ","ナギ","ソラ","リク","カイ","ヒナ","レイ","シン","アオ","トワ","マコ","ユキ","セナ","リン","ケイ"];const ps=[{id:0,name:self,role:"villager",alive:true,isSelf:true,claimed:null,seerResults:[],mediumResults:[],forcedSeerTarget:null,forcedGuardTarget:null}];for(let i=1;i<n;i++)ps.push({id:i,name:names[i-1]??`P${i+1}`,role:roles[i-1],alive:true,isSelf:false,claimed:null,seerResults:[],mediumResults:[],forcedSeerTarget:null,forcedGuardTarget:null});state={version:"0.1",day:1,phase:"day",players:ps,logs:[],lastExecuted:null,winner:null};log(`ゲーム開始。参加者は${n}人。あなたの役職は【村人】です。`,"system");save();showGame()}
function living(){return state.players.filter(p=>p.alive)}function byId(id){return state.players.find(p=>p.id===+id)}function roleLiving(r){return living().filter(p=>p.role===r)}function publicClaim(p){return p.claimed?roleName(p.claimed):"未CO"}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function log(msg,cls=""){state.logs.push({msg,cls});renderLog()}function renderLog(){if(!state)return;$("#log").innerHTML=state.logs.map(x=>`<p class="${x.cls}">${escapeHtml(x.msg)}</p>`).join("");$("#log").scrollTop=$("#log").scrollHeight}
function showGame(){$("#setupScreen").classList.add("hidden");$("#gameScreen").classList.remove("hidden");renderAll()}function showSetup(){$("#gameScreen").classList.add("hidden");$("#setupScreen").classList.remove("hidden")}
function renderAll(){if(!state)return;$("#phaseTitle").textContent=state.winner?`ゲーム終了：${state.winner}`:`${state.day}日目・${state.phase==="day"?"昼":"夜"}`;$("#statusBadges").innerHTML=`<span class="badge">生存 ${living().length}</span><span class="badge">死亡 ${state.players.length-living().length}</span><span class="badge">あなた：村人</span>`;$("#players").innerHTML=state.players.map(p=>`<div class="player ${p.alive?"":"dead"}"><div class="name">${escapeHtml(p.name)}${p.isSelf?"（あなた）":""}</div><div class="meta">${p.alive?"生存":"死亡"} / CO：${publicClaim(p)}</div>${p.claimed?`<div class="claim">【${roleName(p.claimed)}CO】</div>`:""}</div>`).join("");renderLog();const dis=!!state.winner||state.phase!=="day";["#executeBtn","#blackSeerBtn","#blackMediumBtn","#roleCoBtn","#hiddenSeerBtn","#hiddenGuardBtn"].forEach(s=>$(s).disabled=dis);$("#nightBtn").disabled=!!state.winner||state.phase!=="night";renderDebug()}
function makeTargetPanel(title,cands,onSelect){const p=$("#actionPanel");p.classList.remove("hidden");p.innerHTML=`<b>${escapeHtml(title)}</b><div class="target-list">${cands.map(x=>`<button data-target="${x.id}">${escapeHtml(x.name)}</button>`).join("")}</div><div class="row" style="margin-top:10px"><button class="ghost" id="cancelAction">キャンセル</button></div>`;p.querySelectorAll("[data-target]").forEach(b=>b.onclick=()=>{onSelect(+b.dataset.target);p.classList.add("hidden")});$("#cancelAction").onclick=()=>p.classList.add("hidden")}
function makeRolePanel(){const p=$("#actionPanel");p.classList.remove("hidden");p.innerHTML=`<b>COさせる役職を選択</b><div class="target-list">${ROLES.map(([r,n])=>`<button data-role="${r}">${n}</button>`).join("")}</div><div class="row" style="margin-top:10px"><button class="ghost" id="cancelAction">キャンセル</button></div>`;p.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{forceRoleCO(b.dataset.role);p.classList.add("hidden")});$("#cancelAction").onclick=()=>p.classList.add("hidden")}
function revealSeerResults(p){if(!p.seerResults.length){log(`${p.name}（占い師CO）：まだ占い結果はありません。`,"result");return}p.seerResults.forEach(r=>log(`${p.name}（占い師CO）：${byId(r.target).name} → ${r.black?"人狼":"人狼ではない"}`,"result"))}function revealMediumResults(p){if(!p.mediumResults.length){log(`${p.name}（霊媒師CO）：まだ霊媒結果はありません。`,"result");return}p.mediumResults.forEach(r=>log(`${p.name}（霊媒師CO）：${byId(r.target).name} → ${r.black?"人狼":"人狼ではない"}`,"result"))}
function forceRoleCO(r){const ps=roleLiving(r);if(!ps.length){log(`【${roleName(r)}CO指示】該当する生存者はいません。`,"system");return}ps.forEach(p=>p.claimed=r);log(`【役職CO指示】${roleName(r)}：${ps.map(p=>p.name).join("、")} がCOしました。`,"system");if(r==="seer")ps.forEach(revealSeerResults);if(r==="medium")ps.forEach(revealMediumResults);save();renderAll()}
function blackSeerCO(){const ps=roleLiving("seer").filter(p=>p.seerResults.some(r=>r.black));if(!ps.length){log("【黒出し占い師CO】黒結果を持つ生存占い師はいません。","system");return}ps.forEach(p=>{p.claimed="seer";revealSeerResults(p)});log(`黒結果を持つ占い師 ${ps.map(p=>p.name).join("、")} がCOしました。`,"system");save();renderAll()}
function blackMediumCO(){const ps=roleLiving("medium").filter(p=>p.mediumResults.some(r=>r.black));if(!ps.length){log("【黒出し霊媒師CO】黒結果を持つ生存霊媒師はいません。","system");return}ps.forEach(p=>{p.claimed="medium";revealMediumResults(p)});log(`黒結果を持つ霊媒師 ${ps.map(p=>p.name).join("、")} がCOしました。`,"system");save();renderAll()}
function hiddenSeerInstruction(){const h=roleLiving("seer").filter(p=>p.claimed!=="seer");if(!h.length){log("潜伏中の生存占い師はいません。","system");return}makeTargetPanel("潜伏占い師全員の占い先",living(),id=>{h.forEach(p=>p.forcedSeerTarget=id);log(`【潜伏占い指示】潜伏占い師全員の次回占い先を ${byId(id).name} に指定しました。`,"system");save();renderAll()})}
function hiddenGuardInstruction(){const h=roleLiving("knight").filter(p=>p.claimed!=="knight");if(!h.length){log("潜伏中の生存騎士はいません。","system");return}makeTargetPanel("潜伏騎士全員の護衛先",living(),id=>{h.forEach(p=>p.forcedGuardTarget=id);log(`【潜伏護衛指示】潜伏騎士全員の次回護衛先を ${byId(id).name} に指定しました。`,"system");save();renderAll()})}
function chooseExecution(){makeTargetPanel("本日の処刑対象を選択",living(),id=>{const p=byId(id);p.alive=false;state.lastExecuted=id;log(`${p.name} は処刑されました。`,"death");roleLiving("medium").forEach(m=>m.mediumResults.push({target:id,black:p.role==="wolf"}));const w=checkWin();if(w){finish(w);return}state.phase="night";log("夜になりました。","system");save();renderAll()})}
function randomChoice(a){return a.length?a[Math.floor(Math.random()*a.length)]:null}
function resolveNight(){if(state.phase!=="night"||state.winner)return;let foxKilled=[];roleLiving("seer").forEach(s=>{let t=s.forcedSeerTarget!=null&&byId(s.forcedSeerTarget)?.alive?byId(s.forcedSeerTarget):null;if(!t)t=randomChoice(living().filter(p=>p.id!==s.id));if(t){s.seerResults.push({target:t.id,black:t.role==="wolf"});if(t.role==="fox")foxKilled.push(t.id)}s.forcedSeerTarget=null});const guardTargets=[];roleLiving("knight").forEach(k=>{let t=k.forcedGuardTarget!=null&&byId(k.forcedGuardTarget)?.alive?byId(k.forcedGuardTarget):null;if(!t)t=randomChoice(living().filter(p=>p.id!==k.id));if(t)guardTargets.push(t.id);k.forcedGuardTarget=null});const wolves=roleLiving("wolf");let attacked=null;if(wolves.length)attacked=randomChoice(living().filter(p=>p.role!=="wolf"));foxKilled=[...new Set(foxKilled)];foxKilled.forEach(id=>{const p=byId(id);if(p&&p.alive){p.alive=false;log(`${p.name} が無残な姿で発見されました。`,"death")}});if(attacked&&attacked.alive){if(guardTargets.includes(attacked.id))log("平和な朝がやってきました。","result");else{attacked.alive=false;log(`${attacked.name} が無残な姿で発見されました。`,"death")}}else if(!foxKilled.length)log("平和な朝がやってきました。","result");const w=checkWin();if(w){finish(w);return}state.day++;state.phase="day";log(`${state.day}日目の朝になりました。`,"system");save();renderAll()}
function checkWin(){const a=living(),w=a.filter(p=>p.role==="wolf").length,f=a.filter(p=>p.role==="fox").length,o=a.length-w-f;if(w===0)return f>0?"妖狐陣営の勝利":"村人陣営の勝利";if(w>=o)return f>0?"妖狐陣営の勝利":"人狼陣営の勝利";return null}function finish(w){state.winner=w;state.phase="end";log(`ゲーム終了：${w}`,"system");save();renderAll()}function save(){localStorage.setItem("jinro_v01_state",JSON.stringify(state))}function load(){try{const r=localStorage.getItem("jinro_v01_state");if(!r){alert("保存データがありません");return}state=JSON.parse(r);showGame()}catch(e){alert("保存データを読み込めませんでした")}}function reset(){if(confirm("現在のゲームを終了して設定画面に戻りますか？")){localStorage.removeItem("jinro_v01_state");state=null;showSetup()}}function renderDebug(){if(!state)return;$("#debugText").innerHTML=state.players.map(p=>`${escapeHtml(p.name)}：${roleName(p.role)} / ${p.alive?"生存":"死亡"} / CO ${publicClaim(p)}`).join("<br>")}
$("#playerCount").addEventListener("input",renderRoleConfig);$("#startBtn").onclick=startGame;$("#loadBtn").onclick=load;$("#resetBtn").onclick=reset;$("#blackSeerBtn").onclick=blackSeerCO;$("#blackMediumBtn").onclick=blackMediumCO;$("#roleCoBtn").onclick=makeRolePanel;$("#hiddenSeerBtn").onclick=hiddenSeerInstruction;$("#hiddenGuardBtn").onclick=hiddenGuardInstruction;$("#executeBtn").onclick=chooseExecution;$("#nightBtn").onclick=resolveNight;$("#debugBtn").onclick=()=>$("#debugPanel").classList.toggle("hidden");renderRoleConfig();
</script></body></html>
