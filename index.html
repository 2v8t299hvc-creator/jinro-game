<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>個人用人狼アプリ v2.20.0-stage3</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a22; --panel2:#202532; --text:#f5f7fb; --muted:#9ca6b7;
  --accent:#7c9cff; --danger:#ff6b6b; --line:#2b3140; --warn:#ffd166; --ok:#5fd3a2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button,input{font:inherit}
button{border:0;border-radius:11px;padding:10px 12px;background:var(--accent);color:white;font-weight:700}
button.secondary{background:var(--panel2)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.45}
.wrap{max-width:980px;margin:auto;padding:76px 14px 118px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.grid{display:grid;gap:8px}
.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){.cols2,.cols3{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role-row{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.role-row:last-child{border-bottom:0}
input[type=number],input[type=text]{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0d1016;color:var(--text)}
.status{display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:5px 8px;border-radius:999px;background:var(--panel2);font-size:12px}
.hidden{display:none!important}
.notice{padding:9px 10px;border-radius:11px;background:#111827;border:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* compact player UI */
.claim-board{display:grid;gap:7px}
.claim-card{background:#11151d;border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.claim-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.claim-name{font-weight:800}
.claim-role{color:var(--warn);font-size:12px}
.claim-results{margin-top:5px;font-size:12px;line-height:1.45;color:#dbe3f2}
.player-list{display:grid;gap:5px}
.player-row{display:grid;grid-template-columns:minmax(90px,1.1fr) .8fr .7fr;gap:8px;align-items:center;padding:7px 9px;background:var(--panel2);border-radius:10px;border:1px solid var(--line);font-size:13px}
.player-row.dead{opacity:.48}
.player-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-co{color:var(--warn);white-space:nowrap}
.player-life{color:var(--muted);text-align:right}
@media(max-width:520px){
 .player-row{grid-template-columns:minmax(88px,1.2fr) .9fr .55fr;font-size:12px;padding:6px 8px}
}

.log{height:300px;overflow:auto;background:#0d1016;border-radius:11px;padding:10px;border:1px solid var(--line)}
.log p{margin:0 0 8px;line-height:1.45;font-size:13px}
.log .system{color:#c7d2fe}
.log .death{color:#ff9a9a}
.log .result{color:#a7f3d0}
.log .claim{color:#ffd166}
.target-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-top:9px}
.target-list button{background:var(--panel2);border:1px solid var(--line)}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}

.topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(15,17,23,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:980px;margin:auto;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.topbar-title{font-weight:800}.topbar-mini{font-size:12px;color:var(--muted)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(15,17,23,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bottom-nav-inner{max-width:980px;margin:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bottom-nav button{min-height:52px;padding:12px 8px;font-size:14px;border-radius:14px;touch-action:manipulation}
@media(max-width:520px){
  .bottom-nav-inner{gap:8px;padding-left:8px;padding-right:8px}
  .bottom-nav button{min-height:50px;font-size:13px}
}
.action-sheet{position:fixed;left:10px;right:10px;bottom:76px;z-index:60;max-width:720px;margin:auto;background:#141923;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.action-sheet-title{font-weight:800;margin-bottom:8px}.action-sheet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.action-sheet-grid button{background:var(--panel2)}.action-sheet-close{margin-top:8px;width:100%;background:transparent;border:1px solid var(--line)}
.tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}.tabbar button{flex:0 0 auto;padding:8px 10px;background:var(--panel2);font-size:12px}.tabbar button.active{background:var(--accent)}
.compact-section{padding:10px}.claim-role-section{margin-top:8px}.claim-role-label{font-weight:800;font-size:13px;color:var(--warn);margin-bottom:6px}
.claim-card{padding:8px 9px}.claim-results{font-size:11px}.player-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.player-row{grid-template-columns:1fr auto;gap:6px;padding:7px 8px}.player-row .player-co{grid-column:1/2;font-size:11px}.player-life{grid-row:1/3;grid-column:2/3;align-self:center}
@media(max-width:520px){.player-list{grid-template-columns:repeat(2,minmax(0,1fr))}.player-row{font-size:11px}}
.log.collapsed{height:108px}.log-toggle{width:100%;margin-top:8px;background:var(--panel2)}
.player-row.selectable{cursor:pointer;outline:1px solid transparent}.player-row.selectable:hover{outline-color:var(--accent)}.player-row.selectable.selected{background:#2b3655;outline:2px solid var(--accent)}.selection-hint{font-size:12px;color:var(--warn);margin-top:6px}.role-reveal{font-size:11px;color:var(--ok);font-weight:800;margin-top:3px}
.confirm-sheet{position:fixed;left:10px;right:10px;bottom:76px;z-index:70;max-width:720px;margin:auto;background:#141923;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.confirm-list{display:grid;gap:6px;margin:10px 0}
.confirm-item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.player-row.dimmed{opacity:.22;filter:saturate(.35)}
.player-row.selectable{cursor:pointer;outline:1px solid transparent}
.player-number{font-size:10px;color:var(--muted);margin-right:4px}

.log .talk{padding:7px 9px;margin:5px 0;border-left:3px solid var(--accent);background:rgba(127,127,127,.08);border-radius:8px}

.log-head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.log-head-row h2{margin-bottom:0}
#logPersonFilter{min-height:40px;max-width:180px;padding:7px 9px;border-radius:10px}

.broken-badge{display:inline-block;margin-left:4px;padding:2px 6px;border-radius:999px;font-size:11px;font-weight:800;background:#b42318;color:#fff;vertical-align:middle}
.broken-reason{margin-top:6px;padding:7px 9px;border-radius:8px;background:rgba(180,35,24,.10);font-size:12px;font-weight:700}

.confirmed-badge{display:inline-block;margin-left:4px;padding:2px 6px;border-radius:999px;font-size:11px;font-weight:800;background:#18794e;color:#fff;vertical-align:middle}
.confirmed-reason{margin-top:6px;padding:7px 9px;border-radius:8px;background:rgba(24,121,78,.10);font-size:12px;font-weight:700}

.assist-settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.assist-toggle{display:flex;align-items:center;gap:8px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-weight:700}
.assist-toggle input{width:18px;height:18px;margin:0}
.assist-note{font-size:12px;margin-top:4px}
@media(max-width:520px){.assist-settings{grid-template-columns:1fr}}
.role-summary{font-size:11px;line-height:1.6;opacity:.72;margin-top:5px;word-break:keep-all}

.preset-list{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}.preset-list button{padding:7px 11px;font-size:13px}.preset-list .preset-active{outline:2px solid currentColor}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div><div class="topbar-title">個人用人狼 v2.20.0-stage3</div><div class="topbar-mini" id="topbarPhase">待機中</div></div>
  <div class="row"><button class="ghost" id="debugBtnTop">デバッグ</button><button class="danger" id="resetBtnTop">終了</button></div>
</div></div>
<div class="wrap">

  <section id="setupScreen">
    <div class="card">
      <h2>ゲーム設定</h2>
      <div class="grid cols2">
        <label>参加人数<input id="playerCount" type="number" min="5" max="20" value="9"></label>
        <label>自分の名前<input id="selfName" type="text" value="あなた" maxlength="12"></label>
      </div>
      <hr>
      <h2>推理補助表示</h2>
      <div class="assist-settings">
        <label class="assist-toggle"><input id="showConfirmedBadges" type="checkbox" checked> 真確定を自動表示</label>
        <label class="assist-toggle"><input id="showBrokenBadges" type="checkbox" checked> 破綻を自動表示</label>
      </div>
      <div class="muted assist-note">OFFでも内部判定とCOMの推理はそのまま動作します。</div>
      <hr>
      <h2>配役</h2>
      <label class="assist-toggle"><input id="firstVictimEnabled" type="checkbox"> 初日犠牲者あり（役欠けあり）</label>
      <div class="muted">ONでテンプレを選ぶと村人を1人追加します。参加人数は初日死亡者を含む総人数です。</div>
      <div class="preset-list" id="presetList"></div>
      <div id="roleConfig"></div>
      <div class="notice" id="sumNotice"></div>
      <div class="row" style="margin-top:12px">
        <button id="startBtn">ゲーム開始</button>
        <button class="secondary" id="loadBtn">保存データを再開</button>
      </div>
    </div>
  </section>

  <section id="gameScreen" class="hidden">


    <div class="card compact-section"><div class="status" id="statusBadges"></div><div id="roleSummary" class="role-summary"></div><div id="selectionHint" class="selection-hint hidden"></div></div>

    <div class="card compact-section">
      <div class="tabbar" id="claimTabs">
        <button data-claimtab="seer" class="active">占い</button>
        <button data-claimtab="medium">霊媒</button>
        <button data-claimtab="knight">騎士</button>
        <button data-claimtab="resonator">共鳴</button>
        <button data-claimtab="cat">猫又</button>
        <button data-claimtab="villager">村人</button>
      </div>
      <div id="claimBoard" class="claim-board claim-role-section"></div>
    </div>

    <div class="card compact-section">
      <h2>全プレイヤー</h2>
      <div id="players" class="player-list"></div>
    </div>

    <div class="card compact-section">
      <div class="log-head-row">
        <h2>公開ログ</h2>
        <select id="logPersonFilter" aria-label="人物でログを絞り込む">
          <option value="">全員のログ</option>
        </select>
      </div>
      <div id="log" class="log collapsed"></div>
      <button id="logToggleBtn" class="log-toggle">ログを全部見る</button>
    </div>

    <div class="card compact-section"><button id="discussionBtn">議論を促す</button><button id="playerDiscussionBtn" class="secondary" style="margin-left:8px">自分の意見を話す</button><div id="discussionStatus" class="muted" aria-live="polite"></div></div>
    <div id="actionPanel" class="hidden"></div>

    <div id="actionSheet" class="action-sheet hidden">
      <div id="actionSheetTitle" class="action-sheet-title">操作</div>
      <div id="actionSheetGrid" class="action-sheet-grid"></div>
      <button id="actionSheetClose" class="action-sheet-close">閉じる</button>
    </div>

    <div id="confirmSheet" class="confirm-sheet hidden">
      <div style="font-weight:800">処刑前の確認</div>
      <div id="confirmTarget" class="muted" style="margin-top:4px"></div>
      <div id="confirmInstructions" class="confirm-list"></div>
      <div class="confirm-actions">
        <button id="confirmExecuteBtn">確認して処刑</button>
        <button id="cancelExecuteBtn" class="secondary">戻る</button>
      </div>
    </div>

    <div class="bottom-nav"><div class="bottom-nav-inner">
      <button id="navCo">CO</button>
      <button id="navSeer" class="secondary">占い</button>
      <button id="navGuard" class="secondary">護衛</button>
      <button id="navFlow" class="secondary">進行</button>
    </div></div>

    <div id="debugPanel" class="card hidden">
      <h2>デバッグ情報</h2>
      <div id="debugText" class="muted"></div>
    </div>
  </section>

  <div class="footer">端末内保存。サーバー通信なし。</div>
</div>

<script>
const GAME_VERSION="2.20.0-stage3";
// 投票AI導入までの暫定制約。公開の村人証明としては使用しない。
const PLAYER_RESULT_TRUTH_ONLY=true;
function temporaryPlayerResultColor(targetId){
  const target=byId(targetId);
  return PLAYER_RESULT_TRUTH_ONLY&&target?.isSelf?target.role==="wolf":null;
}
const ROLES=[
  ["villager","村人"],["seer","占い師"],["knight","騎士"],["medium","霊媒師"],
  ["madman","狂人"],["wolf","人狼"],["fox","妖狐"],["resonator","共鳴者"],["cat","猫又"]
];
const TEAM={villager:"村人陣営",seer:"村人陣営",knight:"村人陣営",medium:"村人陣営",madman:"人狼陣営",wolf:"人狼陣営",fox:"妖狐陣営",resonator:"村人陣営",cat:"村人陣営"};
let state=null;
const $=s=>document.querySelector(s);
const roleName=r=>ROLES.find(x=>x[0]===r)?.[1]??r;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const randomChoice=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function defaultCounts(n){
  const b={villager:3,seer:1,knight:1,medium:1,madman:1,wolf:2,fox:0,resonator:0,cat:0};
  if(n<9){
    b.villager=Math.max(1,n-4); b.medium=n>=7?1:0; b.madman=n>=6?1:0;
    b.knight=n>=6?1:0; b.wolf=n>=7?2:1; b.seer=1;
  }else if(n>9){b.villager+=n-9}
  return b;
}
const ROLE_PRESETS={
  9:{villager:3,seer:1,medium:1,knight:1,wolf:2,madman:1},
  11:{villager:4,seer:1,medium:1,knight:1,wolf:2,madman:1,fox:1},
  13:{villager:4,seer:1,medium:1,knight:1,cat:1,wolf:3,madman:1,fox:1},
  15:{villager:4,seer:1,medium:1,resonator:2,knight:1,cat:1,wolf:3,madman:1,fox:1},
  17:{villager:5,seer:1,medium:1,knight:1,resonator:2,cat:1,wolf:4,madman:1,fox:1}
};
let selectedRolePreset=null;
function applyRolePreset(n){
  const preset=ROLE_PRESETS[n];if(!preset)return;
  selectedRolePreset=n;
  const extra=$("#firstVictimEnabled").checked?1:0;
  $("#playerCount").value=n+extra;
  document.querySelectorAll("[data-role-count]").forEach(e=>e.value=(preset[e.dataset.roleCount]||0)+(e.dataset.roleCount==="villager"?extra:0));
  updateSum();
  document.querySelectorAll("[data-preset]").forEach(b=>b.classList.toggle("preset-active",+b.dataset.preset===n));
}
function renderRolePresets(){
  $("#presetList").innerHTML=Object.keys(ROLE_PRESETS).map(n=>`<button type="button" class="secondary" data-preset="${n}">${n}人村</button>`).join("");
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>applyRolePreset(+b.dataset.preset));
}
function renderRoleConfig(){
  const n=clamp(+$("#playerCount").value,5,20),saved={};
  document.querySelectorAll("[data-role-count]").forEach(e=>saved[e.dataset.roleCount]=+e.value||0);
  const c=Object.keys(saved).length?saved:defaultCounts(n);
  $("#roleConfig").innerHTML=ROLES.map(([k,nm])=>`
    <div class="role-row">
      <div><b>${nm}</b><div class="muted">${TEAM[k]}</div></div>
      <input type="number" min="0" max="20" value="${c[k]??0}" data-role-count="${k}">
    </div>`).join("");
  document.querySelectorAll("[data-role-count]").forEach(e=>e.addEventListener("input",()=>{selectedRolePreset=null;updateSum()}));
  updateSum();
}
function getRoleCounts(){const o={};document.querySelectorAll("[data-role-count]").forEach(e=>o[e.dataset.roleCount]=Math.max(0,+e.value||0));return o}
function hasOpeningVictimCandidate(counts){
  return Object.entries(counts).some(([role,count])=>!['wolf','fox'].includes(role)&&count>(role==='villager'?1:0));
}
function updateSum(){
  const n=+$("#playerCount").value,c=getRoleCounts(),sum=Object.values(c).reduce((a,b)=>a+b,0);
  const victimOK=!$("#firstVictimEnabled").checked||hasOpeningVictimCandidate(c);
  const ok=sum===n&&c.villager>=1&&c.wolf>=1&&victimOK;
  $("#sumNotice").innerHTML=`配役合計 <b>${sum}</b> / ${n}人　${ok?"✅ 開始できます":!victimOK?"⚠️ 初日犠牲者の候補となる、主人公以外の人狼・妖狐以外の参加者が必要です":"⚠️ 合計人数を合わせ、村人1人以上・人狼1人以上にしてください"}`;
  $("#startBtn").disabled=!ok;
}

// COM19人の設定。第1段階では選出・名前・保存のみで、戦略や口調には使わない。
const CHARACTER_ROSTER_VERSION=1;
const CHARACTER_AXIS_KEYS=["deception", "observation", "emotionality", "logic", "assertiveness", "willingnessToCut", "coordination"];
const CHARACTER_ROSTER=[
  {
    "id": "joshua",
    "name": "ジョシュア",
    "summary": "誠実で親しみやすい好青年。全員の基準となる標準型。",
    "stats": {
      "deception": 3,
      "observation": 3,
      "emotionality": 3,
      "logic": 3,
      "assertiveness": 3,
      "willingnessToCut": 3,
      "coordination": 3
    },
    "voice": {
      "firstPerson": "僕",
      "register": "柔らかい常体。必要に応じて丁寧語も使う",
      "expressionLevel": 3,
      "habits": [
        "相手の意見を一度受け止める",
        "断定前に根拠を添える"
      ],
      "sample": "なるほどね。僕は、昨日の結果と合わせて考えてみたいな。"
    },
    "reasoningStyle": "balanced",
    "behavior": {
      "strength": "意見を聞きながら、根拠が増えれば適度に更新する",
      "weakness": "強い専門性や押しの強さはなく、判断に迷うことがある",
      "asVillage": "整理・質問・同意・反論を偏りすぎず使う",
      "asHostile": "普通の推理を交え、状況に応じて庇いと切断を選ぶ"
    },
    "relationships": [],
    "rationale": "全項目3。今後のキャラ差とパラメータ効果を比べる基準。"
  },
  {
    "id": "geode",
    "name": "ジオード",
    "summary": "軽薄そうに振る舞うおじさん。冗談の裏で状況と損得をよく見ている。",
    "stats": {
      "deception": 4,
      "observation": 3,
      "emotionality": 2,
      "logic": 4,
      "assertiveness": 4,
      "willingnessToCut": 4,
      "coordination": 2
    },
    "voice": {
      "firstPerson": "俺",
      "register": "くだけた常体。軽い冗談を時々挟む",
      "expressionLevel": 4,
      "habits": [
        "柔らかく切り込む",
        "軽口の後に具体的な論点を出す"
      ],
      "sample": "いやあ、耳が痛いねえ。でも、その話だと昨日の結果はどうなる？"
    },
    "reasoningStyle": "pragmatic",
    "behavior": {
      "strength": "空気を読んで論点を動かし、切り替えが速い",
      "weakness": "軽い態度や早い方針転換で、信用しづらいと思われることがある",
      "asVillage": "人柄より根拠と損得で判断し、以前の支持にも固執しない",
      "asHostile": "説明や誘導が上手く、無理な庇いより距離を置く判断を選びやすい"
    },
    "relationships": [],
    "rationale": "嘘4・論理4で見た目より切れる。見抜きは3で万能にしない。身内切り4・連携2は身軽さを表す。"
  },
  {

function copyCharacterProfile(profile){

}
function chooseVillageCharacters(count){
  // 元の一覧を変更せず、役職抽選とは別のシャッフルで重複なしに選ぶ。
  return shuffle([...CHARACTER_ROSTER]).slice(0,count);
}
function createCharacterPlayer(id,profile,role){
  const player=newPlayer(id,profile.name,role,false);
  player.characterId=profile.id;
  player.characterProfile=copyCharacterProfile(profile);
  return player;
}
function hasValidCharacterProfile(profile,id){
  return !!profile&&profile.id===id&&profile.stats&&
    CHARACTER_AXIS_KEYS.every(key=>Number.isInteger(profile.stats[key])&&profile.stats[key]>=1&&profile.stats[key]<=5);
}
function ensureCharacterMetadata(){
  for(const player of state.players||[]){
    if(player.isSelf){player.characterId=null;player.characterProfile=null;continue;}
    if(player.characterId===undefined)player.characterId=null;
    if(player.characterId===null){
      // 旧村は名前・席順・役職をそのまま残す。再抽選やキャラへの置換はしない。
      if(player.characterProfile===undefined)player.characterProfile=null;
      continue;
    }
    if(!hasValidCharacterProfile(player.characterProfile,player.characterId)){
      const profile=CHARACTER_ROSTER.find(character=>character.id===player.characterId);
      player.characterProfile=profile?copyCharacterProfile(profile):null;
    }
  }
  if(state.characterRosterVersion===undefined)
    state.characterRosterVersion=state.players.some(player=>player.characterId)?CHARACTER_ROSTER_VERSION:0;
}

function divinationKillsFox(day){return day>1||state?.openingRulesVersion===1;}
function openingPublicDeaths(){
  return state?.openingRulesVersion===1?(state.publicRecords?.deaths||[]).filter(d=>d.day===1&&d.phase==='night'):[];

function openingAllowsRole(id,role){
  const deaths=openingPublicDeaths();
  if(!deaths.some(d=>d.playerId===id))return true;
  if(!state.firstVictimEnabled)return role==='fox';
  // 一死体なら呪殺も猫の道連れもない。初日襲撃では狼と狐は選ばれない。
  if(deaths.length===1)return !['wolf','fox','cat'].includes(role);
  if(publicRoleCount('cat')===0&&role==='wolf')return false;
  return true;
}
function matchOpeningHypothesisRoles(domains,counts){
  const ids=openingPublicDeaths().map(d=>d.playerId);
  if(!state.firstVictimEnabled||!ids.length)return matchHypothesisRoles(domains,counts);
  // 開始死体は「非猫の襲撃犠牲者＋狐」か「猫＋狼＋狐」のどちらか。
  // 原因を読まず公開ルールから可能な配置だけを列挙する。
  const constrain=(victim,wolf)=>domains.map(d=>({...d,roles:d.roles.filter(role=>{
    if(!ids.includes(d.id))return true;
    if(d.id===victim)return wolf==null?!['wolf','fox','cat'].includes(role):role==='cat';
    if(d.id===wolf)return role==='wolf';
    return role==='fox';
  })}));
  for(const victim of ids){
    const ordinary=matchHypothesisRoles(constrain(victim,null),counts);
    if(ordinary)return ordinary;
    if(counts.cat>0)for(const wolf of ids.filter(id=>id!==victim)){
      const cat=matchHypothesisRoles(constrain(victim,wolf),counts);
      if(cat)return cat;
    }
  }
  return null;
}
function resolveOpeningNight(){
  if(state.openingResolved)return;
  const victim=state.firstVictimEnabled?randomChoice(living().filter(p=>!p.isSelf&&!['wolf','fox'].includes(p.role))):null;
  const foxes=new Set();
  // 死亡予定の占い師も能力は成立。対象・結果は死亡の反映より前に決める。
  for(const seer of roleLiving('seer').slice()){
    const target=autoSeerTarget(seer,[]);
    if(!target)continue;
    seer.seerResults.push({day:1,target:target.id,black:target.role==='wolf'});
    if(target.role==='fox')foxes.add(target.id);
  }
  const victims=new Set(foxes);
  if(victim){
    victims.add(victim.id);
    if(victim.role==='cat'){
      const wolf=randomChoice(roleLiving('wolf'));
      if(wolf)victims.add(wolf.id);
    }
  }
  // 原因と役職は公開しない。通常の襲撃死と同じ表示・公開記録。
  for(const id of [...victims].sort((a,b)=>a-b)){
    const p=byId(id);if(!p?.alive)continue;
    p.alive=false;recordPublicDeath(p,1,'night','found-dead');
    log(`${p.name} が無残な姿で発見されました。`,'death');
  }
  state.openingResolved=true;
}
function startGame(){
  const n=clamp(+$("#playerCount").value,5,20),c=getRoleCounts();
  if(Object.values(c).reduce((a,b)=>a+b,0)!==n||c.villager<1||c.wolf<1)return;
  if($("#firstVictimEnabled").checked&&!hasOpeningVictimCandidate(c)){
    alert("初日犠牲者になれる参加者がいません。人狼・妖狐以外のCOMを配役してください。");return;
  }
  if(c.resonator===1){
    alert("共鳴者は2人以上で配役してください。");
    return;
  }

  const roles=[],assign={...c,villager:c.villager-1};
  for(const[r]of ROLES)for(let i=0;i<assign[r];i++)roles.push(r);
  shuffle(roles);

  const characters=chooseVillageCharacters(n-1);
  const self=newPlayer(0,$("#selfName").value.trim()||"あなた","villager",true);
  self.characterId=null;self.characterProfile=null;
  const ps=[self];
  for(let i=1;i<n;i++)ps.push(createCharacterPlayer(i,characters[i-1],roles[i-1]));

  state={
    version:GAME_VERSION,discussionMode:"stage3",intuitionEnabled:true,speechMemoryEnabled:true,characterRosterVersion:CHARACTER_ROSTER_VERSION,day:1,phase:"day",players:ps,logs:[],winner:null,lastExecuted:null,
    publicRoleCounts:{...c},openingRulesVersion:1,firstVictimEnabled:!!$("#firstVictimEnabled").checked,
    publicRecords:{seerResults:[],mediumResults:[],guards:[],executions:[],deaths:[],catChains:[],resonatorClaims:[],fullCoRequests:[],confirmedProofs:[],coEvents:[]},
    uiSettings:{
      showConfirmedBadges:!!$("#showConfirmedBadges")?.checked,
      showBrokenBadges:!!$("#showBrokenBadges")?.checked
    },
    logPersonFilterId:null
  };


  discussionState();initializeAffinity();initializeStrategicDiscussion();
  assignFakeClaims();
  ensureWolfSeerPlan();

  // 潜伏人外には結果ではなく、その日に選べる対象だけを記録する。
  state.players.filter(hostile).forEach(p=>ensureFakeSeerTimeline(p));

  log(`ゲーム開始。参加者は${n}人。`,"system");
  // 本人向け役職通知。公開情報/COMの推理材料には渡さない。
  state.logs.push({msg:`あなたの役職は【${roleName(self.role)}】です。`,cls:"system",visibility:"private",recipientId:self.id});
  resolveOpeningNight();
  const openingWinner=checkWin();
  if(openingWinner)finish(openingWinner);
  else runDaySpeeches();
  renderLog();save();showGame();
}

function assignFakeClaims(){
  // 狂人：占い騙りが中心。低確率で猫又騙りも選ぶ。
  state.players.filter(p=>p.role==="madman").forEach(m=>{
    const r=Math.random();
    m.fakeClaimRole=r<0.56?"seer":r<0.73?"medium":r<0.81?"cat":r<0.88?"knight":null;
  });

  // 人狼：一定確率で1匹が騙り役。占い中心、霊媒、低確率で猫又。
  const wolves=state.players.filter(p=>p.role==="wolf");
  if(wolves.length&&Math.random()<0.65){
    const liar=randomChoice(wolves);
    const r=Math.random();
    liar.fakeClaimRole=r<0.62?"seer":r<0.80?"medium":r<0.91?"cat":"knight";
  }

  // 妖狐：騙り自体は控えめ。猫又騙りも低確率で残す。
  state.players.filter(p=>p.role==="fox").forEach(f=>{
    const r=Math.random();
    f.fakeClaimRole=r<0.16?"seer":r<0.24?"medium":r<0.30?"cat":r<0.34?"knight":null;
  });
}

function ensurePublicRecords(){
  if(!state.publicRecords)state.publicRecords={};

  for(const k of ["seerResults","mediumResults","guards","executions","deaths","catChains","resonatorClaims","fullCoRequests","confirmedProofs","coEvents","blackSeerCoRequests","guardInstructions"]){
    if(!Array.isArray(r[k]))r[k]=[];
  }
  // 旧判定には主人公の公開村人固定から派生した証明も含まれ得る。
  // 公開ログは保持し、旧証明を判定材料から一度だけ外す。再確定は公開記録から行う。
  if(r.truthRulesVersion!==3){
    if(r.confirmedProofs.length)r.legacyConfirmedProofs=[...(r.legacyConfirmedProofs||[]),...r.confirmedProofs];
    r.confirmedProofs=[];
    r.truthRulesVersion=3;
  }
  if(!state.publicRoleCounts)state.publicRoleCounts=null;
}

function resultHistory(p){
  ensurePublicRecords();
  if(p.claimed!=="seer"&&p.claimed!=="medium")return "";
  const arr=p.claimed==="seer"
    ?state.publicRecords.seerResults.filter(r=>r.seerId===p.id)
    :state.publicRecords.mediumResults.filter(r=>r.mediumId===p.id);
  return arr.map(r=>`${r.day}日 ${byId(r.targetId)?.name??"不明"}${r.black?"●":"○"}`).join(" / ");
}

function speechTopicCountToday(kind,targetId=null){
  if(!state)return 0;
  let n=0;
  for(const p of state.players||[]){
    for(const h of p.speechHistory||[]){
      if(h.day!==state.day||h.kind!==kind)continue;
      if(targetId!==null&&h.targetId!==targetId)continue;
      n++;
    }
  }
  return n;
}
function observerMentionedRecently(observer,kind,targetId=null,days=1){
  return (observer.speechHistory||[]).some(h=>
    h.kind===kind &&
    (targetId===null||h.targetId===targetId) &&
    h.day>=state.day-days &&
    h.day<state.day
  );
}
function truthFirstMentionDay(kind,targetId){
  const matching=[];
  for(const p of state.players||[]){
    for(const h of p.speechHistory||[]){
      if(h.kind===kind&&h.targetId===targetId)matching.push(h.day);
    }
  }
  return matching.length?Math.min(...matching):null;
}

}
function latestPublicMediumResultFor(mediumId){
  const rows=(state.publicRecords?.mediumResults||[]).filter(r=>r.mediumId===mediumId);

function selectConfirmedPremiseTopic(observer,publicInfo,confirmedMap){
  const confirmed=[...confirmedMap.keys()]
    .map(id=>byId(id))
    .filter(p=>p&&p.alive&&p.id!==observer.id);

  // 真占いの最新結果を「次の推理」に接続
  const cs=confirmed.find(p=>p.claimed==="seer");
  if(cs){
    const r=latestPublicSeerResultFor(cs.id);
    if(r){
      const t=byId(r.targetId);
      if(t&&t.alive&&t.id!==observer.id){
        if(r.black){
          return {kind:"confirmedPremise",targetId:t.id,variant:"confirmedSeerBlack",details:{seerId:cs.id,seerName:cs.name,targetName:t.name}};
        }
        return {kind:"confirmedPremise",targetId:t.id,variant:"confirmedSeerWhite",details:{seerId:cs.id,seerName:cs.name,targetName:t.name}};
      }
    }
  }

  // 真霊媒の最新結果を次の整理に利用
  const cm=confirmed.find(p=>p.claimed==="medium");
  if(cm){
    const r=latestPublicMediumResultFor(cm.id);
    if(r){
      const t=byId(r.targetId);
      if(t){
        return {kind:"confirmedPremise",targetId:t.id,variant:"confirmedMediumResult",details:{mediumId:cm.id,mediumName:cm.name,targetName:t.name}};
      }
    }
  }

  // 共鳴・猫又などは「吊り候補から外す」前提として使う
  const cv=confirmed.find(p=>["cat","knight"].includes(p.claimed));
  if(cv){
    return {kind:"confirmedPremise",targetId:cv.id,variant:"confirmedRolePremise",details:{targetName:cv.name,roleLabel:roleName(cv.claimed)}};
  }
  return null;
}
function renderClaimBoard(){
  const role=state.claimTab||"seer";
  let members=[],label="";
  if(role==="seer"){members=state.players.filter(p=>p.claimed==="seer");label="【占いCO者】"}
  if(role==="medium"){members=state.players.filter(p=>p.claimed==="medium");label="【霊媒師CO者】"}
  if(role==="knight"){members=state.players.filter(p=>p.claimed==="knight");label="【騎士CO者】"}
  if(role==="resonator"){members=state.players.filter(p=>p.claimed==="resonator");label="【共鳴者CO者】"}
  if(role==="cat"){members=state.players.filter(p=>p.claimed==="cat");label="【猫又CO者】"}
  if(role==="villager"){members=state.players.filter(p=>p.villagerClaim===true&&!p.claimed);label="【村人CO者】"}
  document.querySelectorAll("[data-claimtab]").forEach(b=>b.classList.toggle("active",b.dataset.claimtab===role));
  if(!members.length){$("#claimBoard").innerHTML=`<div class="muted">${label} なし</div>`;return}
  $("#claimBoard").innerHTML=`<div class="claim-role-label">${label}</div>`+members.map(p=>{
    let detail="";
    if(role==="seer"||role==="medium"){const h=resultHistory(p);detail=h?`<div class="claim-results">${escapeHtml(h)}</div>`:""}
    else if(role==="knight"){const gh=(state.publicRecords?.guards||[]).filter(r=>r.knightId===p.id).map(r=>`${r.day}日 ${byId(r.targetId)?.name??"不明"}護衛`).join(" / ");detail=gh?`<div class="claim-results">${escapeHtml(gh)}</div>`:`<div class="claim-results muted">護衛記録なし</div>`}
    else if(role==="resonator"){const partners=(p.resonancePartners||[]).map(id=>byId(id)?.name).filter(Boolean).join("、");detail=partners?`<div class="claim-results">相方：${escapeHtml(partners)}</div>`:""}
    const ch=(p.coHistory||[]).filter(e=>e.kind==="withdraw");
    if(ch.length)detail+=`<div class="claim-results">CO変更履歴：${escapeHtml(ch.map(e=>`${e.day}日目 ${e.role==="villager"?"村人":roleName(e.role)}CO撤回`).join(" / "))}</div>`;
    const br=brokenReasonsFor(p.id);
    const cr=confirmedReasonsFor(p.id);
    const showBr=showBrokenAssist()&&br.length;
    const showCr=showConfirmedAssist()&&cr.length;
    const broken=showBr?`<div class="broken-reason">⚠ 破綻：${escapeHtml(br.join(" / "))}</div>`:"";
    const confirmed=showCr?`<div class="confirmed-reason">✓ 真確定：${escapeHtml(cr.join(" / "))}</div>`:"";
    return `<div class="claim-card"><div class="claim-head"><div class="claim-name">${escapeHtml(p.name)}${p.alive?"":"（死亡）"}</div><div class="claim-role">${role==="villager"?"村人CO":roleName(role)+"CO"}${showBr?` <span class="broken-badge">破綻</span>`:""}${showCr?` <span class="confirmed-badge">真確定</span>`:""}</div></div>${detail}${broken}${confirmed}</div>`
  }).join("");
}

function handlePanelSelection(id){
  if(!state.selectionMode||!state._selectionCallback)return;
  if(state._selectionAllowed&&!state._selectionAllowed.includes(id))return;
  const cb=state._selectionCallback;
  if(state.selectionMode==="seer-source"||state.selectionMode==="guard-source"){
    cb(id);
    return;
  }
  clearSelection();
  cb(id);
  renderAll();
}

function reportTrueSeer(p,first=false){
  if(!p.alive)return; // 襲撃死した占い師は占いが成立しても報告不可
  if(first)log(`${p.name} が【占い師CO】しました。`,"claim");
  const unread=p.seerResults.slice(p.lastReportedSeerCount||0);
  if(!unread.length&&first){log(`${p.name}（占い師CO）：まだ占い結果はありません。`,"result");return}
  unread.forEach(r=>{
    log(`${p.name}（占い師CO）：${byId(r.target).name} → ${r.black?"人狼":"人狼ではない"}`,"result");
    publishedSeerRecord(p,r.target,r.black,r.day);
  });
  p.lastReportedSeerCount=p.seerResults.length;
}
function reportFakeSeer(p,first=false,prepared=null){
  if(!p.alive)return;
  const pending=prepared??prepareFakeSeerReports(p);
  if(first)log(`${p.name} が【占い師CO】しました。`,"claim");
  for(const r of pending){
    // 発表直前にも制約を確認。公開後の結果を書き換えることはない。
    if(state.publicRecords.seerResults.some(x=>x.seerId===p.id&&x.day===r.day))continue;
    if(r.target===p.id)continue;
    let black=consistentFakeSeerBlack(p,r.target,r.day,r.black,p.fakeSeerResults,!!r.jusatsuResponse);
    if(hostile(p)&&black!==null){
      const colors=fakeSeerAllowedColors(p,r.target,r.day,p.fakeSeerResults,!!r.jusatsuResponse);
      if(!colors.includes(black))black=colors.length===1?colors[0]:null;
    }
    if(black===null){
      if(!Array.isArray(p.fakeSeerWithheldReports))p.fakeSeerWithheldReports=[];
      if(p.fakeSeerWithheldReports.some(h=>h.day===r.day))continue;
      p.fakeSeerWithheldReports.push({day:r.day,target:r.target});
      log(`${p.name}（占い師CO）：${r.day}日目の判定は以前の結果と確定情報が両立せず、公表できません。`,"result");
      continue;
    }
    const result={...r,black};
    if(result.strategy)result.strategy={...JSON.parse(JSON.stringify(result.strategy)),publishedBlack:black,rechecked:true};
    p.fakeSeerResults.push(result);
    log(`${p.name}（占い師CO）：${byId(result.target).name} → ${result.black?"人狼":"人狼ではない"}`,"result");
    publishedSeerRecord(p,result.target,result.black,result.day);
  }
  p.lastReportedSeerCount=p.fakeSeerResults.length;
}
// 真偽共通の公表処理。初回の「結果なし」表示は真霊媒だけが行う従来仕様。
function publishUnreadMediumResults(p,results,first,reportEmpty){
  if(!p.alive)return;
  if(first)log(`${p.name} が【霊媒師CO】しました。`,"claim");
  const unread=results.slice(p.lastReportedMediumCount||0);
  if(!unread.length&&first&&reportEmpty){log(`${p.name}（霊媒師CO）：まだ霊媒結果はありません。`,"result");return}
  unread.forEach(r=>{
    log(`${p.name}（霊媒師CO）：${byId(r.target).name} → ${r.black?"人狼":"人狼ではない"}`,"result");
    publishedMediumRecord(p,r.target,r.black,r.day);
  });
  p.lastReportedMediumCount=results.length;
}
function reportTrueMedium(p,first=false){
  publishUnreadMediumResults(p,p.mediumResults,first,true);
}
function ensureFakeMediumResults(p){
  if(!p.alive||!hostile(p))return;
  ensurePublicRecords();
  if(!Array.isArray(p.fakeMediumResults))p.fakeMediumResults=[];
  // 潜伏中は白黒を固定せず、CO時点の公開盤面で過去の処刑結果を補う。
  const executions=[...state.publicRecords.executions].sort((a,b)=>a.day-b.day);
  for(const execution of executions){
    const day=execution.day+1,target=byId(execution.playerId);
    if(!target||day>state.day||target.id===p.id)continue;
    const published=state.publicRecords.mediumResults.some(r=>r.mediumId===p.id&&r.targetId===target.id&&r.day===day);
    if(published)continue; // 公表済みの判定を再生成・上書きしない。
    appendMorningMediumResult(p,p.fakeMediumResults,target,day,createFakeMediumResult);
  }
}
function reportFakeMedium(p,first=false){
  ensureFakeMediumResults(p);
  if(!p.alive)return;
  // 準備済み・未公表の結果も確認。公開済みの古い結果は変更しない。
  for(const r of (p.fakeMediumResults||[]).slice(p.lastReportedMediumCount||0)){
    const color=temporaryPlayerResultColor(r.target);
    const published=(state.publicRecords.mediumResults||[]).some(x=>x.mediumId===p.id&&x.targetId===r.target&&x.day===r.day);
    if(color!==null&&!published)r.black=color;
  }
  publishUnreadMediumResults(p,p.fakeMediumResults,first,false);
}

    .filter(r=>r.resultDay===day&&r.recipientIds.includes(p.id))
    .reduce((latest,r)=>!latest||r.order>latest.order?r:latest,null);

function fakeGuardCandidates(p,day){
  return state.players.filter(x=>x.id!==p.id&&!(state.publicRecords?.deaths||[])
    .some(d=>d.playerId===x.id&&d.day<day));
}
function ensureFakeGuardHistory(p){
  if(!Array.isArray(p.fakeGuardHistory))p.fakeGuardHistory=[];
  const published=(state.publicRecords?.guards||[]).filter(r=>r.knightId===p.id);
  // 公表済み日記は保存配列が欠けても復元するだけで、再抽選しない。
  for(const r of published)if(!p.fakeGuardHistory.some(h=>h.day===r.day))
    p.fakeGuardHistory.push({day:r.day,target:r.targetId});
  const reportedDays=new Set(p.fakeGuardHistory.map(r=>r.day));
  for(let day=2;day<=state.day;day++){
    if(reportedDays.has(day))continue;
    const possible=fakeGuardCandidates(p,day),instruction=guardInstructionForDay(p,day);
    const directed=instruction?possible.find(x=>x.id===instruction.targetId):null;
    const target=directed||randomChoice(possible);
    if(target){p.fakeGuardHistory.push({day,target:target.id});reportedDays.add(day);}
  }
}
function reportKnight(p,first=false){
  if(!p.alive)return;
  if(first)log(`${p.name} が【騎士CO】しました。`,"claim");
  if(p.role!=="knight")ensureFakeGuardHistory(p);
  const hist=p.role==="knight"?(p.guardHistory||[]):(p.fakeGuardHistory||[]);
  const published=new Set((state.publicRecords?.guards||[]).filter(r=>r.knightId===p.id).map(r=>r.day));
  const unread=hist.filter(r=>!published.has(r.day));
  if(!unread.length&&first)log(`${p.name}（騎士CO）：まだ護衛記録はありません。`,"result");
  unread.forEach(r=>{
    log(`${p.name}（騎士CO）：${r.day}日目は ${byId(r.target)?.name??"不明"} を護衛しました。`,"result");
    publishedGuardRecord(p,r.target,r.day);
  });
}
// 潜伏中は白黒を固定せず、対象候補・明示指示とCO制約だけを保存する。
function fakeSeerTargetsForDay(liar,day){
  return state.players.filter(p=>p.id!==liar.id&&!(state.publicRecords.deaths||[])
    .some(d=>d.playerId===p.id&&d.day<day)).map(p=>p.id);
}
function ensureFakeSeerTimeline(liar){
  ensurePublicRecords();
  if(!Array.isArray(liar.fakeSeerOpportunities))liar.fakeSeerOpportunities=[];
  if(liar.fakeSeerRulesVersion!==1){
    const legacy=liar.fakeSeerResults||[];
    // 公開済み結果は変更しない。旧未公開結果は指示された対象だけを引き継ぐ。
    for(const r of legacy){
      if(!liar.fakeSeerOpportunities.some(o=>o.day===r.day))liar.fakeSeerOpportunities.push({
        day:r.day,allowedTargetIds:fakeSeerTargetsForDay(liar,r.day),
        forcedTarget:r.lockedTarget?r.target:null,lockedTarget:!!r.lockedTarget
      });
    }
    liar.fakeSeerResults=state.publicRecords.seerResults.filter(r=>r.seerId===liar.id)
      .map(r=>({day:r.day,target:r.targetId,black:r.black}));
    liar.lastReportedSeerCount=liar.fakeSeerResults.length;
    liar.fakeSeerRulesVersion=1;
  }
  for(let day=1;day<=state.day;day++){
    if(!liar.fakeSeerOpportunities.some(o=>o.day===day))liar.fakeSeerOpportunities.push({
      day,allowedTargetIds:fakeSeerTargetsForDay(liar,day),forcedTarget:null,lockedTarget:false
    });
  }
}
function recordFakeSeerOpportunity(liar,day){
  ensureFakeSeerTimeline(liar);
  if(liar.fakeSeerOpportunities.some(o=>o.day===day))return;
  const forced=liar.forcedSeerTarget!=null&&byId(liar.forcedSeerTarget)?.alive?byId(liar.forcedSeerTarget):null;
  liar.fakeSeerOpportunities.push({day,allowedTargetIds:living().filter(p=>p.id!==liar.id).map(p=>p.id),
    forcedTarget:forced?.id??null,lockedTarget:liar.forcedSeerTarget!=null});
}
function fakeSeerWhiteThrough(liar){
  return (state.publicRecords.blackSeerCoRequests||[]).reduce((day,r)=>
    r.aliveIds.includes(liar.id)&&!r.respondentIds.includes(liar.id)?Math.max(day,r.day):day,0);
}
function fakeSeerMustReportWhite(liar,targetId,day){
  if(day<=fakeSeerWhiteThrough(liar))return true;
  const target=byId(targetId);
  // 本人の役職は非公開。公開確定だけを白制約に使う。
  return !!target&&isKnownVillageSeerTarget(target,getPublicConfirmations());
}
function consistentFakeSeerBlack(liar,targetId,day,proposed,previousResults=[],forceWhite=false){
  const publicPrior=(state.publicRecords?.seerResults||[]).find(r=>r.seerId===liar.id&&r.targetId===targetId);
  const prior=publicPrior||previousResults.find(r=>(r.target??r.targetId)===targetId);
  const mustWhite=forceWhite||fakeSeerMustReportWhite(liar,targetId,day);
  const playerColor=temporaryPlayerResultColor(targetId);
  if(prior){
    if(prior.black&&mustWhite||playerColor!==null&&!!prior.black!==playerColor)return null;
    return !!prior.black;
  }
  if(playerColor!==null)return mustWhite&&playerColor?null:playerColor;
  return mustWhite?false:!!proposed;
}
function createFakeSeerResult(liar,opportunity,previousResults){
  const {day,lockedTarget}=opportunity;
  const allowed=opportunity.allowedTargetIds.map(byId).filter(p=>p&&p.id!==liar.id);
  let target=allowed.find(p=>p.id===opportunity.forcedTarget)||null;
  const confirmed=getPublicConfirmations();
  const candidates=allowed.filter(p=>!isKnownVillageSeerTarget(p,confirmed));
  const autoTargetIds=candidates.map(p=>p.id);
  let plan=null,jusatsuResponse=false;
  // 呪殺対応に使えるのは公開死体だけ。狐の内部役職や死亡原因は読まない。
  const corpses=(state.publicRecords.deaths||[]).filter(d=>d.phase==="night"&&d.day===day)
    .map(d=>byId(d.playerId)).filter(p=>p&&candidates.some(c=>c.id===p.id));
  const canRespond=corpses.length>=2||day===1&&state.openingRulesVersion===1&&!state.firstVictimEnabled&&corpses.length>=1;
  if(liar.role==="wolf"){
    const request={...opportunity,forcedTarget:target?.id??null,
      jusatsuTargetIds:!target&&!lockedTarget&&canRespond?corpses.map(p=>p.id):[]};
    plan=chooseWolfFakeSeerAction(liar,previousResults,autoTargetIds,request);
    if(plan?.withheld)return null;
    if(plan?.target){
      const response=plan.plan==="corpseResponse";
      const black=consistentFakeSeerBlack(liar,plan.target.id,day,plan.black,previousResults,response);
      const result={day,target:plan.target.id,black,lockedTarget};
      if(response)result.jusatsuResponse=true;
      if(plan.strategy)result.strategy=plan.strategy;
      return result;
    }
  }
  if(["madman","fox"].includes(liar.role)){
    const request={...opportunity,forcedTarget:target?.id??null,
      jusatsuTargetIds:!target&&!lockedTarget&&canRespond?corpses.map(p=>p.id):[]};
    plan=chooseNonWolfFakeSeerAction(liar,previousResults,autoTargetIds,request);
    if(plan?.withheld)return null;
    if(plan?.target){
      const response=plan.plan==="corpseResponse";
      const black=consistentFakeSeerBlack(liar,plan.target.id,day,plan.black,previousResults,response);
      const result={day,target:plan.target.id,black,lockedTarget};
      if(response)result.jusatsuResponse=true;
      if(plan.strategy)result.strategy=plan.strategy;
      return result;
    }
  }
  if(!target&&!lockedTarget&&liar.role==="wolf"&&canRespond){
    target=randomChoice(corpses);jusatsuResponse=true;
  }
  if(!target){
    plan=chooseWolfFakeSeerAction(liar,previousResults,autoTargetIds);
    if(plan)target=plan.target;
  }
  if(!target){
    const seen=new Set(previousResults.map(r=>r.target));
    const unvisited=candidates.filter(p=>!seen.has(p.id));
    target=randomChoice(unvisited.length?unvisited:candidates);
  }
  if(!target)return null;
  const prior=previousResults.find(r=>r.target===target.id);
  const proposed=prior?prior.black:plan&&plan.target.id===target.id?plan.black:chooseFakeBlack(liar,target);
  const black=consistentFakeSeerBlack(liar,target.id,day,proposed,previousResults,jusatsuResponse);
  const result={day,target:target.id,black,lockedTarget};
  if(jusatsuResponse)result.jusatsuResponse=true;
  return result;
}
function prepareFakeSeerReports(liar){
  ensureFakeSeerTimeline(liar);
  const previous=[...liar.fakeSeerResults],pending=[];
  const publishedDays=new Set([...previous,...(liar.fakeSeerWithheldReports||[])].map(r=>r.day));
  const opportunities=[...liar.fakeSeerOpportunities].sort((a,b)=>a.day-b.day);
  for(const opportunity of opportunities){
    if(opportunity.day>state.day||publishedDays.has(opportunity.day))continue;
    const result=createFakeSeerResult(liar,opportunity,previous);
    if(result){pending.push(result);previous.push(result);publishedDays.add(result.day);}
  }
  return pending;
}

// v2.4.1: CO判断は指示時点の公開盤面をスナップショットして行う。
function hostile(p){return ["wolf","madman","fox"].includes(p.role)}
function migrateLegacyFullCoResponses(){
  // 旧版の同日内順序は復元しない。同日COや既存COは応答側として保守的に残す。
  if(!/^2\.[456]\./.test(state.version||""))return;
  const events=state.publicRecords.coEvents;
  const completeClaims=state.players.every(p=>!p.claimed||events.some(e=>
    e.playerId===p.id&&e.kind==="claim"&&e.role===p.claimed));
  if(!completeClaims)return;
  for(const request of state.publicRecords.fullCoRequests){
    if(Array.isArray(request.respondentIds)||!Array.isArray(request.aliveIds))continue;
    if(!events.some(e=>e.kind==="claim"&&e.role===request.role&&e.day<=request.day))continue;
    request.respondentIds=request.aliveIds.filter(id=>byId(id)?.claimed===request.role||
      events.some(e=>e.playerId===id&&e.kind==="claim"&&e.role===request.role&&e.day<=request.day));
    request.inferredFromPublicHistory=true;
  }
}
function wasFullRoleCoDeclined(p,role){
  return (state.publicRecords?.fullCoRequests||[]).some(r=>r.role===role&&
    Array.isArray(r.respondentIds)&&r.aliveIds.includes(p.id)&&!r.respondentIds.includes(p.id));
}
function ensureWolfSeerPlan(){
  if(state.wolfSeerPlan?.version===1)return;
  // 既に公表した騙りは保存。未COの新規担当は開始時の狼の予定から決める。
  const wolves=state.players.filter(p=>p.role==="wolf");
  const declared=wolves.filter(p=>p.claimed==="seer");
  const planned=wolves.filter(p=>p.alive&&p.fakeClaimRole==="seer"&&!p.claimed&&
    !wasFullRoleCoDeclined(p,"seer"));
  const candidates=declared.length?declared:planned;
  const candidate=candidates.length===1?candidates[0]:candidates.length?randomChoice(candidates):null;
  state.wolfSeerPlan={version:1,candidateId:candidate?.id??null};
}
function canOfferFakeRole(p,role,snap){
  if(p.claimed===role)return true; // 公表済みのCOは撤回・削除しない。
  if(wasFullRoleCoDeclined(p,role))return false;
  if(p.role==="wolf"&&role==="seer"){
    ensureWolfSeerPlan();
    return state.wolfSeerPlan.candidateId===p.id&&!p.claimed;
  }
  return true;
}
function coSnapshot(){
  return {day:state.day,aliveIds:living().map(x=>x.id),
    claims:state.players.map(p=>({id:p.id,claimed:p.claimed,villagerClaim:p.villagerClaim,alive:p.alive})),
    confirmations:new Set(getPublicConfirmations().keys()),
    broken:new Set(getPublicBreakdowns().keys()),
    results:[...(state.publicRecords?.seerResults||[])],
    counts:{...(state.publicRoleCounts||{})}};
}
function recordCOEvent(p,kind,role=null){
  ensurePublicRecords();
  if(!Array.isArray(p.coHistory))p.coHistory=[];
  const e={playerId:p.id,day:state.day,kind,role,order:nextPublicationOrder()};
  p.coHistory.push(e);
  state.publicRecords.coEvents.push(e);
}
function recordRoleClaim(p,role){
  if(p.claimed===role)return false;
  if(p.claimed&&p.claimed!==role){
    log(`${p.name} は【${roleName(p.claimed)}CO】を撤回しました。`,"claim");
    recordCOEvent(p,"withdraw",p.claimed);
  }
  if(p.villagerClaim===true){
    log(`${p.name} は【村人CO】を撤回しました。`,"claim");
    recordCOEvent(p,"withdraw","villager");
  }
  p.claimed=role;p.coCheckedNone=false;p.villagerClaim=null;
  if(hostile(p))p.fakeClaimRole=role;
  recordCOEvent(p,"claim",role);
  queueIntuitionSignal(p,role,null,true);if(!["seer","medium"].includes(role))flushIntuitionEvents(p.id);
  return true;
}
function recordVillagerClaim(p,value){
  if(p.villagerClaim===value)return;
  if(p.villagerClaim===true&&value===false)recordCOEvent(p,"withdraw","villager");
  p.villagerClaim=value;
  recordCOEvent(p,value?"claim":"deny","villager");
}
// 生存している公開占いCO者の数。真偽や仲間の正体は参照しない。
const SEER_ENTRY_CROWDING_FACTORS=[1,.85,.45,.18,.06];
function seerEntryCrowdingFactor(publicSeerCount){
  return SEER_ENTRY_CROWDING_FACTORS[Math.min(Math.max(publicSeerCount,0),4)];
}
function roleClaimProbability(p,role,snap,mode="role"){
  if(!hostile(p)||!p.alive||role==="resonator")return 0;
  const prior=snap.claims.find(x=>x.id===p.id);
  if(prior?.claimed===role)return 1;
  if(!canOfferFakeRole(p,role,snap))return 0;
  // 狼の占い担当は再抽選しない。開始時に決めた担当が応答する。
  if(p.role==="wolf"&&role==="seer")return snap.counts.seer===0?0:1;
  // 一度役職COした人外は、基本的に自分の発言を維持する。変更は切迫時のみ。
  const otherRole=!!prior?.claimed&&prior.claimed!==role;
  const otherClaimants=snap.claims.filter(x=>x.alive&&x.claimed===role&&x.id!==p.id).length;
  const gray=snap.claims.filter(x=>x.alive&&!x.claimed&&x.villagerClaim!==true);
  const confirmedOthers=snap.claims.filter(x=>x.alive&&x.id!==p.id&&snap.confirmations.has(x.id));
  const nearlyExposed=gray.length<=1 || (snap.aliveIds.length<=4&&confirmedOthers.length>=snap.aliveIds.length-2);
  const prefs={wolf:{seer:.50,medium:.31,knight:.15,cat:.22},madman:{seer:.64,medium:.43,knight:.23,cat:.26},fox:{seer:.22,medium:.13,knight:.15,cat:.18}};
  let chance=prefs[p.role]?.[role]||0;
  if(p.fakeClaimRole===role)chance+=.19;
  const usesSeerCrowding=role==="seer"&&["madman","fox"].includes(p.role);
  if(otherClaimants>0&&!usesSeerCrowding)chance+=role==="cat"?.14:.07;
  if(nearlyExposed){
    chance+=role==="cat"?.72:role==="knight"?.43:.27;
  }
  if(role==="cat"&&snap.counts.cat===0)chance=0;
  if(role==="knight"&&snap.counts.knight===0)chance=0;
  if(role==="seer"&&snap.counts.seer===0)chance=0;
  if(role==="medium"&&snap.counts.medium===0)chance=0;
  if(otherRole)chance=nearlyExposed?chance*.21:0;
  if(prior?.villagerClaim===true)chance*=nearlyExposed?.85:.3;
  if(mode==="individual")chance*=.84;
  if(usesSeerCrowding)chance*=seerEntryCrowdingFactor(otherClaimants);
  return Math.max(0,Math.min(.98,chance));
}
function chooseDynamicFakeRole(p,snap){
  const prior=snap.claims.find(x=>x.id===p.id);
  if(prior?.claimed)return prior.claimed;
  if(p.role==="wolf"&&canOfferFakeRole(p,"seer",snap)&&snap.counts.seer!==0)return "seer";
  const roles=["seer","medium","knight","cat"];
  const ranked=roles.map(role=>({role,score:roleClaimProbability(p,role,snap,"individual")* (.85+Math.random()*.3)}));
  ranked.sort((a,b)=>b.score-a.score);
  const best=ranked[0];
  return best&&Math.random()<best.score?best.role:null;
}
function publishRoleClaimResults(p,role,changed,preparedFakeSeerReports){
  if(role==="seer"){
    if(p.role==="seer")reportTrueSeer(p,changed);
    else reportFakeSeer(p,changed,preparedFakeSeerReports);
  }else if(role==="medium"){
    if(p.role==="medium")reportTrueMedium(p,changed);
    else reportFakeMedium(p,changed);
  }else if(role==="knight"){
    reportKnight(p,changed);
  }else if(role==="cat"&&changed){
    log(`${p.name} が【猫又CO】しました。`,"claim");
  }
}
function announceRole(p,role,first=true,preparedFakeSeerReports=null){
  const changed=recordRoleClaim(p,role);
  if(!changed&&!first)return;
  publishRoleClaimResults(p,role,changed,preparedFakeSeerReports);
}

// CO指示は応答・未公開結果の準備→指示記録→公表の順で進める。
function prepareRoleCoResponses(role,snap){
  const real=roleLiving(role);
  const fakes=living().filter(p=>hostile(p)&&!real.includes(p)&&
    (p.claimed===role||canOfferFakeRole(p,role,snap)&&Math.random()<roleClaimProbability(p,role,snap)));
  if(role==="medium")fakes.forEach(ensureFakeMediumResults);
  const preparedFakeReports=new Map(role==="seer"?fakes.map(p=>[p.id,prepareFakeSeerReports(p)]):[]);
  return {real,fakes,preparedFakeReports};
}
function recordFullRoleCoRequest(role,response){
  const records=state.publicRecords.fullCoRequests;
  // 最初の明示的な応答を保存し、再指示で抽選し直さない。
  if(records.some(r=>r.role===role&&Array.isArray(r.respondentIds)))return;
  const respondents=role==="resonator"?roleLiving(role):[...response.real,...response.fakes];
  records.push({role,day:state.day,aliveIds:living().map(p=>p.id),
    priorDeadIds:state.players.filter(p=>!p.alive).map(p=>p.id),
    respondentIds:respondents.map(p=>p.id),order:nextPublicationOrder()});
}
function publishResonatorCoGroup(){
  const partners=roleLiving("resonator");
  // 全員の役職宣言を記録してから、各人の相方と文章を公表する。
  partners.forEach(p=>recordRoleClaim(p,"resonator"));
  partners.forEach(p=>{
    log(`${p.name} が【共鳴者CO】しました。`,"claim");
    const others=state.players.filter(x=>x.role==="resonator"&&x.id!==p.id);
    publishedResonatorClaim(p,others.map(x=>x.id));
    if(others.length)log(`${p.name}：「相方は ${others.map(x=>x.name+(x.alive?"":"（死亡）")).join("、")} です」`,"result");
  });
}
function publishRoleCoResponses(role,{real,fakes,preparedFakeReports}){
  if(role==="resonator")publishResonatorCoGroup();
  else [...real,...fakes].forEach(p=>announceRole(p,role,true,preparedFakeReports.get(p.id)??null));
}
function completeCoInstruction(){
  commitPublicTruthProofs();save();renderAll();
}
function forceRoleCO(role){
  ensurePublicRecords();
  // 人外の応答は指示前の同じ盤面で先に確定する。
  const snap=coSnapshot();

    log(`【${roleName(role)}CO指示】CO指示を出しました。`,"system");
    completeCoInstruction();return;
  }
  publishRoleCoResponses(role,response);
  completeCoInstruction();
}

function prepareBlackSeerCoResponses(snap){
  const real=roleLiving("seer").filter(p=>p.seerResults.some(r=>r.black));
  const preparedFakeReports=new Map(),fakes=[];
  for(const p of living().filter(hostile)){
    if(!canOfferFakeRole(p,"seer",snap))continue;
    ensureFakeSeerTimeline(p);
    const alreadyBlack=p.fakeSeerResults.some(r=>r.black&&r.day<=state.day);
    if(alreadyBlack){fakes.push(p);preparedFakeReports.set(p.id,prepareFakeSeerReports(p));continue;}
    if(p.claimed!=="seer"&&Math.random()>=roleClaimProbability(p,"seer",snap))continue;
    const reports=prepareFakeSeerReports(p);
    if(reports.some(r=>r.black)){fakes.push(p);preparedFakeReports.set(p.id,reports);}
  }
  return {responders:[...real,...fakes],preparedFakeReports};
}
function recordBlackSeerCoRequest(responders){
  state.publicRecords.blackSeerCoRequests.push({day:state.day,aliveIds:living().map(p=>p.id),
    respondentIds:responders.map(p=>p.id),order:nextPublicationOrder()});
}
function blackSeerCO(){
  const snap=coSnapshot();
  const {responders,preparedFakeReports}=prepareBlackSeerCoResponses(snap);
  recordBlackSeerCoRequest(responders);
  if(!responders.length){
    log("【黒出し占い師CO】指示を出しました。","system");save();renderAll();return;
  }
  responders.forEach(p=>announceRole(p,"seer",true,preparedFakeReports.get(p.id)??null));
  completeCoInstruction();
}
function prepareBlackMediumCoResponses(){
  const real=roleLiving("medium").filter(p=>p.mediumResults.some(r=>r.black));
  const candidates=living().filter(p=>hostile(p)&&p.fakeClaimRole==="medium"&&
    (p.claimed==="medium"||!wasFullRoleCoDeclined(p,"medium")));
  candidates.forEach(ensureFakeMediumResults);
  const fakes=candidates.filter(p=>p.fakeMediumResults.some(r=>r.black));
  return {real,fakes,responders:[...real,...fakes.filter(p=>!real.includes(p))]};
}
function blackMediumCO(){
  const {real,fakes,responders}=prepareBlackMediumCoResponses();
  if(!responders.length){log("【黒出し霊媒師CO】指示を出しました。","system");save();renderAll();return}
  responders.forEach(p=>recordRoleClaim(p,"medium"));
  real.forEach(p=>reportTrueMedium(p,true));
  fakes.forEach(p=>reportFakeMedium(p,true));
  completeCoInstruction();
}

function villagerCheck(){
  makeTargetPanel("「村人ですか？」と確認する人物",living(),id=>{
    const p=byId(id);
    if(p.claimed){
      if(p.villagerClaim===true)recordVillagerClaim(p,false);

      save();renderAll();return;

    let saysVillager;
    if(p.villagerAnswerLocked){
      saysVillager=p.villagerClaim===true;
    }else{
      if(p.role==="villager")saysVillager=true;
      else if(["seer","knight","medium","resonator","cat"].includes(p.role))saysVillager=false;
      else if(p.role==="madman")saysVillager=Math.random()<.78;
      else if(p.role==="wolf")saysVillager=Math.random()<.88;
      else if(p.role==="fox")saysVillager=Math.random()<.84;
      else saysVillager=false;
      recordVillagerClaim(p,saysVillager);
      p.villagerAnswerLocked=true;
    }
    log(`【個別村人CO】${p.name}：「${saysVillager?"村人です":"村人ではありません"}」`,saysVillager?"claim":"system");

function chooseExecution(){
  makeTargetPanel("本日の処刑対象を選択",living(),id=>{
    state.pendingExecution=id;
    showExecutionConfirmation();
  });
}


function getTonightInstructionSummary(){
  const items=[];

  const hiddenSeers=roleLiving("seer").filter(p=>p.claimed!=="seer" && p.forcedSeerTarget!=null);
  if(hiddenSeers.length){
    const t=byId(hiddenSeers[0].forcedSeerTarget);
    if(t)items.push(`潜伏占い：${t.name}`);
  }

  living().filter(p=>p.claimed==="seer" && p.forcedSeerTarget!=null).forEach(p=>{
    const t=byId(p.forcedSeerTarget);
    if(t)items.push(`${p.name}の占い：${t.name}`);
  });

  const hiddenInstruction=[...(state.publicRecords?.guardInstructions||[])].reverse()
    .find(r=>r.kind==="hidden"&&r.resultDay===state.day+1);
  const hiddenKnights=roleLiving("knight").filter(p=>p.claimed!=="knight"&&p.forcedGuardTarget!=null);
  if(hiddenInstruction||hiddenKnights.length){
    const t=byId(hiddenInstruction?.targetId??hiddenKnights[0].forcedGuardTarget);
    if(t)items.push(`潜伏護衛：${t.name}`);
  }

  return items;
}

function showExecutionConfirmation(){
  const p=byId(state.pendingExecution);
  if(!p)return;

  $("#confirmTarget").textContent=`処刑対象：${p.name}`;
  const items=getTonightInstructionSummary();
  $("#confirmInstructions").innerHTML=items.length
    ? items.map(x=>`<div class="confirm-item">${escapeHtml(x)}</div>`).join("")
    : `<div class="confirm-item muted">今夜の指示はありません</div>`;

  $("#confirmSheet").classList.remove("hidden");
}

function confirmExecution(){
  const id=state.pendingExecution;
  const p=byId(id);
  if(!p||!p.alive){$("#confirmSheet").classList.add("hidden");state.pendingExecution=null;return}

  $("#confirmSheet").classList.add("hidden");
  state.pendingExecution=null;

  p.alive=false;
  state.lastExecuted=id;
  recordPublicDeath(p,state.day,"day","execution");
  pushPublicRecord("executions",{playerId:p.id,day:state.day},["playerId","day"]);
  log(`${p.name} は処刑されました。`,"death");

  // 猫又が処刑された場合、生存者からランダムで1人を道連れ
  if(p.role==="cat"){
    const candidates=living();
    const victim=randomChoice(candidates);
    if(victim){
      victim.alive=false;
      recordPublicDeath(victim,state.day,"day","cat-chain");
      pushPublicRecord("catChains",{catId:p.id,victimId:victim.id,day:state.day},["catId","day"]);
      log(`${victim.name} は猫又の道連れになりました。`,"death");
    }
  }

  const w=checkWin(); if(w){finish(w);return}
  state.phase="night";
  log("夜になりました。","system");
  save();renderAll();
}

function cancelExecution(){
  $("#confirmSheet").classList.add("hidden");
  state.pendingExecution=null;
  renderAll();
}

// 狼騙り占い：公開材料から合法な対象×判定を列挙してから戦略を比較する。
const WOLF_FAKE_SEER_WEIGHTS={whiteBase:6,blackBase:3,whiteTrust:5,induce:14,
  publicPressure:6,retaliation:8,blackThreat:0.10,whiteThreat:0.06,cover:10,
  sacrificeCredit:12,sacrificePressure:8,allyLoss:12,lastAlliesLoss:24,
  reverse:6,lineMatch:4,lineConflict:4,attackBlack:5,attackWhite:2,
  repeat:5,corpseResponse:8,window:8,temperature:4};
function wolfFakeSeerContext(liar){
  const context=roleTrustPublicContext();
  const publicRoles=computeObserverRoleTrust(null,context,true);
  const publicPeople=computePublicPersonTrust(context,publicRoles);
  const knownWolves=new Set([liar.id,...buildPrivateInfo(liar).knownWolfAllies]);
  const personalRoles=computeObserverRoleTrust(liar,context);
  const threat=computeWolfThreat(liar,context,publicRoles,personalRoles);
  // 噛みの評価だけを使う。実襲撃先の抽選・護衛解決・未来の死亡は参照しない。
  const attack=buildWolfAttackEvaluation();
  const own=publicRoles.roles.seer[liar.id];
  const selfCredit=context.broken.has(liar.id)?0:clamp((own?.score??50)/100,0,1);
  const mediumOpportunity=Math.max(0,...context.people.filter(p=>p.alive&&p.claimed==="medium"&&
    !context.broken.has(p.id)).map(p=>publicRoles.roles.medium[p.id]?.status==="true"?1:0.4));
  return {context,publicRoles,publicPeople,knownWolves,threat,attack,selfCredit,mediumOpportunity,
    livingWolfCount:context.people.filter(p=>p.alive&&knownWolves.has(p.id)).length};
}
function fakeSeerAllowedColors(liar,targetId,day,previousResults,forceWhite=false,context=null){
  const c=context||roleTrustPublicContext();
  const own=[...(state.publicRecords?.seerResults||[]).filter(r=>r.seerId===liar.id)
    .map(r=>({target:r.targetId,black:r.black})),...previousResults];
  const required=[];
  const playerColor=temporaryPlayerResultColor(targetId);
  if(playerColor!==null)required.push(playerColor);
  // 過去の自分の判定は公表済み・同時準備中とも保持。矛盾済みなら新判定で隠さない。
  own.filter(r=>(r.target??r.targetId)===targetId).forEach(r=>required.push(!!r.black));
  if(forceWhite||day<=fakeSeerWhiteThrough(liar)||c.knownVillageIds.has(targetId))required.push(false);
  const confirmedResult=row=>{
    const id=row.record.seerId??row.record.mediumId;
    const role=row.record.seerId!=null?"seer":"medium";
    return c.confirmed.has(id)&&!c.broken.has(id)&&publiclyKnownRoleFor(id,c.confirmed)===role;
  };
  for(const row of [...c.seerRows,...c.mediumRows]){
    if(row.record.targetId===targetId&&confirmedResult(row))required.push(!!row.record.black);
  }
  const distinct=[...new Set(required)];
  if(distinct.length>1)return [];
  let colors=distinct.length?distinct:[false,true];
  const wolfCount=c.counts.wolf;
  if(Number.isInteger(wolfCount)&&wolfCount>=0){
    const blackTargets=new Set(own.filter(r=>r.black).map(r=>r.target??r.targetId));
    for(const row of [...c.seerRows,...c.mediumRows])
      if(row.record.black&&confirmedResult(row))blackTargets.add(row.record.targetId);
    // 既存黒自体を直さず、配役を超える新しい黒だけを禁止。
    if(!blackTargets.has(targetId)&&blackTargets.size>=wolfCount)colors=colors.filter(x=>!x);
  }
  return colors;
}
// 既存狼APIは共通の合法性判定へ委譲。
function wolfFakeSeerColors(...args){return fakeSeerAllowedColors(...args);}
function fakeSeerLineScore(liar,targetId,black,model){
  const latest=new Map();
  for(const row of [...model.context.seerRows,...model.context.mediumRows]){
    const id=row.record.seerId??row.record.mediumId;
    if(id===liar.id||row.record.targetId!==targetId||model.context.broken.has(id))continue;
    const role=row.record.seerId!=null?"seer":"medium";
    if(!model.publicRoles.roles[role][id])continue;
    const key=role+":"+id,old=latest.get(key);
    if(!old||row.record.day>old.record.day||row.record.day===old.record.day&&
      (row.record.order??row.source.index)>=(old.record.order??old.source.index))latest.set(key,row);
  }
  const evidence=[];
  for(const row of latest.values()){
    const id=row.record.seerId??row.record.mediumId,role=row.record.seerId!=null?"seer":"medium";
    const knownAlly=model.knownWolves?.has(id)===true;
    const strength=model.lineStrengthFor?model.lineStrengthFor(id,role):
      knownAlly?0.7:Math.max(0.2,publicRoleTrustStrength(model.publicRoles.roles[role][id]));
    const connect=!!row.record.black===black;
    const delta=connect?WOLF_FAKE_SEER_WEIGHTS.lineMatch*strength:
      -WOLF_FAKE_SEER_WEIGHTS.lineConflict*strength*model.selfCredit;
    evidence.push({type:connect?"connectLine":"cutLine",actorId:id,role,knownAlly,
      day:row.record.day,order:row.record.order??null,delta});
  }
  // CO人数で同じ根拠を膨らませない。最も影響する1本だけを点数へ反映。
  const strongest=[...evidence].sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta))[0];
  return {score:strongest?.delta||0,evidence};
}
function wolfFakeSeerLineScore(...args){return fakeSeerLineScore(...args);}
function fakeSeerCandidatePool(liar,results,allowedTargetIds,opportunity,context){
  const day=opportunity?.day??state.day;
  const allowed=new Set(opportunity?.allowedTargetIds??allowedTargetIds??living().map(p=>p.id));
  const forced=opportunity?.forcedTarget;
  const explicit=forced!=null&&forced!==liar.id&&allowed.has(forced)&&byId(forced);
  const corpseIds=new Set(opportunity?.jusatsuTargetIds||[]);
  let targets=context.people.filter(p=>p.id!==liar.id&&allowed.has(p.id)&&
    !(state.publicRecords?.deaths||[]).some(d=>d.playerId===p.id&&d.day<day));
  if(explicit)targets=targets.filter(p=>p.id===forced);
  else targets=targets.filter(p=>(!allowedTargetIds||allowedTargetIds.includes(p.id))&&!context.knownVillageIds.has(p.id)&&
    (p.alive||day<state.day||corpseIds.has(p.id))&&(!corpseIds.size||corpseIds.has(p.id)));
  const own=[...results,...(state.publicRecords?.seerResults||[]).filter(r=>r.seerId===liar.id)
    .map(r=>({target:r.targetId,black:r.black}))];
  if(!explicit&&!corpseIds.size)targets=preferredSeerTargets(liar,targets,own,context.confirmed);
  return {day,explicit,corpseIds,targets,own,seen:new Set(own.map(r=>r.target??r.targetId))};
}
function buildWolfFakeSeerEvaluation(liar,results=liar.fakeSeerResults||[],allowedTargetIds=null,opportunity=null){
  if(liar.role!=="wolf")return null;
  const model=wolfFakeSeerContext(liar);
  const {day,explicit,corpseIds,targets,own,seen}=fakeSeerCandidatePool(liar,results,allowedTargetIds,opportunity,model.context);
  const attackScores=model.attack.candidates.map(x=>x.score);
  const low=Math.min(...attackScores),high=Math.max(...attackScores);
  const candidates=[];
  for(const target of targets){
    const ally=model.knownWolves.has(target.id);
    const roleEntry=model.publicRoles.roles[target.claimed]?.[target.id];
    const personEntry=model.publicPeople.people[target.id];
    const trust=model.context.knownVillageIds.has(target.id)?1:model.context.broken.has(target.id)?0:
      clamp((roleEntry?.score??personEntry?.score??50)/100,0,1);
    const entry=model.attack.candidates.find(x=>x.targetId===target.id);
    const attackPreference=entry?(high>low?(entry.score-low)/(high-low):0.5):0;
    const pressure=entry?.execution.score??wolfAttackExecutionRisk(target,
      {context:model.context,publicRoles:model.publicRoles}).score;
    const threat=model.threat.people[target.id]?.score||0;
    const response=corpseIds.has(target.id)&&!explicit;
    for(const black of wolfFakeSeerColors(liar,target.id,day,own,response,model.context)){
      const evidence=[];
      const add=(type,delta)=>{if(delta)evidence.push({type,delta});};
      let plan=black?"induce":"credit";
      add("base",black?WOLF_FAKE_SEER_WEIGHTS.blackBase:WOLF_FAKE_SEER_WEIGHTS.whiteBase);
      if(black){
        if(ally){
          plan=target.alive?(model.selfCredit<0.45?"reverse":"sacrifice"):"knownWolfLine";
          const loss=target.alive?(model.livingWolfCount<=2?WOLF_FAKE_SEER_WEIGHTS.lastAlliesLoss:
            WOLF_FAKE_SEER_WEIGHTS.allyLoss):0;
          add("allyLoss",-loss);
          add("mediumCredit",WOLF_FAKE_SEER_WEIGHTS.sacrificeCredit*model.selfCredit*model.mediumOpportunity);
          add("alreadyThreatenedAlly",WOLF_FAKE_SEER_WEIGHTS.sacrificePressure*pressure);
          if(day>=3&&model.livingWolfCount>=3&&model.selfCredit<0.45)
            add("reverseCover",WOLF_FAKE_SEER_WEIGHTS.reverse*(1-model.selfCredit)*pressure);
        }else{
          add("executionInducement",WOLF_FAKE_SEER_WEIGHTS.induce*model.selfCredit*(1-trust));
          add("publicPressure",WOLF_FAKE_SEER_WEIGHTS.publicPressure*pressure);
          add("threatRemoval",WOLF_FAKE_SEER_WEIGHTS.blackThreat*threat);
          add("retaliationRisk",-WOLF_FAKE_SEER_WEIGHTS.retaliation*trust*(1-model.selfCredit));
          add("preferAttackInstead",-WOLF_FAKE_SEER_WEIGHTS.attackBlack*attackPreference);
        }
      }else{
        add("publicTrustAlignment",WOLF_FAKE_SEER_WEIGHTS.whiteTrust*trust);
        if(ally){plan="cover";add("allyProtection",WOLF_FAKE_SEER_WEIGHTS.cover*
          (0.4+0.6*model.selfCredit)*(1-pressure));}
        else{
          add("preservedThreat",-WOLF_FAKE_SEER_WEIGHTS.whiteThreat*threat);
          add("attackOverlap",-WOLF_FAKE_SEER_WEIGHTS.attackWhite*attackPreference);
        }
      }
      const line=wolfFakeSeerLineScore(liar,target.id,black,model);add("publicLine",line.score);
      if(seen.has(target.id))add("repeatTarget",-WOLF_FAKE_SEER_WEIGHTS.repeat);
      if(response){plan="corpseResponse";add("corpseResponse",WOLF_FAKE_SEER_WEIGHTS.corpseResponse);}
      candidates.push({targetId:target.id,black,plan,knownAlly:ally,publicTrust:trust,
        selfCredit:model.selfCredit,threat,executionPressure:pressure,attackPreference,
        line,evidence,score:Math.round(evidence.reduce((sum,e)=>sum+e.delta,0)*100)/100});
    }
  }
  // 合法な未占い先があれば先に使う。全員占い済みなら同じ判定で再占いできる。
  const unvisited=candidates.filter(x=>!seen.has(x.targetId));
  return {schemaVersion:1,basis:"wolfFakeSeer",visibility:"private",decisionDay:state.day,
    updatedOrder:state.publicRecords?.publishClock||0,resultDay:day,explicitTarget:!!explicit,
    candidates:explicit||!unvisited.length?candidates:unvisited};
}
function selectFakeSeerEvaluation(evaluation,weights){
  if(!evaluation)return null;
  if(!evaluation.candidates.length)return {target:null,withheld:true};
  const best=Math.max(...evaluation.candidates.map(x=>x.score));
  const close=evaluation.candidates.filter(x=>best-x.score<=weights.window);
  const weighted=close.map(x=>({candidate:x,weight:Math.exp((x.score-best)/weights.temperature)}));
  let draw=Math.random()*weighted.reduce((sum,x)=>sum+x.weight,0);
  let chosen=weighted[weighted.length-1].candidate;
  for(const x of weighted){draw-=x.weight;if(draw<=0){chosen=x.candidate;break;}}
  const strategy={schemaVersion:evaluation.schemaVersion,basis:evaluation.basis,visibility:"private",
    decisionDay:evaluation.decisionDay,updatedOrder:evaluation.updatedOrder,resultDay:evaluation.resultDay,
    explicitTarget:evaluation.explicitTarget,selected:JSON.parse(JSON.stringify(chosen))};
  return {target:byId(chosen.targetId),black:chosen.black,plan:chosen.plan,strategy};
}
function chooseWolfFakeSeerAction(liar,results=liar.fakeSeerResults||[],allowedTargetIds=null,opportunity=null){
  return selectFakeSeerEvaluation(buildWolfFakeSeerEvaluation(liar,results,allowedTargetIds,opportunity),WOLF_FAKE_SEER_WEIGHTS);
}

const NONWOLF_FAKE_SEER_WEIGHTS={repeat:5,corpseResponse:8,window:8,temperature:4};
const MADMAN_FAKE_SEER_WEIGHTS={whiteBase:6,blackBase:4,whiteTrust:3,protect:8,
  induce:12,publicPressure:8,misfire:6,retaliation:8};
// 狂人/狐の評価は公開盤面だけ。狼の個人情報/噛み評価は渡さない。
function publicFakeSeerContext(liar){
  const context=roleTrustPublicContext();
  const publicRoles=computeObserverRoleTrust(null,context,true);
  const publicPeople=computePublicPersonTrust(context,publicRoles);
  const own=publicRoles.roles.seer[liar.id];
  const selfCredit=context.broken.has(liar.id)?0:clamp((own?.score??50)/100,0,1);
  const mediumOpportunity=Math.max(0,...context.people.filter(p=>p.alive&&p.claimed==="medium"&&
    !context.broken.has(p.id)).map(p=>publicRoles.roles.medium[p.id]?.status==="true"?1:0.4));
  return {context,publicRoles,publicPeople,selfCredit,mediumOpportunity};
}
function publicFakeSeerAssessment(model,target){
  const {context,publicRoles,publicPeople}=model;
  const roleEntry=publicRoles.roles[target.claimed]?.[target.id];
  const personEntry=publicPeople.people[target.id];
  const trust=context.knownVillageIds.has(target.id)?1:context.broken.has(target.id)?0:
    clamp((roleEntry?.score??personEntry?.score??50)/100,0,1);
  const verdicts=[];
  if(context.knownVillageIds.has(target.id))verdicts.push(false);
  for(const row of [...context.seerRows,...context.mediumRows]){
    const r=row.record,id=r.seerId??r.mediumId,role=r.seerId!=null?"seer":"medium";
    if(r.targetId===target.id&&context.confirmed.has(id)&&!context.broken.has(id)&&
      publiclyKnownRoleFor(id,context.confirmed)===role)verdicts.push(!!r.black);
  }
  const distinct=[...new Set(verdicts)];
  let wolfLikelihood=0.5,status="suspected",certaintyScope=null,confidence=0;
  if(distinct.length===1){
    wolfLikelihood=distinct[0]?1:0;status=distinct[0]?"wolf":"nonWolf";certaintyScope="public";confidence=100;
  }else if(distinct.length>1){status="conflict";}
  else{
    // 信用の低さを狼確定にしない。白は非狼であり、村陣営確定とは限らない。
    const material=clamp((personEntry?.confidence??roleEntry?.confidence??0)/100,0,1);
    wolfLikelihood=clamp(0.5+(personEntry?(50-personEntry.score)/100*material:
      roleEntry?(0.5-roleEntry.score/100)*0.20*material:0),0.15,0.85);
    confidence=personEntry?.confidence??roleEntry?.confidence??0;
  }
  const executionPressure=wolfAttackExecutionRisk(target,{context,publicRoles}).score;
  return {publicTrust:trust,wolfLikelihood,wolfStatus:status,certaintyScope,confidence,executionPressure};
}
function scoreMadmanFakeSeerCandidate(black,assessment,model){
  const w=MADMAN_FAKE_SEER_WEIGHTS,S=model.selfCredit,P=assessment.publicTrust,
    L=assessment.wolfLikelihood,E=assessment.executionPressure;
  const evidence=[];const add=(type,delta)=>{if(delta)evidence.push({type,delta});};
  add("base",black?w.blackBase:w.whiteBase);
  if(black){
    add("villageInducement",w.induce*S*(1-L));
    add("publicPressure",w.publicPressure*E);
    add("suspectedWolfMisfire",-w.misfire*S*L);
    add("retaliationRisk",-w.retaliation*P*(1-S));
  }else{
    add("publicTrustAlignment",w.whiteTrust*P);
    add("suspectedWolfProtection",w.protect*S*L);
  }
  return {plan:black?"induce":"protectOrCredit",evidence};
}
const FOX_FAKE_SEER_WEIGHTS={whiteBase:7,blackBase:3,whiteTrust:7,avoidConflict:5,
  induce:14,diversion:8,threatResponse:10,retaliation:10,whiteThreat:3,mediumExposure:6};
function publicFoxTargetThreat(liar,target,model){
  if(model.context.broken.has(target.id))return 0;
  const role=target.claimed,entry=model.publicRoles.roles[role]?.[target.id];
  let threat=role==="seer"?Math.max(0.25,publicRoleTrustStrength(entry)):
    role==="medium"?0.35*Math.max(0.25,publicRoleTrustStrength(entry)):0;
  const rows=model.context.seerRows.filter(x=>x.record.seerId===target.id&&x.record.targetId===liar.id);
  const latest=rows.reduce((a,b)=>!a||b.record.day>a.record.day||b.record.day===a.record.day&&
    (b.record.order??b.source.index)>=(a.record.order??a.source.index)?b:a,null);
  // 自分への公開黒を出す相手は、真偽とは別に処刑の脅威。未知の占い先は予知しない。
  if(latest?.record.black)threat=Math.max(threat,0.5+0.5*publicRoleTrustStrength(entry));
  return threat;
}
function scoreFoxFakeSeerCandidate(black,assessment,model,targetThreat,targetAlive){
  const w=FOX_FAKE_SEER_WEIGHTS,S=model.selfCredit,P=assessment.publicTrust,
    L=assessment.wolfLikelihood,E=assessment.executionPressure;
  const evidence=[];const add=(type,delta)=>{if(delta)evidence.push({type,delta});};
  add("base",black?w.blackBase:w.whiteBase);
  if(black){
    add("executionInducement",w.induce*S*(1-P));
    add("selfDefenseDiversion",w.diversion*model.selfPressure*(0.5+E));
    add("publicThreatResponse",w.threatResponse*S*targetThreat);
    add("retaliationRisk",-w.retaliation*P*(1-S));
  }else{
    add("publicTrustAlignment",w.whiteTrust*P);
    add("avoidConflict",w.avoidConflict*(1-S)*P);
    add("preservedPublicThreat",-w.whiteThreat*targetThreat);
  }
  // 将来の霊媒判定は不明。公開推測から逆判定の期待危険だけ見積もる。
  if(targetAlive)add("mediumExposureRisk",-w.mediumExposure*model.mediumOpportunity*(black?1-L:L));
  return {plan:black?"divertOrChallenge":"creditAndSurvive",evidence};
}
function buildPublicFakeSeerEvaluation(liar,results=liar.fakeSeerResults||[],allowedTargetIds=null,opportunity=null){
  if(!["madman","fox"].includes(liar.role))return null;
  const model=publicFakeSeerContext(liar);
  if(liar.role==="fox")model.selfPressure=wolfAttackExecutionRisk(
    model.context.people.find(p=>p.id===liar.id),model).score;
  const {day,explicit,corpseIds,targets,own,seen}=fakeSeerCandidatePool(liar,results,allowedTargetIds,opportunity,model.context);
  if(liar.role==="madman")model.lineStrengthFor=(id)=>{
    const actor=model.context.people.find(p=>p.id===id);
    return 0.2+0.6*publicFakeSeerAssessment(model,actor).wolfLikelihood;
  };
  const candidates=[];
  for(const target of targets){
    const assessment=publicFakeSeerAssessment(model,target),response=corpseIds.has(target.id)&&!explicit;
    for(const black of fakeSeerAllowedColors(liar,target.id,day,own,response,model.context)){
      const publicThreat=liar.role==="fox"?publicFoxTargetThreat(liar,target,model):0;
      const score=liar.role==="madman"?scoreMadmanFakeSeerCandidate(black,assessment,model):
        scoreFoxFakeSeerCandidate(black,assessment,model,publicThreat,target.alive);
      const line=fakeSeerLineScore(liar,target.id,black,model);
      if(line.score)score.evidence.push({type:"publicLine",delta:line.score});
      if(seen.has(target.id))score.evidence.push({type:"repeatTarget",delta:-NONWOLF_FAKE_SEER_WEIGHTS.repeat});
      if(response){score.plan="corpseResponse";score.evidence.push({type:"corpseResponse",delta:NONWOLF_FAKE_SEER_WEIGHTS.corpseResponse});}
      candidates.push({targetId:target.id,black,plan:score.plan,selfCredit:model.selfCredit,
        ...assessment,...(liar.role==="fox"?{selfPressure:model.selfPressure,publicThreat}:{}),line,evidence:score.evidence,
        score:Math.round(score.evidence.reduce((sum,e)=>sum+e.delta,0)*100)/100});
    }
  }
  const unvisited=candidates.filter(x=>!seen.has(x.targetId));
  return {schemaVersion:1,basis:liar.role+"FakeSeer",visibility:"private",decisionDay:state.day,

// 偽霊媒の意思決定。非公開情報は本人の役職と狼本人が知る仲間IDだけ。
function buildFakeMediumContext(liar,executed){

  const breakdowns=getPublicBreakdowns();
  const ownResults=[...(liar.fakeMediumResults||[]),
    ...publicInfo.mediumResults.filter(r=>r.mediumId===liar.id).map(r=>({target:r.targetId,black:r.black}))];
  const latestBySeer=new Map();
  for(const result of publicInfo.seerResults){
    if(result.targetId!==executed.id)continue;
    const previous=latestBySeer.get(result.seerId);
    if(!previous||result.day>previous.day||result.day===previous.day&&result.order>previous.order)
      latestBySeer.set(result.seerId,result);
  }
  const lines=[...latestBySeer.values()].map(result=>{
    const seer=publicInfo.players.find(p=>p.id===result.seerId);
    return {seer,result,knownAlly:privateInfo.knownWolfAllies.includes(result.seerId),
      credibility:publicSeerCredibility(publicInfo,result.seerId).score};

function fakeMediumPublicConstraint(context){
  const {ownResults,targetId,lines,confirmations,publicInfo}=context;
  // 自分の既存結果は書き換えない。同じ対象に逆の判定を足さない。
  const previous=ownResults.find(r=>r.target===targetId);
  if(previous)return {black:previous.black,plan:"keepOwnResult",partnerId:null};
  const required=[];
  for(const line of lines)if(confirmations.has(line.seer.id))required.push(!!line.result.black);
  const target=publicInfo.players.find(p=>p.id===targetId);
  if(target&&confirmations.has(targetId)&&target.claimed&&target.claimed!=="wolf")required.push(false);
  const wolfCount=state.publicRoleCounts?.wolf;
  const blackTargets=new Set(ownResults.filter(r=>r.black).map(r=>r.target));
  if(Number.isInteger(wolfCount)&&blackTargets.size>=wolfCount)required.push(false);
  const values=[...new Set(required)];
  if(values.length===1)return {black:values[0],plan:"publicConstraint",partnerId:null};

}

    b.credibility-a.credibility||a.seer.id-b.seer.id)[0]||null;
}
function chooseBaseFakeMediumBlack(liar,executed,privateInfo){
  if(privateInfo.selfRole==="wolf"){
    if(privateInfo.knownWolfAllies.includes(executed.id))return false;
    return Math.random()<0.28;

function chooseFakeMediumDecision(liar,executed){
  const playerColor=temporaryPlayerResultColor(executed.id);
  if(playerColor!==null)return {black:playerColor,plan:"temporaryPlayerResult",partnerId:null};
  const context=buildFakeMediumContext(liar,executed);
  const constraint=fakeMediumPublicConstraint(context);
  if(constraint)return constraint;
  const partner=chooseFakeMediumPartner(context);
  if(partner){

    const base=partner.knownAlly?0.78:context.privateInfo.selfRole==="madman"?0.55:
      context.privateInfo.selfRole==="wolf"?0.45:0.35;

    return {black:connect?!!partner.result.black:!partner.result.black,

// プレイヤーも他の参加者と同じ公開基準。内部roleは判定に読まない。
