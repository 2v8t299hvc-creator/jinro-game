<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>個人用人狼アプリ v0.4</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a22; --panel2:#202532; --text:#f5f7fb; --muted:#9ca6b7;
  --accent:#7c9cff; --danger:#ff6b6b; --line:#2b3140; --warn:#ffd166; --ok:#5fd3a2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button,input{font:inherit}
button{border:0;border-radius:11px;padding:10px 12px;background:var(--accent);color:white;font-weight:700}
button.secondary{background:var(--panel2)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.45}
.wrap{max-width:980px;margin:auto;padding:14px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.grid{display:grid;gap:8px}
.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){.cols2,.cols3{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role-row{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.role-row:last-child{border-bottom:0}
input[type=number],input[type=text]{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0d1016;color:var(--text)}
.status{display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:5px 8px;border-radius:999px;background:var(--panel2);font-size:12px}
.hidden{display:none!important}
.notice{padding:9px 10px;border-radius:11px;background:#111827;border:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* compact player UI */
.claim-board{display:grid;gap:7px}
.claim-card{background:#11151d;border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.claim-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.claim-name{font-weight:800}
.claim-role{color:var(--warn);font-size:12px}
.claim-results{margin-top:5px;font-size:12px;line-height:1.45;color:#dbe3f2}
.player-list{display:grid;gap:5px}
.player-row{display:grid;grid-template-columns:minmax(90px,1.1fr) .8fr .7fr;gap:8px;align-items:center;padding:7px 9px;background:var(--panel2);border-radius:10px;border:1px solid var(--line);font-size:13px}
.player-row.dead{opacity:.48}
.player-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-co{color:var(--warn);white-space:nowrap}
.player-life{color:var(--muted);text-align:right}
@media(max-width:520px){
 .player-row{grid-template-columns:minmax(88px,1.2fr) .9fr .55fr;font-size:12px;padding:6px 8px}
}

.log{height:300px;overflow:auto;background:#0d1016;border-radius:11px;padding:10px;border:1px solid var(--line)}
.log p{margin:0 0 8px;line-height:1.45;font-size:13px}
.log .system{color:#c7d2fe}
.log .death{color:#ff9a9a}
.log .result{color:#a7f3d0}
.log .claim{color:#ffd166}
.target-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-top:9px}
.target-list button{background:var(--panel2);border:1px solid var(--line)}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>個人用人狼アプリ <span class="muted">v0.4</span></h1>
  <div class="muted">完全指示制CO / 個別CO / 村人確認 / 重複占い防止 / コンパクトUI</div>

  <section id="setupScreen">
    <div class="card">
      <h2>ゲーム設定</h2>
      <div class="grid cols2">
        <label>参加人数<input id="playerCount" type="number" min="5" max="20" value="9"></label>
        <label>自分の名前<input id="selfName" type="text" value="あなた" maxlength="12"></label>
      </div>
      <hr>
      <h2>配役</h2>
      <div id="roleConfig"></div>
      <div class="notice" id="sumNotice"></div>
      <div class="row" style="margin-top:12px">
        <button id="startBtn">ゲーム開始</button>
        <button class="secondary" id="loadBtn">保存データを再開</button>
      </div>
    </div>
  </section>

  <section id="gameScreen" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <h2 id="phaseTitle">1日目・昼</h2>
          <div class="status" id="statusBadges"></div>
        </div>
        <div class="row">
          <button class="ghost" id="debugBtn">デバッグ</button>
          <button class="danger" id="resetBtn">終了</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>CO中の人物</h2>
      <div id="claimBoard" class="claim-board"></div>
    </div>

    <div class="grid cols2">
      <div class="card">
        <h2>全プレイヤー</h2>
        <div id="players" class="player-list"></div>
      </div>
      <div class="card">
        <h2>公開ログ</h2>
        <div id="log" class="log"></div>
      </div>
    </div>

    <div class="card">
      <h2>指示</h2>
      <div class="grid cols3">
        <button id="blackSeerBtn">黒出し占い師CO</button>
        <button id="blackMediumBtn">黒出し霊媒師CO</button>
        <button id="roleCoBtn">役職CO</button>
        <button id="individualCoBtn">個別CO確認</button>
        <button id="villagerCheckBtn">個別村人CO</button>
        <button id="hiddenSeerBtn" class="secondary">潜伏占い指示</button>
        <button id="hiddenGuardBtn" class="secondary">潜伏護衛指示</button>
        <button id="publicSeerBtn" class="secondary">CO済占い師へ個別指示</button>
      </div>
      <div id="actionPanel" class="hidden" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>進行</h2>
      <div class="row">
        <button id="executeBtn">処刑対象を選ぶ</button>
        <button id="nightBtn" class="secondary" disabled>夜を解決する</button>
      </div>
      <div class="muted" style="margin-top:7px">v0.4では投票AIはまだ未実装。処刑対象は自分で選択します。</div>
    </div>

    <div id="debugPanel" class="card hidden">
      <h2>デバッグ情報</h2>
      <div id="debugText" class="muted"></div>
    </div>
  </section>

  <div class="footer">端末内保存。サーバー通信なし。</div>
</div>

<script>
const ROLES=[
  ["villager","村人"],["seer","占い師"],["knight","騎士"],["medium","霊媒師"],
  ["madman","狂人"],["wolf","人狼"],["fox","妖狐"]
];
const TEAM={villager:"村人陣営",seer:"村人陣営",knight:"村人陣営",medium:"村人陣営",madman:"人狼陣営",wolf:"人狼陣営",fox:"妖狐陣営"};
let state=null;
const $=s=>document.querySelector(s);
const roleName=r=>ROLES.find(x=>x[0]===r)?.[1]??r;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const randomChoice=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function defaultCounts(n){
  const b={villager:3,seer:1,knight:1,medium:1,madman:1,wolf:2,fox:0};
  if(n<9){
    b.villager=Math.max(1,n-4); b.medium=n>=7?1:0; b.madman=n>=6?1:0;
    b.knight=n>=6?1:0; b.wolf=n>=7?2:1; b.seer=1;
  }else if(n>9){b.villager+=n-9}
  return b;
}
function renderRoleConfig(){
  const n=clamp(+$("#playerCount").value,5,20),saved={};
  document.querySelectorAll("[data-role-count]").forEach(e=>saved[e.dataset.roleCount]=+e.value||0);
  const c=Object.keys(saved).length?saved:defaultCounts(n);
  $("#roleConfig").innerHTML=ROLES.map(([k,nm])=>`
    <div class="role-row">
      <div><b>${nm}</b><div class="muted">${TEAM[k]}</div></div>
      <input type="number" min="0" max="20" value="${c[k]??0}" data-role-count="${k}">
    </div>`).join("");
  document.querySelectorAll("[data-role-count]").forEach(e=>e.addEventListener("input",updateSum));
  updateSum();
}
function getRoleCounts(){const o={};document.querySelectorAll("[data-role-count]").forEach(e=>o[e.dataset.roleCount]=Math.max(0,+e.value||0));return o}
function updateSum(){
  const n=+$("#playerCount").value,c=getRoleCounts(),sum=Object.values(c).reduce((a,b)=>a+b,0);
  const ok=sum===n&&c.villager>=1&&c.wolf>=1;
  $("#sumNotice").innerHTML=`配役合計 <b>${sum}</b> / ${n}人　${ok?"✅ 開始できます":"⚠️ 合計人数を合わせ、村人1人以上・人狼1人以上にしてください"}`;
  $("#startBtn").disabled=!ok;
}

function newPlayer(id,name,role,isSelf=false){
  return {
    id,name,role,alive:true,isSelf,claimed:null,
    seerResults:[],mediumResults:[],fakeSeerResults:[],fakeMediumResults:[],
    forcedSeerTarget:null,forcedGuardTarget:null,fakeClaimRole:null,
    lastReportedSeerCount:0,lastReportedMediumCount:0,
    villagerClaim:null
  };
}

function startGame(){
  const n=clamp(+$("#playerCount").value,5,20),c=getRoleCounts();
  if(Object.values(c).reduce((a,b)=>a+b,0)!==n||c.villager<1||c.wolf<1)return;

  const roles=[],assign={...c,villager:c.villager-1};
  for(const[r]of ROLES)for(let i=0;i<assign[r];i++)roles.push(r);
  shuffle(roles);

  const names=["アキ","ユウ","ハル","レン","ミオ","ナギ","ソラ","リク","カイ","ヒナ","レイ","シン","アオ","トワ","マコ","ユキ","セナ","リン","ケイ"];
  const ps=[newPlayer(0,$("#selfName").value.trim()||"あなた","villager",true)];
  for(let i=1;i<n;i++)ps.push(newPlayer(i,names[i-1]??`P${i+1}`,roles[i-1],false));

  state={version:"0.4",day:1,phase:"day",players:ps,logs:[],winner:null,lastExecuted:null};

  // 初日占い
  roleLiving("seer").forEach(s=>{
    const target=randomChoice(state.players.filter(p=>p.id!==s.id));
    if(target)s.seerResults.push({day:1,target:target.id,black:target.role==="wolf"});
  });

  assignFakeClaims();
  log(`ゲーム開始。参加者は${n}人。あなたの役職は【村人】です。`,"system");
  save();showGame();
}

function assignFakeClaims(){
  state.players.filter(p=>p.role==="madman").forEach(m=>{
    const r=Math.random(); m.fakeClaimRole=r<0.62?"seer":r<0.82?"medium":null;
  });
  const wolves=state.players.filter(p=>p.role==="wolf");
  if(wolves.length&&Math.random()<0.65){
    const liar=randomChoice(wolves); liar.fakeClaimRole=Math.random()<0.72?"seer":"medium";
  }
  state.players.filter(p=>p.role==="fox").forEach(f=>{
    const r=Math.random(); f.fakeClaimRole=r<0.18?"seer":r<0.27?"medium":null;
  });
}

function living(){return state.players.filter(p=>p.alive)}
function byId(id){return state.players.find(p=>p.id===+id)}
function roleLiving(r){return living().filter(p=>p.role===r)}
function publicClaim(p){return p.claimed?roleName(p.claimed):"未CO"}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function log(msg,cls=""){state.logs.push({msg,cls});renderLog()}
function renderLog(){
  if(!state)return;
  $("#log").innerHTML=state.logs.map(x=>`<p class="${x.cls}">${escapeHtml(x.msg)}</p>`).join("");
  $("#log").scrollTop=$("#log").scrollHeight;
}
function showGame(){$("#setupScreen").classList.add("hidden");$("#gameScreen").classList.remove("hidden");renderAll()}
function showSetup(){$("#gameScreen").classList.add("hidden");$("#setupScreen").classList.remove("hidden")}

function resultHistory(p){
  if(p.claimed==="seer"){
    const arr=p.role==="seer"?p.seerResults:(p.fakeClaimRole==="seer"?p.fakeSeerResults:[]);
    return arr.map(r=>`${r.day}日 ${byId(r.target)?.name??"不明"}${r.black?"●":"○"}`).join(" / ");
  }
  if(p.claimed==="medium"){
    const arr=p.role==="medium"?p.mediumResults:(p.fakeClaimRole==="medium"?p.fakeMediumResults:[]);
    return arr.map(r=>`${r.day}日 ${byId(r.target)?.name??"不明"}${r.black?"●":"○"}`).join(" / ");
  }
  return "";
}

function renderClaimBoard(){
  const claimants=state.players.filter(p=>p.claimed);
  if(!claimants.length){
    $("#claimBoard").innerHTML=`<div class="muted">まだCO者はいません。</div>`;
    return;
  }
  $("#claimBoard").innerHTML=claimants.map(p=>`
    <div class="claim-card">
      <div class="claim-head">
        <div class="claim-name">${escapeHtml(p.name)}${p.alive?"":"（死亡）"}</div>
        <div class="claim-role">${roleName(p.claimed)}CO</div>
      </div>
      ${resultHistory(p)?`<div class="claim-results">${escapeHtml(resultHistory(p))}</div>`:""}
    </div>`).join("");
}

function renderAll(){
  if(!state)return;
  $("#phaseTitle").textContent=state.winner?`ゲーム終了：${state.winner}`:`${state.day}日目・${state.phase==="day"?"昼":"夜"}`;
  $("#statusBadges").innerHTML=`<span class="badge">生存 ${living().length}</span><span class="badge">死亡 ${state.players.length-living().length}</span><span class="badge">あなた：村人</span>`;
  renderClaimBoard();

  $("#players").innerHTML=state.players.map(p=>`
    <div class="player-row ${p.alive?"":"dead"}">
      <div class="player-name">${escapeHtml(p.name)}${p.isSelf?"（あなた）":""}</div>
      <div class="player-co">${p.claimed?roleName(p.claimed)+"CO":(p.villagerClaim===true?"村人CO":(p.villagerClaim===false?"非村人":"未CO"))}</div>
      <div class="player-life">${p.alive?"生存":"死亡"}</div>
    </div>`).join("");

  renderLog();
  const dis=!!state.winner||state.phase!=="day";
  ["#executeBtn","#blackSeerBtn","#blackMediumBtn","#roleCoBtn","#individualCoBtn","#villagerCheckBtn","#hiddenSeerBtn","#hiddenGuardBtn","#publicSeerBtn"].forEach(s=>$(s).disabled=dis);
  $("#nightBtn").disabled=!!state.winner||state.phase!=="night";
  renderDebug();
}

function makeTargetPanel(title,cands,onSelect){
  const p=$("#actionPanel");p.classList.remove("hidden");
  p.innerHTML=`<b>${escapeHtml(title)}</b><div class="target-list">${cands.map(x=>`<button data-target="${x.id}">${escapeHtml(x.name)}</button>`).join("")}</div><div class="row" style="margin-top:9px"><button class="ghost" id="cancelAction">キャンセル</button></div>`;
  p.querySelectorAll("[data-target]").forEach(b=>b.onclick=()=>{onSelect(+b.dataset.target);p.classList.add("hidden")});
  $("#cancelAction").onclick=()=>p.classList.add("hidden");
}

function makeRolePanel(){
  const p=$("#actionPanel");p.classList.remove("hidden");
  p.innerHTML=`<b>COさせる役職を選択</b><div class="target-list">${ROLES.map(([r,n])=>`<button data-role="${r}">${n}</button>`).join("")}</div><div class="row" style="margin-top:9px"><button class="ghost" id="cancelAction">キャンセル</button></div>`;
  p.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{forceRoleCO(b.dataset.role);p.classList.add("hidden")});
  $("#cancelAction").onclick=()=>p.classList.add("hidden");
}

function reportTrueSeer(p,first=false){
  if(first)log(`${p.name} が【占い師CO】しました。`,"claim");
  const unread=p.seerResults.slice(p.lastReportedSeerCount||0);
  if(!unread.length&&first){log(`${p.name}（占い師CO）：まだ占い結果はありません。`,"result");return}
  unread.forEach(r=>log(`${p.name}（占い師CO）：${byId(r.target).name} → ${r.black?"人狼":"人狼ではない"}`,"result"));
  p.lastReportedSeerCount=p.seerResults.length;
}
function reportFakeSeer(p,first=false){
  if(first)log(`${p.name} が【占い師CO】しました。`,"claim");
  const unread=p.fakeSeerResults.slice(p.lastReportedSeerCount||0);
  unread.forEach(r=>log(`${p.name}（占い師CO）：${byId(r.target).name} → ${r.black?"人狼":"人狼ではない"}`,"result"));
  p.lastReportedSeerCount=p.fakeSeerResults.length;
}
function reportTrueMedium(p,first=false){
  if(first)log(`${p.name} が【霊媒師CO】しました。`,"claim");
  const unread=p.mediumResults.slice(p.lastReportedMediumCount||0);
  if(!unread.length&&first){log(`${p.name}（霊媒師CO）：まだ霊媒結果はありません。`,"result");return}
  unread.forEach(r=>log(`${p.name}（霊媒師CO）：${byId(r.target).name} → ${r.black?"人狼":"人狼ではない"}`,"result"));
  p.lastReportedMediumCount=p.mediumResults.length;
}
function reportFakeMedium(p,first=false){
  if(first)log(`${p.name} が【霊媒師CO】しました。`,"claim");
  const unread=p.fakeMediumResults.slice(p.lastReportedMediumCount||0);
  unread.forEach(r=>log(`${p.name}（霊媒師CO）：${byId(r.target).name} → ${r.black?"人狼":"人狼ではない"}`,"result"));
  p.lastReportedMediumCount=p.fakeMediumResults.length;
}

function ensureInitialFakeSeerResult(p){
  if(p.fakeSeerResults.length)return;
  const t=randomChoice(living().filter(x=>x.id!==p.id));
  if(t)p.fakeSeerResults.push({day:1,target:t.id,black:chooseFakeBlack(p,t)});
}

function forceRoleCO(r){
  const real=roleLiving(r);
  const fake=living().filter(p=>p.fakeClaimRole===r);
  const all=[...real,...fake.filter(p=>!real.includes(p))];
  if(!all.length){log(`【${roleName(r)}CO指示】CO指示を出しました。`,"system");return}

  all.forEach(p=>{p.claimed=r;p.villagerClaim=null});
  if(r==="seer"){
    real.forEach(p=>reportTrueSeer(p,true));
    fake.forEach(p=>{ensureInitialFakeSeerResult(p);reportFakeSeer(p,true)});
  }else if(r==="medium"){
    real.forEach(p=>reportTrueMedium(p,true));
    fake.forEach(p=>reportFakeMedium(p,true));
  }else{
    all.forEach(p=>log(`${p.name} が【${roleName(r)}CO】しました。`,"claim"));
  }
  save();renderAll();
}

function blackSeerCO(){
  const real=roleLiving("seer").filter(p=>p.seerResults.some(r=>r.black));
  const fake=living().filter(p=>p.fakeClaimRole==="seer"&&p.fakeSeerResults.some(r=>r.black));
  const all=[...real,...fake.filter(p=>!real.includes(p))];
  if(!all.length){log("【黒出し占い師CO】指示を出しました。","system");return}
  all.forEach(p=>{p.claimed="seer";p.villagerClaim=null});
  real.forEach(p=>reportTrueSeer(p,true));
  fake.forEach(p=>reportFakeSeer(p,true));
  save();renderAll();
}

function blackMediumCO(){
  const real=roleLiving("medium").filter(p=>p.mediumResults.some(r=>r.black));
  const fake=living().filter(p=>p.fakeClaimRole==="medium"&&p.fakeMediumResults.some(r=>r.black));
  const all=[...real,...fake.filter(p=>!real.includes(p))];
  if(!all.length){log("【黒出し霊媒師CO】指示を出しました。","system");return}
  all.forEach(p=>{p.claimed="medium";p.villagerClaim=null});
  real.forEach(p=>reportTrueMedium(p,true));
  fake.forEach(p=>reportFakeMedium(p,true));
  save();renderAll();
}

/* 個別CO確認 */
function individualCoCheck(){
  makeTargetPanel("COを確認する人物",living(),id=>{
    const p=byId(id);

    if(p.claimed){
      log(`【個別CO確認】${p.name}：「${roleName(p.claimed)}COしています」`,"claim");
      return;
    }

    // 村陣営の役職持ちは正直にCO
    if(["seer","knight","medium"].includes(p.role)){
      p.claimed=p.role;
      p.villagerClaim=null;
      if(p.role==="seer")reportTrueSeer(p,true);
      else if(p.role==="medium")reportTrueMedium(p,true);
      else log(`${p.name} が【騎士CO】しました。`,"claim");
    }
    // 人外は騙り予定があればその役職をCO
    else if(["madman","wolf","fox"].includes(p.role)&&p.fakeClaimRole){
      p.claimed=p.fakeClaimRole;
      p.villagerClaim=null;
      if(p.fakeClaimRole==="seer"){
        ensureInitialFakeSeerResult(p);
        reportFakeSeer(p,true);
      }else if(p.fakeClaimRole==="medium"){
        reportFakeMedium(p,true);
      }
    }else{
      log(`【個別CO確認】${p.name}：「COはありません」`,"system");
    }
    save();renderAll();
  });
}

/* 個別村人CO */
function villagerCheck(){
  makeTargetPanel("「村人ですか？」と確認する人物",living(),id=>{
    const p=byId(id);

    // 既に役職CO済みならそのCOを維持
    if(p.claimed){
      p.villagerClaim=false;
      log(`【個別村人CO】${p.name}：「村人ではありません。${roleName(p.claimed)}COです」`,"claim");
      save();renderAll();return;
    }

    let saysVillager=false;
    if(p.role==="villager"){
      saysVillager=true;
    }else if(["seer","knight","medium"].includes(p.role)){
      saysVillager=false;
    }else if(p.role==="madman"){
      saysVillager=Math.random()<0.78;
    }else if(p.role==="wolf"){
      saysVillager=Math.random()<0.88;
    }else if(p.role==="fox"){
      saysVillager=Math.random()<0.84;
    }

    p.villagerClaim=saysVillager;
    log(`【個別村人CO】${p.name}：「${saysVillager?"村人です":"村人ではありません"}」`,saysVillager?"claim":"system");
    save();renderAll();
  });
}

function hiddenSeerInstruction(){
  makeTargetPanel("潜伏占い師への占い先指示",living(),id=>{
    roleLiving("seer").filter(p=>p.claimed!=="seer").forEach(p=>p.forcedSeerTarget=id);
    log(`【潜伏占い指示】次回占い先を ${byId(id).name} に指定しました。`,"system");
    save();renderAll();
  });
}
function hiddenGuardInstruction(){
  makeTargetPanel("潜伏騎士への護衛先指示",living(),id=>{
    roleLiving("knight").filter(p=>p.claimed!=="knight").forEach(p=>p.forcedGuardTarget=id);
    log(`【潜伏護衛指示】次回護衛先を ${byId(id).name} に指定しました。`,"system");
    save();renderAll();
  });
}
function publicSeerInstruction(){
  const claimants=living().filter(p=>p.claimed==="seer");
  const panel=$("#actionPanel");panel.classList.remove("hidden");
  if(!claimants.length){
    panel.innerHTML=`<b>CO済占い師への個別指示</b><div class="muted" style="margin-top:8px">現在公開上の占い師CO者はいません。</div><div class="row" style="margin-top:9px"><button class="ghost" id="cancelAction">閉じる</button></div>`;
    $("#cancelAction").onclick=()=>panel.classList.add("hidden"); return;
  }
  panel.innerHTML=`<b>指示する占い師CO者を選択</b><div class="target-list">${claimants.map(p=>`<button data-seer="${p.id}">${escapeHtml(p.name)}</button>`).join("")}</div><div class="row" style="margin-top:9px"><button class="ghost" id="cancelAction">キャンセル</button></div>`;
  panel.querySelectorAll("[data-seer]").forEach(b=>b.onclick=()=>{
    const seer=byId(+b.dataset.seer);
    makeTargetPanel(`${seer.name} の次回占い先`,living().filter(x=>x.id!==seer.id),id=>{
      seer.forcedSeerTarget=id;
      log(`【公開占い指示】${seer.name} の次回占い先を ${byId(id).name} に指定しました。`,"system");
      save();renderAll();
    });
  });
  $("#cancelAction").onclick=()=>panel.classList.add("hidden");
}

function chooseExecution(){
  makeTargetPanel("本日の処刑対象を選択",living(),id=>{
    const p=byId(id);p.alive=false;state.lastExecuted=id;
    log(`${p.name} は処刑されました。`,"death");
    roleLiving("medium").forEach(m=>m.mediumResults.push({day:state.day+1,target:id,black:p.role==="wolf"}));
    living().filter(x=>x.fakeClaimRole==="medium").forEach(m=>{
      m.fakeMediumResults.push({day:state.day+1,target:id,black:chooseFakeMediumBlack(m,p)});
    });
    const w=checkWin(); if(w){finish(w);return}
    state.phase="night";log("夜になりました。","system");save();renderAll();
  });
}

function chooseFakeBlack(liar,target){
  if(liar.role==="wolf"){if(target.role==="wolf")return false; return Math.random()<0.35}
  if(liar.role==="madman")return Math.random()<0.28;
  if(liar.role==="fox")return Math.random()<0.22;
  return false;
}
function chooseFakeMediumBlack(liar,executed){
  if(liar.role==="wolf"){if(executed.role==="wolf")return false; return Math.random()<0.28}
  if(liar.role==="madman")return Math.random()<0.32;
  if(liar.role==="fox")return Math.random()<0.25;
  return false;
}

/* 指定なしの場合、未占いの相手を優先 */
function autoSeerTarget(p,results){
  const seen=new Set(results.map(r=>r.target));
  let candidates=living().filter(x=>x.id!==p.id && !seen.has(x.id));
  if(!candidates.length){
    // 全員一度は占っていたら、生存者から再選択
    candidates=living().filter(x=>x.id!==p.id);
  }
  return randomChoice(candidates);
}

function resolveNight(){
  if(state.phase!=="night"||state.winner)return;
  let foxKilled=[];

  roleLiving("seer").forEach(s=>{
    let t=s.forcedSeerTarget!=null&&byId(s.forcedSeerTarget)?.alive?byId(s.forcedSeerTarget):null;
    if(!t)t=autoSeerTarget(s,s.seerResults);
    if(t){
      s.seerResults.push({day:state.day+1,target:t.id,black:t.role==="wolf"});
      if(t.role==="fox")foxKilled.push(t.id);
    }
    s.forcedSeerTarget=null;
  });

  living().filter(p=>p.fakeClaimRole==="seer").forEach(s=>{
    let t=s.forcedSeerTarget!=null&&byId(s.forcedSeerTarget)?.alive?byId(s.forcedSeerTarget):null;
    if(!t)t=autoSeerTarget(s,s.fakeSeerResults);
    if(t)s.fakeSeerResults.push({day:state.day+1,target:t.id,black:chooseFakeBlack(s,t)});
    s.forcedSeerTarget=null;
  });

  const guardTargets=[];
  roleLiving("knight").forEach(k=>{
    let t=k.forcedGuardTarget!=null&&byId(k.forcedGuardTarget)?.alive?byId(k.forcedGuardTarget):null;
    if(!t)t=randomChoice(living().filter(p=>p.id!==k.id));
    if(t)guardTargets.push(t.id);
    k.forcedGuardTarget=null;
  });

  const wolves=roleLiving("wolf");
  let attacked=null;
  if(wolves.length)attacked=randomChoice(living().filter(p=>p.role!=="wolf"));

  foxKilled=[...new Set(foxKilled)];
  foxKilled.forEach(id=>{
    const p=byId(id);
    if(p&&p.alive){p.alive=false;log(`${p.name} が無残な姿で発見されました。`,"death")}
  });

  if(attacked&&attacked.alive){
    if(guardTargets.includes(attacked.id))log("平和な朝がやってきました。","result");
    else{attacked.alive=false;log(`${attacked.name} が無残な姿で発見されました。`,"death")}
  }else if(!foxKilled.length){
    log("平和な朝がやってきました。","result");
  }

  const w=checkWin(); if(w){finish(w);return}

  state.day++;state.phase="day";
  log(`${state.day}日目の朝になりました。`,"system");

  living().filter(p=>p.claimed==="seer").forEach(p=>{
    if(p.role==="seer")reportTrueSeer(p,false);
    else if(p.fakeClaimRole==="seer")reportFakeSeer(p,false);
  });
  living().filter(p=>p.claimed==="medium").forEach(p=>{
    if(p.role==="medium")reportTrueMedium(p,false);
    else if(p.fakeClaimRole==="medium")reportFakeMedium(p,false);
  });

  save();renderAll();
}

function checkWin(){
  const a=living(),w=a.filter(p=>p.role==="wolf").length,f=a.filter(p=>p.role==="fox").length,o=a.length-w-f;
  if(w===0)return f>0?"妖狐陣営の勝利":"村人陣営の勝利";
  if(w>=o)return f>0?"妖狐陣営の勝利":"人狼陣営の勝利";
  return null;
}
function finish(w){state.winner=w;state.phase="end";log(`ゲーム終了：${w}`,"system");save();renderAll()}
function save(){localStorage.setItem("jinro_v04_state",JSON.stringify(state))}
function load(){
  try{
    const r=localStorage.getItem("jinro_v04_state");
    if(!r){alert("保存データがありません");return}
    state=JSON.parse(r); showGame();
  }catch(e){alert("保存データを読み込めませんでした")}
}
function reset(){
  if(confirm("現在のゲームを終了して設定画面に戻りますか？")){
    localStorage.removeItem("jinro_v04_state"); state=null; showSetup();
  }
}
function renderDebug(){
  if(!state)return;
  $("#debugText").innerHTML=state.players.map(p=>`${escapeHtml(p.name)}：${roleName(p.role)} / ${p.alive?"生存":"死亡"} / CO ${publicClaim(p)} / 騙り予定 ${p.fakeClaimRole?roleName(p.fakeClaimRole):"なし"} / 村人回答 ${p.villagerClaim===null?"未確認":(p.villagerClaim?"村人":"非村人")}`).join("<br>");
}

$("#playerCount").addEventListener("input",renderRoleConfig);
$("#startBtn").onclick=startGame;
$("#loadBtn").onclick=load;
$("#resetBtn").onclick=reset;
$("#blackSeerBtn").onclick=blackSeerCO;
$("#blackMediumBtn").onclick=blackMediumCO;
$("#roleCoBtn").onclick=makeRolePanel;
$("#individualCoBtn").onclick=individualCoCheck;
$("#villagerCheckBtn").onclick=villagerCheck;
$("#hiddenSeerBtn").onclick=hiddenSeerInstruction;
$("#hiddenGuardBtn").onclick=hiddenGuardInstruction;
$("#publicSeerBtn").onclick=publicSeerInstruction;
$("#executeBtn").onclick=chooseExecution;
$("#nightBtn").onclick=resolveNight;
$("#debugBtn").onclick=()=>$("#debugPanel").classList.toggle("hidden");

renderRoleConfig();
</script>
