<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>個人用人狼アプリ v2.3.0</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a22; --panel2:#202532; --text:#f5f7fb; --muted:#9ca6b7;
  --accent:#7c9cff; --danger:#ff6b6b; --line:#2b3140; --warn:#ffd166; --ok:#5fd3a2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
button,input{font:inherit}
button{border:0;border-radius:11px;padding:10px 12px;background:var(--accent);color:white;font-weight:700}
button.secondary{background:var(--panel2)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.45}
.wrap{max-width:980px;margin:auto;padding:76px 14px 118px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.grid{display:grid;gap:8px}
.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:700px){.cols2,.cols3{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.role-row{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.role-row:last-child{border-bottom:0}
input[type=number],input[type=text]{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#0d1016;color:var(--text)}
.status{display:flex;gap:6px;flex-wrap:wrap}
.badge{padding:5px 8px;border-radius:999px;background:var(--panel2);font-size:12px}
.hidden{display:none!important}
.notice{padding:9px 10px;border-radius:11px;background:#111827;border:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* compact player UI */
.claim-board{display:grid;gap:7px}
.claim-card{background:#11151d;border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.claim-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.claim-name{font-weight:800}
.claim-role{color:var(--warn);font-size:12px}
.claim-results{margin-top:5px;font-size:12px;line-height:1.45;color:#dbe3f2}
.player-list{display:grid;gap:5px}
.player-row{display:grid;grid-template-columns:minmax(90px,1.1fr) .8fr .7fr;gap:8px;align-items:center;padding:7px 9px;background:var(--panel2);border-radius:10px;border:1px solid var(--line);font-size:13px}
.player-row.dead{opacity:.48}
.player-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-co{color:var(--warn);white-space:nowrap}
.player-life{color:var(--muted);text-align:right}
@media(max-width:520px){
 .player-row{grid-template-columns:minmax(88px,1.2fr) .9fr .55fr;font-size:12px;padding:6px 8px}
}

.log{height:300px;overflow:auto;background:#0d1016;border-radius:11px;padding:10px;border:1px solid var(--line)}
.log p{margin:0 0 8px;line-height:1.45;font-size:13px}
.log .system{color:#c7d2fe}
.log .death{color:#ff9a9a}
.log .result{color:#a7f3d0}
.log .claim{color:#ffd166}
.target-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-top:9px}
.target-list button{background:var(--panel2);border:1px solid var(--line)}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}

.topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(15,17,23,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:980px;margin:auto;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.topbar-title{font-weight:800}.topbar-mini{font-size:12px;color:var(--muted)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(15,17,23,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bottom-nav-inner{max-width:980px;margin:auto;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bottom-nav button{min-height:52px;padding:12px 8px;font-size:14px;border-radius:14px;touch-action:manipulation}
@media(max-width:520px){
  .bottom-nav-inner{gap:8px;padding-left:8px;padding-right:8px}
  .bottom-nav button{min-height:50px;font-size:13px}
}
.action-sheet{position:fixed;left:10px;right:10px;bottom:76px;z-index:60;max-width:720px;margin:auto;background:#141923;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.action-sheet-title{font-weight:800;margin-bottom:8px}.action-sheet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.action-sheet-grid button{background:var(--panel2)}.action-sheet-close{margin-top:8px;width:100%;background:transparent;border:1px solid var(--line)}
.tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}.tabbar button{flex:0 0 auto;padding:8px 10px;background:var(--panel2);font-size:12px}.tabbar button.active{background:var(--accent)}
.compact-section{padding:10px}.claim-role-section{margin-top:8px}.claim-role-label{font-weight:800;font-size:13px;color:var(--warn);margin-bottom:6px}
.claim-card{padding:8px 9px}.claim-results{font-size:11px}.player-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.player-row{grid-template-columns:1fr auto;gap:6px;padding:7px 8px}.player-row .player-co{grid-column:1/2;font-size:11px}.player-life{grid-row:1/3;grid-column:2/3;align-self:center}
@media(max-width:520px){.player-list{grid-template-columns:repeat(2,minmax(0,1fr))}.player-row{font-size:11px}}
.log.collapsed{height:108px}.log-toggle{width:100%;margin-top:8px;background:var(--panel2)}
.player-row.selectable{cursor:pointer;outline:1px solid transparent}.player-row.selectable:hover{outline-color:var(--accent)}.player-row.selectable.selected{background:#2b3655;outline:2px solid var(--accent)}.selection-hint{font-size:12px;color:var(--warn);margin-top:6px}.role-reveal{font-size:11px;color:var(--ok);font-weight:800;margin-top:3px}
.confirm-sheet{position:fixed;left:10px;right:10px;bottom:76px;z-index:70;max-width:720px;margin:auto;background:#141923;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.confirm-list{display:grid;gap:6px;margin:10px 0}
.confirm-item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.player-row.dimmed{opacity:.22;filter:saturate(.35)}
.player-row.selectable{cursor:pointer;outline:1px solid transparent}
.player-number{font-size:10px;color:var(--muted);margin-right:4px}

.log .talk{padding:7px 9px;margin:5px 0;border-left:3px solid var(--accent);background:rgba(127,127,127,.08);border-radius:8px}

.log-head-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.log-head-row h2{margin-bottom:0}
#logPersonFilter{min-height:40px;max-width:180px;padding:7px 9px;border-radius:10px}

.broken-badge{display:inline-block;margin-left:4px;padding:2px 6px;border-radius:999px;font-size:11px;font-weight:800;background:#b42318;color:#fff;vertical-align:middle}
.broken-reason{margin-top:6px;padding:7px 9px;border-radius:8px;background:rgba(180,35,24,.10);font-size:12px;font-weight:700}

.confirmed-badge{display:inline-block;margin-left:4px;padding:2px 6px;border-radius:999px;font-size:11px;font-weight:800;background:#18794e;color:#fff;vertical-align:middle}
.confirmed-reason{margin-top:6px;padding:7px 9px;border-radius:8px;background:rgba(24,121,78,.10);font-size:12px;font-weight:700}

.assist-settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.assist-toggle{display:flex;align-items:center;gap:8px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-weight:700}
.assist-toggle input{width:18px;height:18px;margin:0}
.assist-note{font-size:12px;margin-top:4px}
@media(max-width:520px){.assist-settings{grid-template-columns:1fr}}
.role-summary{font-size:11px;line-height:1.6;opacity:.72;margin-top:5px;word-break:keep-all}

.preset-list{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}.preset-list button{padding:7px 11px;font-size:13px}.preset-list .preset-active{outline:2px solid currentColor}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-inner">
  <div><div class="topbar-title">個人用人狼 v2.3.0</div><div class="topbar-mini" id="topbarPhase">待機中</div></div>
  <div class="row"><button class="ghost" id="debugBtnTop">デバッグ</button><button class="danger" id="resetBtnTop">終了</button></div>
</div></div>
<div class="wrap">

  <section id="setupScreen">
    <div class="card">
      <h2>ゲーム設定</h2>
      <div class="grid cols2">
        <label>参加人数<input id="playerCount" type="number" min="5" max="20" value="9"></label>
        <label>自分の名前<input id="selfName" type="text" value="あなた" maxlength="12"></label>
      </div>
      <hr>
      <h2>推理補助表示</h2>
      <div class="assist-settings">
        <label class="assist-toggle"><input id="showConfirmedBadges" type="checkbox" checked> 真確定を自動表示</label>
        <label class="assist-toggle"><input id="showBrokenBadges" type="checkbox" checked> 破綻を自動表示</label>
      </div>
      <div class="muted assist-note">OFFでも内部判定とCOMの推理はそのまま動作します。</div>
      <hr>
      <h2>配役</h2>
      <div class="preset-list" id="presetList"></div>
      <div id="roleConfig"></div>
      <div class="notice" id="sumNotice"></div>
      <div class="row" style="margin-top:12px">
        <button id="startBtn">ゲーム開始</button>
        <button class="secondary" id="loadBtn">保存データを再開</button>
      </div>
    </div>
  </section>

  <section id="gameScreen" class="hidden">


    <div class="card compact-section"><div class="status" id="statusBadges"></div><div id="roleSummary" class="role-summary"></div><div id="selectionHint" class="selection-hint hidden"></div></div>

    <div class="card compact-section">
      <div class="tabbar" id="claimTabs">
        <button data-claimtab="seer" class="active">占い</button>
        <button data-claimtab="medium">霊媒</button>
        <button data-claimtab="knight">騎士</button>
        <button data-claimtab="resonator">共鳴</button>
        <button data-claimtab="cat">猫又</button>
        <button data-claimtab="villager">村人</button>
      </div>
      <div id="claimBoard" class="claim-board claim-role-section"></div>
    </div>

    <div class="card compact-section">
      <h2>全プレイヤー</h2>
      <div id="players" class="player-list"></div>
    </div>

    <div class="card compact-section">
      <div class="log-head-row">
        <h2>公開ログ</h2>
        <select id="logPersonFilter" aria-label="人物でログを絞り込む">
          <option value="">全員のログ</option>
        </select>
      </div>
      <div id="log" class="log collapsed"></div>
      <button id="logToggleBtn" class="log-toggle">ログを全部見る</button>
    </div>

    <div id="actionPanel" class="hidden"></div>

    <div id="actionSheet" class="action-sheet hidden">
      <div id="actionSheetTitle" class="action-sheet-title">操作</div>
      <div id="actionSheetGrid" class="action-sheet-grid"></div>
      <button id="actionSheetClose" class="action-sheet-close">閉じる</button>
    </div>

    <div id="confirmSheet" class="confirm-sheet hidden">
      <div style="font-weight:800">処刑前の確認</div>
      <div id="confirmTarget" class="muted" style="margin-top:4px"></div>
      <div id="confirmInstructions" class="confirm-list"></div>
      <div class="confirm-actions">
        <button id="confirmExecuteBtn">確認して処刑</button>
        <button id="cancelExecuteBtn" class="secondary">戻る</button>
      </div>
    </div>

    <div class="bottom-nav"><div class="bottom-nav-inner">
      <button id="navCo">CO</button>
      <button id="navSeer" class="secondary">占い</button>
      <button id="navGuard" class="secondary">護衛</button>
      <button id="navFlow" class="secondary">進行</button>
    </div></div>

    <div id="debugPanel" class="card hidden">
      <h2>デバッグ情報</h2>
      <div id="debugText" class="muted"></div>
    </div>
  </section>

  <div class="footer">端末内保存。サーバー通信なし。</div>
</div>

<script>
const ROLES=[
  ["villager","村人"],["seer","占い師"],["knight","騎士"],["medium","霊媒師"],
  ["madman","狂人"],["wolf","人狼"],["fox","妖狐"],["resonator","共鳴者"],["cat","猫又"]
];
const TEAM={villager:"村人陣営",seer:"村人陣営",knight:"村人陣営",medium:"村人陣営",madman:"人狼陣営",wolf:"人狼陣営",fox:"妖狐陣営",resonator:"村人陣営",cat:"村人陣営"};
let state=null;
const $=s=>document.querySelector(s);
const roleName=r=>ROLES.find(x=>x[0]===r)?.[1]??r;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const randomChoice=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function defaultCounts(n){
  const b={villager:3,seer:1,knight:1,medium:1,madman:1,wolf:2,fox:0,resonator:0,cat:0};
  if(n<9){
    b.villager=Math.max(1,n-4); b.medium=n>=7?1:0; b.madman=n>=6?1:0;
    b.knight=n>=6?1:0; b.wolf=n>=7?2:1; b.seer=1;
  }else if(n>9){b.villager+=n-9}
  return b;
}
const ROLE_PRESETS={
  9:{villager:3,seer:1,medium:1,knight:1,wolf:2,madman:1},
  12:{villager:4,seer:1,medium:1,knight:1,resonator:2,wolf:2,madman:1},
  15:{villager:4,seer:1,medium:1,resonator:2,knight:1,cat:1,wolf:3,madman:1,fox:1},
  16:{villager:5,seer:1,medium:1,resonator:2,knight:1,cat:1,wolf:3,madman:1,fox:1},
  20:{villager:6,seer:1,medium:1,resonator:2,knight:1,cat:1,wolf:5,madman:2,fox:1}
};
function applyRolePreset(n){
  const preset=ROLE_PRESETS[n];if(!preset)return;
  $("#playerCount").value=n;
  document.querySelectorAll("[data-role-count]").forEach(e=>e.value=preset[e.dataset.roleCount]||0);
  updateSum();
  document.querySelectorAll("[data-preset]").forEach(b=>b.classList.toggle("preset-active",+b.dataset.preset===n));
}
function renderRolePresets(){
  $("#presetList").innerHTML=Object.keys(ROLE_PRESETS).map(n=>`<button type="button" class="secondary" data-preset="${n}">${n}人村</button>`).join("");
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>applyRolePreset(+b.dataset.preset));
}
function renderRoleConfig(){
  const n=clamp(+$("#playerCount").value,5,20),saved={};
  document.querySelectorAll("[data-role-count]").forEach(e=>saved[e.dataset.roleCount]=+e.value||0);
  const c=Object.keys(saved).length?saved:defaultCounts(n);
  $("#roleConfig").innerHTML=ROLES.map(([k,nm])=>`
    <div class="role-row">
      <div><b>${nm}</b><div class="muted">${TEAM[k]}</div></div>
      <input type="number" min="0" max="20" value="${c[k]??0}" data-role-count="${k}">
    </div>`).join("");
  document.querySelectorAll("[data-role-count]").forEach(e=>e.addEventListener("input",updateSum));
  updateSum();
}
function getRoleCounts(){const o={};document.querySelectorAll("[data-role-count]").forEach(e=>o[e.dataset.roleCount]=Math.max(0,+e.value||0));return o}
function updateSum(){
  const n=+$("#playerCount").value,c=getRoleCounts(),sum=Object.values(c).reduce((a,b)=>a+b,0);
  const ok=sum===n&&c.villager>=1&&c.wolf>=1;
  $("#sumNotice").innerHTML=`配役合計 <b>${sum}</b> / ${n}人　${ok?"✅ 開始できます":"⚠️ 合計人数を合わせ、村人1人以上・人狼1人以上にしてください"}`;
  $("#startBtn").disabled=!ok;
}

function newPlayer(id,name,role,isSelf=false){
  return {
    id,name,role,alive:true,isSelf,claimed:null,
    seerResults:[],mediumResults:[],fakeSeerResults:[],fakeMediumResults:[],
    forcedSeerTarget:null,forcedGuardTarget:null,fakeClaimRole:null,
    lastReportedSeerCount:0,lastReportedMediumCount:0,
    guardHistory:[], resonancePartners:[], villagerClaim:null,
    lastSpeechDay:0,lastSpeechText:"",speechHistory:[],lastSuspectId:null,coCheckedNone:false,deathDay:null,deathPhase:null,coHistory:[],villagerAnswerLocked:false
  };
}

function startGame(){
  const n=clamp(+$("#playerCount").value,5,20),c=getRoleCounts();
  if(Object.values(c).reduce((a,b)=>a+b,0)!==n||c.villager<1||c.wolf<1)return;
  if(c.resonator===1){
    alert("共鳴者は2人以上で配役してください。");
    return;
  }

  const roles=[],assign={...c,villager:c.villager-1};
  for(const[r]of ROLES)for(let i=0;i<assign[r];i++)roles.push(r);
  shuffle(roles);

  const names=["アキラ","ユウト","ハルキ","レンジ","ミサキ","ナオト","ソウマ","リクヤ","カイト","ヒナタ","レイジ","シオン","アオイ","トウマ","マコト","ユキト","セナト","リンカ","ケンタ"];
  const ps=[newPlayer(0,$("#selfName").value.trim()||"あなた","villager",true)];
  for(let i=1;i<n;i++)ps.push(newPlayer(i,names[i-1]??`P${i+1}`,roles[i-1],false));

  state={
    version:"2.3.0",day:1,phase:"day",players:ps,logs:[],winner:null,lastExecuted:null,
    publicRoleCounts:{...c},
    publicRecords:{seerResults:[],mediumResults:[],guards:[],executions:[],deaths:[],catChains:[],resonatorClaims:[],fullCoRequests:[],confirmedProofs:[],coEvents:[]},
    uiSettings:{
      showConfirmedBadges:!!$("#showConfirmedBadges")?.checked,
      showBrokenBadges:!!$("#showBrokenBadges")?.checked
    },
    logPersonFilterId:null
  };

  // 初日占い
  roleLiving("seer").forEach(s=>{
    const target=randomChoice(state.players.filter(p=>p.id!==s.id));
    if(target)s.seerResults.push({day:1,target:target.id,black:target.role==="wolf"});
  });

  assignFakeClaims();

  // 占い師騙り予定の人外にも、ゲーム開始時点で偽の初日占い結果を1件持たせる
  state.players.filter(p=>p.fakeClaimRole==="seer").forEach(p=>{
    if(!p.fakeSeerResults.length){
      const plan=p.role==="wolf"?chooseWolfFakeSeerAction(p):null;
      const t=plan?.target||randomChoice(state.players.filter(x=>x.id!==p.id));
      if(t)p.fakeSeerResults.push({day:1,target:t.id,black:plan?plan.black:chooseFakeBlack(p,t)});
    }
  });

  log(`ゲーム開始。参加者は${n}人。あなたの役職は【村人】です。`,"system");
  runDaySpeeches();
  save();showGame();
}

function assignFakeClaims(){
  // 狂人：占い騙りが中心。低確率で猫又騙りも選ぶ。
  state.players.filter(p=>p.role==="madman").forEach(m=>{
    const r=Math.random();
    m.fakeClaimRole=r<0.56?"seer":r<0.73?"medium":r<0.81?"cat":r<0.88?"knight":null;
  });

  // 人狼：一定確率で1匹が騙り役。占い中心、霊媒、低確率で猫又。
  const wolves=state.players.filter(p=>p.role==="wolf");
  if(wolves.length&&Math.random()<0.65){
    const liar=randomChoice(wolves);
    const r=Math.random();
    liar.fakeClaimRole=r<0.62?"seer":r<0.80?"medium":r<0.91?"cat":"knight";
  }

  // 妖狐：騙り自体は控えめ。猫又騙りも低確率で残す。
  state.players.filter(p=>p.role==="fox").forEach(f=>{
    const r=Math.random();
    f.fakeClaimRole=r<0.16?"seer":r<0.24?"medium":r<0.30?"cat":r<0.34?"knight":null;
  });
}

function living(){return state.players.filter(p=>p.alive)}
function byId(id){return state.players.find(p=>p.id===+id)}
function roleLiving(r){return living().filter(p=>p.role===r)}
function publicClaim(p){return p.claimed?roleName(p.claimed):(p.coCheckedNone?"COなし":"未CO")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}


function ensurePublicRecords(){
  if(!state.publicRecords)state.publicRecords={};
  const r=state.publicRecords;
  for(const k of ["seerResults","mediumResults","guards","executions","deaths","catChains","resonatorClaims","fullCoRequests","confirmedProofs","coEvents"]){
    if(!Array.isArray(r[k]))r[k]=[];
  }
  // 旧判定で保存された証明には共鳴者の誤確定からの派生証明も含まれ得る。
  // 公開ログは保持し、旧証明を判定材料から一度だけ外す。再確定は公開記録から行う。
  if(r.truthRulesVersion!==2){

  }

}

function confirmedPremiseTopic(observer,publicInfo,confirmedMap){
  const confirmed=[...confirmedMap.keys()]
    .map(id=>byId(id))
    .filter(p=>p&&p.alive&&p.id!==observer.id);

  // 真占いの最新結果を「次の推理」に接続
  const cs=confirmed.find(p=>p.claimed==="seer");
  if(cs){
    const r=latestPublicSeerResultFor(cs.id);
    if(r){
      const t=byId(r.targetId);
      if(t&&t.alive&&t.id!==observer.id){
        if(r.black){
          return {kind:"confirmedPremise",targetId:t.id,
            text:`${cs.name}さんは真占いで確定しているので、${t.name}さんへの黒は重く見ます。今日は${t.name}さんを優先して考えたいです。`};
        }
        return {kind:"confirmedPremise",targetId:t.id,
          text:`${cs.name}さんは真占いで確定しているので、${t.name}さんは少なくとも人狼ではありません。この結果を前提に灰を見たいです。`};
      }
    }
  }

  // 真霊媒の最新結果を次の整理に利用
  const cm=confirmed.find(p=>p.claimed==="medium");
  if(cm){
    const r=latestPublicMediumResultFor(cm.id);
    if(r){
      const t=byId(r.targetId);
      if(t){
        return {kind:"confirmedPremise",targetId:t.id,
          text:`${cm.name}さんは真霊媒で確定しているので、${t.name}さんの霊媒結果は確定情報として扱えます。ここから占い結果との整合性を見たいです。`};
      }
    }
  }

  // 共鳴・猫又などは「吊り候補から外す」前提として使う
  const cv=confirmed.find(p=>["cat","knight"].includes(p.claimed));
  if(cv){
    return {kind:"confirmedPremise",targetId:cv.id,
      text:`${cv.name}さんは真${roleName(cv.claimed)}で確定しているので、今日はそこを疑うより未確定の人を見たいです。`};
  }
  return null;
}

function roleClaimProbability(p,role,snap,mode="role"){
  if(!hostile(p)||!p.alive||role==="resonator")return 0;
  const prior=snap.claims.find(x=>x.id===p.id);
  if(prior?.claimed===role)return 1;
  // 一度役職COした人外は、基本的に自分の発言を維持する。変更は切迫時のみ。
  const otherRole=!!prior?.claimed&&prior.claimed!==role;
  const otherClaimants=snap.claims.filter(x=>x.alive&&x.claimed===role&&x.id!==p.id).length;
  const gray=snap.claims.filter(x=>x.alive&&!x.claimed&&x.villagerClaim!==true);
  const confirmedOthers=snap.claims.filter(x=>x.alive&&x.id!==p.id&&snap.confirmations.has(x.id));
  const nearlyExposed=gray.length<=1 || (snap.aliveIds.length<=4&&confirmedOthers.length>=snap.aliveIds.length-2);
  const prefs={wolf:{seer:.50,medium:.31,knight:.15,cat:.22},madman:{seer:.64,medium:.43,knight:.23,cat:.26},fox:{seer:.22,medium:.13,knight:.15,cat:.18}};
  let chance=prefs[p.role]?.[role]||0;
  if(p.fakeClaimRole===role)chance+=.19;
  if(otherClaimants>0)chance+=role==="cat"?.14:.07;
  if(nearlyExposed){
    chance+=role==="cat"?.72:role==="knight"?.43:.27;
  }
  if(role==="cat"&&snap.counts.cat===0)chance=0;
  if(role==="knight"&&snap.counts.knight===0)chance=0;
  if(role==="seer"&&snap.counts.seer===0)chance=0;
  if(role==="medium"&&snap.counts.medium===0)chance=0;
  if(otherRole)chance=nearlyExposed?chance*.21:0;
  if(prior?.villagerClaim===true)chance*=nearlyExposed?.85:.3;
  if(mode==="individual")chance*=.84;
  return Math.max(0,Math.min(.98,chance));
}
function chooseDynamicFakeRole(p,snap){
  const prior=snap.claims.find(x=>x.id===p.id);
  if(prior?.claimed)return prior.claimed;
  const roles=["seer","medium","knight","cat"];
  const ranked=roles.map(role=>({role,score:roleClaimProbability(p,role,snap,"individual")* (.85+Math.random()*.3)}));
  ranked.sort((a,b)=>b.score-a.score);
  const best=ranked[0];
  return best&&Math.random()<best.score?best.role:null;
}
function announceRole(p,role,first=true){
  const changed=recordRoleClaim(p,role);
  if(!changed&&!first)return;
  if(role==="seer"){
    if(p.role==="seer")reportTrueSeer(p,changed);
    else {ensureInitialFakeSeerResult(p);reportFakeSeer(p,changed)}
  }else if(role==="medium"){
    if(p.role==="medium")reportTrueMedium(p,changed);
    else reportFakeMedium(p,changed);
  }else if(role==="knight"){
    if(p.role==="knight")reportKnight(p,changed);
    else reportKnight(p,changed);
  }else if(role==="cat"&&changed){
    log(`${p.name} が【猫又CO】しました。`,"claim");
  }
}
function forceRoleCO(r){
  ensurePublicRecords();
  // 全員同じ指示前の公開盤面を参照し、人外の意思決定を先に完了する。
  const snap=coSnapshot();
  const real=roleLiving(r);
  const fakes=living().filter(p=>hostile(p)&&!real.includes(p)&&
    (p.claimed===r||Math.random()<roleClaimProbability(p,r,snap)));
  pushPublicRecord("fullCoRequests",{role:r,day:state.day,
    aliveIds:living().map(p=>p.id),
    priorDeadIds:state.players.filter(p=>!p.alive).map(p=>p.id)},["role"]);
  if(!real.length&&!fakes.length){
    log(`【${roleName(r)}CO指示】CO指示を出しました。`,"system");
    commitPublicTruthProofs();save();renderAll();return;
  }
  if(r==="resonator"){
    const livingResonators=roleLiving("resonator");
    livingResonators.forEach(p=>recordRoleClaim(p,"resonator"));
    livingResonators.forEach(p=>{
      log(`${p.name} が【共鳴者CO】しました。`,"claim");
      const partners=state.players.filter(x=>x.role==="resonator"&&x.id!==p.id);
      publishedResonatorClaim(p,partners.map(x=>x.id));
      if(partners.length)log(`${p.name}：「相方は ${partners.map(x=>x.name+(x.alive?"":"（死亡）")).join("、")} です」`,"result");
    });
  }else{
    [...real,...fakes].forEach(p=>announceRole(p,r));
  }
  commitPublicTruthProofs();save();renderAll();
}

function chooseWolfFakeSeerAction(liar){
  if(liar.role!=="wolf")return null;
  const seen=new Set((liar.fakeSeerResults||[]).map(r=>r.target));
  const allies=living().filter(p=>p.role==="wolf"&&p.id!==liar.id&&!seen.has(p.id));
  if(!allies.length)return null;
  const info=buildPublicInfo();
  const cracked=isPubliclyBroken(liar.id);
  const trusted=publicSeerCredibility(info,liar.id).score>1;
  const threatened=allies.filter(a=>{
    const publiclyBlack=(state.publicRecords?.seerResults||[]).some(r=>r.targetId===a.id&&r.black);
    return publiclyBlack||estimatePublicSuspicion(info,liar.id,a.id).score>=2;
  });
  const day=state.day;
  // 逆囲い: 明確に信用が落ちていて、味方が複数残るときだけ低確率。
  if(day>=3 && (cracked||!trusted) && threatened.length && roleLiving("wolf").length>=3 && Math.random()<0.16){
    return {target:randomChoice(threatened),black:true,plan:"reverse"};
  }
  // 信用獲得型の身内切り: 霊媒とのラインを狙えるときだけ限定的。
  const mediums=living().filter(p=>p.claimed==="medium");
  if(day>=2 && mediums.length && roleLiving("wolf").length>=3 && Math.random()<0.06){
    return {target:randomChoice(allies),black:true,plan:"sacrifice"};
  }
  // 白囲い: 自分の未占いの味方をランダムに選ぶ。
  if(Math.random()<(day<=2?0.58:0.30)){
    return {target:randomChoice(allies),black:false,plan:"cover"};
  }
  return null;
}

function chooseFakeBlack(liar,target){
  if(liar.role==="wolf"){if(target.role==="wolf")return Math.random()<(state.day>=3&&roleLiving("wolf").length>=3?.08:.015); return Math.random()<0.35}
  if(liar.role==="madman")return Math.random()<0.28;
  if(liar.role==="fox")return Math.random()<0.22;
  return false;
}
function chooseFakeMediumBlack(liar,executed){
  if(liar.role==="wolf"){if(executed.role==="wolf")return false; return Math.random()<0.28}
  if(liar.role==="madman")return Math.random()<0.32;
  if(liar.role==="fox")return Math.random()<0.25;

}

function autoSeerTarget(p,results){

  if(p.role==="seer"){const unknown=candidates.filter(x=>!isPubliclyConfirmedTrue(x.id));if(unknown.length)candidates=unknown;}
  if(!candidates.length){
    // 全員一度は占っていたら、生存者から再選択
    candidates=living().filter(x=>x.id!==p.id);
  }
  return randomChoice(candidates);
}


function wolfAttackScore(target){
  if(!target.alive || target.role==="wolf") return -999;

  let score=1;

  // 公開COの価値
  if(target.claimed==="seer") score+=7;
  if(target.claimed==="medium") score+=4.5;
  if(target.claimed==="resonator") score+=5.5;
  if(target.claimed==="knight") score+=3.5;
  if(target.claimed==="cat") score-=10;

  if(target.villagerClaim===true) score-=0.5;

  // 狼仲間への公開黒判定だけを参照する。未公開結果は参照しない。
  if(target.claimed==="seer"){
    const hitWolf=(state.publicRecords?.seerResults||[]).some(r=>
      r.seerId===target.id && r.black && byId(r.targetId)?.role==="wolf" && byId(r.targetId)?.alive
    );
    if(hitWolf)score+=6;
  }
  // 潜伏騎士の護衛先・本当の正体は狼の襲撃AIから読まない。
  // 前夜に噛んで平和だった相手は狐/護衛の可能性があるので少し避ける
  const suspicion=(state.wolfAI?.suspectedFox?.[target.id]||0);
  score-=suspicion*2.5;

  // 終盤は確定村・情報役をより優先
  const aliveCount=living().length;
  if(aliveCount<=7){
    if(target.claimed==="resonator") score+=2.5;
    if(target.claimed==="seer") score+=2;
    if(target.claimed==="medium") score+=1;
  }

  // 猫又COはかなり避けるが、終盤に他候補が薄い場合はゼロにはしない
  if(target.claimed==="cat" && aliveCount<=5) score+=4;

  // 終盤の勝ち筋：確定村や情報役を残すと、翌日の処刑候補が狼へ集中する。
  // 特に4人以下では村人よりも真確定の共鳴者・霊媒師を優先して除く。
  // 真偽は必ず公開情報の推理エンジンで判定。猫又襲撃の危険は別途残す。
  const nonWolves=living().filter(p=>p.role!=="wolf");
  if(aliveCount<=6){
    const publicConfirmed=isPubliclyConfirmedTrue(target.id);
    if(publicConfirmed){
      score += aliveCount<=4?24:11;
      if(target.claimed==="medium"||target.claimed==="resonator"||target.claimed==="seer")score+=5;
    }
    if(target.claimed==="medium"||target.claimed==="resonator"){
      score += aliveCount<=4?11:5;
    }
    if(target.claimed==="cat")score-=28; // 確定猫又でも道連れを警戒
    if(target.villagerClaim===true||(!target.claimed&&target.coCheckedNone))score-=aliveCount<=4?8:2;
    if(nonWolves.length<=3 && publicConfirmed && target.claimed!=="cat")score+=9;
  }

  // 少しランダム性（終盤は勝ち筋を壊さないよう幅を狭める）
  score += Math.random()*(aliveCount<=5?0.65:2.2);
  return score;
}

function wolfForcedPriorityTarget(){
  const viable=living().filter(p=>p.role!=="wolf");
  const confirmed=getPublicConfirmations();
  const knownKnights=viable.filter(p=>p.claimed==="knight"&&confirmed.has(p.id));
  const knownSeers=viable.filter(p=>p.claimed==="seer"&&confirmed.has(p.id));
  const fullCo=(state.publicRecords?.fullCoRequests||[]).some(x=>x.role==="knight");
  const totalKnight=publicRoleCount("knight");
  // 騎士全員CO後、生存候補が全滅している場合のみ公開上護衛不在。
  const liveKnightCandidates=viable.filter(p=>p.claimed==="knight");
  const unexcludedDead=state.players.some(p=>!p.alive&&!p.claimed && !isPubliclyConfirmedTrue(p.id));
  const confirmedDeadKnights=state.players.filter(p=>!p.alive&&p.claimed==="knight"&&confirmed.has(p.id)).length;
  const noGuard=totalKnight===0 || (totalKnight>0 && confirmedDeadKnights>=totalKnight) ||
    (fullCo && !unexcludedDead && liveKnightCandidates.length===0);
  // 騎士COが確定しているなら騎士を処理し、次に占い師へ。
  if(knownKnights.length && knownSeers.length){
    return knownKnights.sort((a,b)=>wolfAttackScore(b)-wolfAttackScore(a))[0];
  }
  if(knownSeers.length && noGuard){
    return knownSeers.sort((a,b)=>wolfAttackScore(b)-wolfAttackScore(a))[0];
  }
  if(knownKnights.length){
    return knownKnights.sort((a,b)=>wolfAttackScore(b)-wolfAttackScore(a))[0];
  }
  return null;
}
function chooseWolfAttackTarget(){
  const candidates=living().filter(p=>p.role!=="wolf");
  if(!candidates.length) return null;
  const forced=wolfForcedPriorityTarget();
  if(forced)return forced;

  const scored=candidates.map(p=>({p,score:wolfAttackScore(p)}));

  // 終盤は「詰みを避ける襲撃」を優先。明らかな悪手を抽選候補に入れない。
  if(living().length<=5){
    scored.sort((a,b)=>b.score-a.score);
    const best=scored[0];
    const close=scored.filter(x=>best.score-x.score<2.5);
    return randomChoice(close).p;
  }

  // 序中盤は上位候補ほど選ばれやすい重み付きランダム
  const minScore=Math.min(...scored.map(x=>x.score));
  const weighted=scored.map(x=>({
    p:x.p,
    w:Math.max(0.15, x.score-minScore+0.5)
  }));
  const total=weighted.reduce((a,b)=>a+b.w,0);
  let r=Math.random()*total;
  for(const x of weighted){
    r-=x.w;
    if(r<=0) return x.p;
  }
  return weighted[0].p;
}

function updateWolfAIAfterNight(attacked,guardTargets,attackDied){
  if(!state.wolfAI) state.wolfAI={suspectedFox:{},lastAttackTarget:null,lastAttackWasPeace:false};
  state.wolfAI.lastAttackTarget=attacked?.id ?? null;

  if(!attacked){
    state.wolfAI.lastAttackWasPeace=false;
    return;
  }

  // 狼が観測できるのは襲撃対象の生死だけ。護衛成功か狐噛みかは不明。
  const peace=!attackDied;

  state.wolfAI.lastAttackWasPeace=peace;

  // 平和で、しかも公開上は護衛先ではなさそうなら狐疑惑を上げる
  if(peace){
    let delta=0.9;
    if(attacked.claimed==="cat") delta=0.2;
    state.wolfAI.suspectedFox[attacked.id]=(state.wolfAI.suspectedFox[attacked.id]||0)+delta;
  }else{
    // 噛めた相手は狐ではないと判断
    state.wolfAI.suspectedFox[attacked.id]=0;
  }
}

      villagerClaim:p.villagerClaim===true?true:(p.villagerClaim===false?false:null)
    })),
    seerResults:(ensurePublicRecords(),state.publicRecords.seerResults.map(r=>({...r,seerName:byId(r.seerId)?.name||"不明",targetName:byId(r.targetId)?.name||"不明"}))),
    mediumResults:state.publicRecords.mediumResults.map(r=>({...r,mediumName:byId(r.mediumId)?.name||"不明",targetName:byId(r.targetId)?.name||"不明"})),
    guardHints:state.publicRecords.guards.map(r=>({...r,knightName:byId(r.knightId)?.name||"不明",targetName:byId(r.targetId)?.name||"不明"})),
    resonatorClaims:state.publicRecords.resonatorClaims.map(r=>({...r,partnerIds:[...(r.partnerIds||[])]})),
    roleCounts:{...(state.publicRoleCounts||{})},
    coEvents:[...(state.publicRecords?.coEvents||[])],
    lastExecutedId:state.lastExecuted,
    peace:lastNightWasPeace()
  };
}

function buildPrivateInfo(observer){
  // 役職本人だけが本来知り得る情報。公開推理ロジックには渡さない。
  const info={selfRole:observer.role,knownWolfAllies:[]};
  if(observer.role==="wolf"){
    info.knownWolfAllies=state.players.filter(p=>p.role==="wolf"&&p.id!==observer.id).map(p=>p.id);
  }
  return info;
}

function targetResultConflict(publicInfo,targetId){
  const rs=publicInfo.seerResults.filter(r=>r.targetId===targetId);
  return rs.some(r=>r.black)&&rs.some(r=>!r.black);
}

function seerVsMediumConflict(publicInfo,seerId){
  const own=publicInfo.seerResults.filter(r=>r.seerId===seerId);
  for(const r of own){
    const ms=publicInfo.mediumResults.filter(m=>m.targetId===r.targetId);
    if(ms.some(m=>m.black!==r.black))return {targetId:r.targetId,targetName:r.targetName};
  }
  return null;
}

function latestResonatorClaims(records){
  const latest=new Map();
  for(const claim of records||[])latest.set(claim.playerId,claim);
  return latest;
}
function resonatorLineMembers(latest){
  const involved=new Set();
  for(const [id,claim] of latest){
    involved.add(id);
    (claim.partnerIds||[]).forEach(x=>involved.add(x));
  }
  return involved;
}
function matchingResonatorPartners(claim,members,id){
  const expected=[...members].filter(x=>x!==id).sort((a,b)=>a-b);
  const actual=[...(claim.partnerIds||[])].sort((a,b)=>a-b);
  return expected.length===actual.length&&expected.every((x,i)=>x===actual[i]);
}

// 信用評価用の相方確認。真確定の証明とは別で、公開された宣言だけを使う。
function hasPublicResonatorSupport(publicInfo,targetId){
  const count=publicInfo.roleCounts?.resonator;
  if(count==null||count<2)return false;
  const latest=latestResonatorClaims(publicInfo.resonatorClaims);
  const involved=resonatorLineMembers(latest);
  if(involved.size>count)return false; // 対抗ラインがある場合は相方確認の信用加点を保留。
  const targetClaim=latest.get(targetId);
  if(!targetClaim)return false;
  const members=[targetId,...(targetClaim.partnerIds||[])];
  if(members.length!==count||new Set(members).size!==count)return false;
  for(const id of members){
    if(publicInfo.players.find(p=>p.id===id)?.claimed!=="resonator")return false;
    const claim=latest.get(id);
    if(!claim)return false;
    if(!matchingResonatorPartners(claim,members,id))return false;
  }
  return true;
}

function estimatePublicSuspicion(publicInfo,observerId,targetId){
  const target=publicInfo.players.find(p=>p.id===targetId);
  if(!target||!target.alive||target.id===observerId)return {score:-999,reasons:[]};
  if(isPubliclyConfirmedTrue(targetId)){
    return {score:-12,reasons:["公開情報から真役職として確定しています"]};
  }

  let score=0;
  const reasons=[];
  const black=publicInfo.seerResults.filter(r=>r.targetId===targetId&&r.black);
  const white=publicInfo.seerResults.filter(r=>r.targetId===targetId&&!r.black);

  if(black.length){
    score+=4.2*black.length;
    reasons.push(`${black[0].seerName}さんから黒が出ています`);
  }
  if(white.length){
    score-=1.4*white.length;
    reasons.push(`${white[0].seerName}さんから白が出ています`);
  }
  if(targetResultConflict(publicInfo,targetId)){
    score+=1.6;
    reasons.unshift("占い結果が白黒に割れています");
  }

  if(target.claimed==="resonator"&&hasPublicResonatorSupport(publicInfo,targetId)){
    score-=5;
    reasons.push("共鳴者COで相方確認があります");
  }
  if(target.claimed==="cat"){
    score-=3.2;
    reasons.push("猫又COなので処刑は慎重にしたいです");
  }
  if(!target.claimed&&target.villagerClaim!==true){
    score+=0.45;
    reasons.push("まだCOも白結果もありません");
  }

  if(target.claimed==="seer"){
    const c=seerVsMediumConflict(publicInfo,targetId);
    if(c){
      score+=3.6;
      reasons.unshift(`${c.targetName||"処刑者"}の判定が霊媒結果と食い違っています`);
    }
    if(publicInfo.players.filter(p=>p.alive&&p.claimed==="seer").length>=2){
      score+=0.5;
      reasons.push("占い師COが複数います");
    }
  }

  if(target.claimed==="medium"&&publicInfo.players.filter(p=>p.alive&&p.claimed==="medium").length>=2){
    score+=0.8;
    reasons.push("霊媒師COが複数います");
  }
  if(target.claimed==="knight"&&publicInfo.players.filter(p=>p.alive&&p.claimed==="knight").length>=2){
    score+=0.7;
    reasons.push("騎士COが複数います");
  }

  if(publicInfo.day===1){
    score=Math.max(-2,Math.min(2.2,score));
  }

  return {score,reasons};
}

function applyPrivateStrategy(observer,privateInfo,publicInfo,entry){
  // 秘密情報は「誰が真役職か」等の判定には絶対使わない。
  // 現在は人狼が既知の仲間を露骨に吊り推ししない程度の微調整のみ。
  let score=entry.score;

  if(privateInfo.selfRole==="wolf"&&privateInfo.knownWolfAllies.includes(entry.target.id)){
    score-=0.6;
  }

  // 狂人・妖狐は現段階では内部役職情報を推理に使わない。
  return {...entry,score};
}



function getBasePublicBreakdowns(){
  ensurePublicRecords();
  const r=state.publicRecords;
  const broken=new Map();
  const add=(id,reason)=>{
    if(id==null)return;
    if(!broken.has(id))broken.set(id,[]);
    if(!broken.get(id).includes(reason))broken.get(id).push(reason);
  };

  const playerBy=id=>state.players.find(p=>p.id===id);

  // A. 占い師：同じ相手への白黒自己矛盾
  const seerClaims=new Map();
  for(const x of r.seerResults){
    const key=`${x.seerId}:${x.targetId}`;
    if(!seerClaims.has(key))seerClaims.set(key,new Set());
    seerClaims.get(key).add(x.black?"black":"white");
  }
  for(const [key,set] of seerClaims){
    if(set.size>1)add(+key.split(":")[0],"同じ人物に白と黒の両方を出している");
  }

  // B. 占い師：その結果日より前に死亡済みの人物を占った
  for(const x of r.seerResults){
    const death=r.deaths.find(d=>d.playerId===x.targetId);
    if(death && death.day < x.day){
      add(x.seerId,`${playerBy(x.targetId)?.name||"死亡者"}は占い結果の日より前に死亡している`);
    }
  }

  // C. 霊媒師：同じ処刑者への白黒自己矛盾
  const medClaims=new Map();
  for(const x of r.mediumResults){
    const key=`${x.mediumId}:${x.targetId}`;
    if(!medClaims.has(key))medClaims.set(key,new Set());
    medClaims.get(key).add(x.black?"black":"white");
  }
  for(const [key,set] of medClaims){
    if(set.size>1)add(+key.split(":")[0],"同じ処刑者に白と黒の両方の霊媒結果を出している");
  }

  // D. 霊媒師：処刑されていない人物への結果 / 結果日の不整合
  for(const x of r.mediumResults){
    const ex=r.executions.find(e=>e.playerId===x.targetId);
    if(!ex){
      add(x.mediumId,`${playerBy(x.targetId)?.name||"対象"}は処刑されていない`);
    }else if(x.day!==ex.day+1){
      add(x.mediumId,`${playerBy(x.targetId)?.name||"対象"}の霊媒結果を出した日が成立しない`);
    }
  }

  // E. 騎士：自護衛 / 同夜複数護衛 / 死亡済み護衛
  const guardDays=new Map();
  for(const g of r.guards){
    if(g.knightId===g.targetId)add(g.knightId,"自分自身を護衛している");
    const key=`${g.knightId}:${g.day}`;
    if(!guardDays.has(key))guardDays.set(key,new Set());
    guardDays.get(key).add(g.targetId);

    const death=r.deaths.find(d=>d.playerId===g.targetId);
    if(death && death.day < g.day){
      add(g.knightId,`${playerBy(g.targetId)?.name||"死亡者"}は護衛日の前に死亡している`);
    }
  }
  for(const [key,set] of guardDays){
    if(set.size>1)add(+key.split(":")[0],"同じ夜に複数人を護衛したと主張している");
  }

  // F. 共鳴者：相方宣言の不一致 / 配役人数超過
  const latestRes=latestResonatorClaims(r.resonatorClaims);
  for(const [id,c] of latestRes){
    for(const partnerId of c.partnerIds||[]){
      const back=latestRes.get(partnerId);
      if(back && !(back.partnerIds||[]).includes(id)){
        add(id,`${playerBy(partnerId)?.name||"相方"}との相方宣言が一致していない`);
        add(partnerId,`${playerBy(id)?.name||"相方"}との相方宣言が一致していない`);
      }
    }
  }
  const resCount=publicRoleCount("resonator");
  if(resCount!=null){
    const involved=resonatorLineMembers(latestRes);
    if(involved.size>resCount){
      for(const id of involved)add(id,`共鳴者の公開ラインが配役数${resCount}人を超えている`);
    }
  }

  // G. 猫又：処刑された猫又CO者なのに専用道連れがない
  for(const ex of r.executions){
    const p=playerBy(ex.playerId);
    if(p?.claimed==="cat"||(r.coEvents||[]).some(e=>e.playerId===ex.playerId&&e.role==="cat"&&e.kind==="claim"&&e.day<=ex.day)){
      const chain=r.catChains.find(c=>c.catId===p.id&&c.day===ex.day);
      if(!chain)add(p.id,"猫又COで処刑されたが専用の道連れが起きていない");
    }
  }

  // H. 猫又処刑＋専用道連れが起きた人物は公開上の真猫又確定。
  // 猫又1人配役なら他の猫又COは破綻。
  const confirmedCats=new Set(r.catChains.map(c=>c.catId));
  const catCount=publicRoleCount("cat");
  if(catCount!=null && confirmedCats.size>=catCount && catCount>0){
    for(const p of state.players){
      if(p.claimed==="cat"&&!confirmedCats.has(p.id)){
        add(p.id,"配役上の猫又枠が真確定した猫又で埋まっている");
      }
    }
  }

  // I. 真確定した猫又に黒を出した占い師は破綻
  for(const x of r.seerResults){
    if(x.black && confirmedCats.has(x.targetId)){
      add(x.seerId,`${playerBy(x.targetId)?.name||"真猫又"}は猫又として公開確定しているのに黒を出している`);
    }
  }

  return broken;
}


// 公開情報の推理・真確定判定を役割ごとに分割。公開記録と推理結果を扱い、画面は操作しない。
function addTruthReason(map,id,reason){
  if(id==null)return false;
  if(!map.has(id))map.set(id,[]);
  if(map.get(id).includes(reason))return false;
  map.get(id).push(reason);
  return true;
}

function createPublicTruthContext(){
  const broken=new Map([...getBasePublicBreakdowns()].map(([id,reasons])=>[id,[...reasons]]));
  const confirmed=new Map();
  // 保存証明の読み込みは従来と同じ順序で行う。
  for(const proof of state.publicRecords.confirmedProofs||[]){
    if(!confirmed.has(proof.id))confirmed.set(proof.id,[]);
    confirmed.get(proof.id).push(proof.reason);
  }
  return {
    broken,confirmed,
    addBroken:(id,reason)=>addTruthReason(broken,id,reason),
    addConfirmed:(id,reason)=>id!=null&&!broken.has(id)?addTruthReason(confirmed,id,reason):false
  };
}

function applyPublicJusatsuBreakdowns({addBroken}){
  // 公開情報から証明できる呪殺だけを扱う。死体原因を隠し役職から読むことは禁止。
  // 猫又なし・2死体以上・初日の無死者時点で全占いCO済みという限定条件。
  // 真占いが襲撃死して結果を残せない夜は断定を保留する。
  const seerCountForJ=publicRoleCount("seer");
  const catCountForJ=publicRoleCount("cat");
  const firstFull=(state.publicRecords.fullCoRequests||[]).find(x=>x.role==="seer"&&x.day===1);
  if(firstFull && catCountForJ===0 && seerCountForJ===1){
    const byNight=new Map();
    for(const d of state.publicRecords.deaths||[]){
      if(d.phase!=="night"||d.day<=1)continue;
      if(!byNight.has(d.day))byNight.set(d.day,[]);
      byNight.get(d.day).push(d.playerId);
    }
    for(const [day,deaths] of byNight){
      if(deaths.length<2)continue;
      const declared=state.players.filter(p=>p.claimed==="seer");
      // 死んだ占いCO者、または初日CO後に増えた者がいると、完全な候補列挙は困難。
      if(declared.some(p=>(state.publicRecords.deaths||[]).some(d=>d.playerId===p.id&&d.day===day)))continue;
      const candidates=(state.publicRecords.seerResults||[]).filter(r=>r.day===day&&declared.some(p=>p.id===r.seerId));
      if(!candidates.length)continue;
      for(const c of candidates){
        if(!deaths.includes(c.targetId)){
          addBroken(c.seerId,`${day}日目の複数死体は呪殺確定なのに、死者を占っていない`);
        }
      }
    }
  }

}

function confirmPublicResonators({confirmed,broken,addConfirmed}){
  const request=(state.publicRecords.fullCoRequests||[]).find(x=>x.role==="resonator");
  const count=publicRoleCount("resonator");
  if(!request||count==null||count<2)return false;
  const latest=latestResonatorClaims(state.publicRecords.resonatorClaims);
  const involved=resonatorLineMembers(latest);
  if(involved.size!==count)return false;
  for(const id of involved){
    const player=byId(id),claim=latest.get(id);
    if(!player||player.claimed!=="resonator"||broken.has(id)||!claim)return false;
    if(!matchingResonatorPartners(claim,involved,id))return false;
  }
  // 指示時点の死亡者を最優先。旧保存形式は死亡日から保守的に復元する。
  const priorDeadIds=Array.isArray(request.priorDeadIds)
    ? request.priorDeadIds
    : state.players.filter(p=>!p.alive&&(!(state.publicRecords.deaths||[]).some(d=>d.playerId===p.id)||
        (state.publicRecords.deaths||[]).some(d=>d.playerId===p.id&&d.day<=request.day))).map(p=>p.id);
  for(const id of priorDeadIds){
    // 相互宣言済みの死者は潜伏不明枠ではない。ただし死亡後の宣言は証拠に使えない。
    const claim=latest.get(id);
    const death=(state.publicRecords.deaths||[]).find(d=>d.playerId===id);
    if(involved.has(id)&&claim&&death&&claim.day<death.day)continue;
    const certainOther=confirmed.has(id)&&byId(id)?.claimed&&byId(id).claimed!=="resonator";
    const certainlyWolf=(state.publicRecords.mediumResults||[]).some(r=>r.targetId===id&&r.black&&
      confirmed.has(r.mediumId)&&byId(r.mediumId)?.claimed==="medium");
    if(!certainOther&&!certainlyWolf)return false;
  }
  let changed=false;
  for(const id of involved){
    if(addConfirmed(id,`共鳴者の全員CO後、${count}人の相方関係が相互一致し、死亡潜伏真の可能性を排除した`))changed=true;
  }
  return changed;
}

function confirmFullCoRoles({confirmed,broken,addConfirmed},fullCoRoles){
  let changed=false;
  // 全員CO指示済みの単独役職。
  // 「配役人数ぶんだけ非破綻COが残った」なら、その全員が真。
  for(const role of ["seer","medium","knight","cat"]){
    if(!fullCoRoles.has(role))continue;
    const count=publicRoleCount(role);
    if(count==null||count<=0)continue;

    const claimants=state.players.filter(p=>p.claimed===role);
    const viable=claimants.filter(p=>!broken.has(p.id));

    // 生存者への全員COだけでは、未CO死亡者の潜伏真を排除できない。
    // 役職が公開確定した死者や、CO指示前に別役職として確定した死者のみ除外する。
    const request=(state.publicRecords.fullCoRequests||[]).find(x=>x.role===role);
    const unexcludedDeaths=state.players.filter(p=>{
      if(p.alive)return false;
      const death=(state.publicRecords.deaths||[]).find(d=>d.playerId===p.id);
      if(!death || !request || death.day>request.day)return false;
      if(p.claimed===role)return false; // この役職のCO歴があれば潜伏不明枠ではない
      const certainOther=confirmed.has(p.id)&&p.claimed&&p.claimed!==role;
      const certainlyEnemy=(state.publicRecords.mediumResults||[]).some(x=>x.targetId===p.id&&x.black&&[...confirmed.keys()].some(id=>id===x.mediumId&&byId(id)?.claimed==="medium"));
      return !certainOther&&!certainlyEnemy;
    });
    if(viable.length===count&&unexcludedDeaths.length===0){
      for(const p of viable){
        if(addConfirmed(p.id,
          claimants.length===count
            ? `${roleName(role)}の全員CO後、CO者数が配役数${count}人と一致した`
            : `${roleName(role)}の対抗が全員破綻し、配役数${count}人ぶんだけ残った`
        ))changed=true;
      }
    }
  }

  return changed;
}

function applyConfirmedRoleBreakdowns({confirmed,addBroken}){
  let changed=false;
  // 配役枠が真確定者で埋まったら、他の同役職COは破綻。
  for(const role of ["seer","medium","knight","cat","resonator"]){
    const count=publicRoleCount(role);
    if(count==null||count<=0)continue;
    const confirmedOfRole=[...confirmed.keys()]
      .filter(id=>(state.publicRecords.confirmedProofs||[]).some(x=>x.id===id&&x.role===role)||(!(state.publicRecords.confirmedProofs||[]).some(x=>x.id===id)&&byId(id)?.claimed===role));
    if(confirmedOfRole.length>=count){
      for(const p of state.players.filter(p=>p.claimed===role)){
        if(!confirmed.has(p.id)){
          if(addBroken(p.id,`${roleName(role)}の配役枠${count}人が真確定者で埋まっている`))changed=true;
        }
      }
    }
  }

  // 真確定した村役職に黒を出した占い師は破綻。
  for(const x of state.publicRecords.seerResults||[]){
    if(!x.black)continue;
    const target=byId(x.targetId);
    if(!target||!confirmed.has(target.id))continue;
    if(["seer","medium","knight","resonator","cat"].includes(target.claimed)){
      if(addBroken(x.seerId,`${target.name}さんは${roleName(target.claimed)}として真確定しているのに黒を出している`))changed=true;
    }
  }

  // 真確定霊媒と占い結果が食い違えば、占い師側が破綻。
  const trueMediumIds=[...confirmed.keys()].filter(id=>(state.publicRecords.confirmedProofs||[]).some(p=>p.id===id&&p.role==="medium")||byId(id)?.claimed==="medium");
  for(const mid of trueMediumIds){
    const medResults=(state.publicRecords.mediumResults||[]).filter(r=>r.mediumId===mid);
    for(const mr of medResults){
      const seerResults=(state.publicRecords.seerResults||[]).filter(r=>r.targetId===mr.targetId);
      for(const sr of seerResults){
        if(sr.black!==mr.black){
          const target=byId(mr.targetId);
          if(addBroken(sr.seerId,`${target?.name||"処刑者"}さんの判定が真確定霊媒の結果と食い違っている`))changed=true;
        }
      }
    }
  }

  return changed;
}

function solvePublicTruth(){
  ensurePublicRecords();
  const truth=createPublicTruthContext();
  applyPublicJusatsuBreakdowns(truth);
  const fullCoRoles=new Set((state.publicRecords.fullCoRequests||[]).map(x=>x.role));
  for(const c of state.publicRecords.catChains||[]){
    truth.addConfirmed(c.catId,"処刑時に猫又専用の道連れが発生した");
  }
  // 各段階を必ず順番に実行する。短絡評価で後続の判定を省略しない。
  for(let pass=0;pass<8;pass++){
    let changed=confirmFullCoRoles(truth,fullCoRoles);
    if(confirmPublicResonators(truth))changed=true;
    if(applyConfirmedRoleBreakdowns(truth))changed=true;
    if(!changed)break;
  }
  return {broken:truth.broken,confirmed:truth.confirmed};
}

function getPublicBreakdowns(){
  return solvePublicTruth().broken;
}
function getPublicConfirmations(){
  return solvePublicTruth().confirmed;
}

function commitPublicTruthProofs(){
  ensurePublicRecords();
  const known=new Set(state.publicRecords.confirmedProofs.map(x=>x.id));
  const confirmations=solvePublicTruth().confirmed;
  for(const [id,reasons] of confirmations){
    if(!known.has(id)&&reasons.length){
      state.publicRecords.confirmedProofs.push({id,role:byId(id)?.claimed,day:state.day,reason:reasons[0]});
      known.add(id);
    }
  }
}

function brokenReasonsFor(id){
  return getPublicBreakdowns().get(id)||[];
}
function isPubliclyBroken(id){
  return brokenReasonsFor(id).length>0;
}
function confirmedReasonsFor(id){
  return getPublicConfirmations().get(id)||[];
}
function isPubliclyConfirmedTrue(id){
  return confirmedReasonsFor(id).length>0;
}
function publicSeerCredibility(publicInfo,seerId){
  const seer=publicInfo.players.find(p=>p.id===seerId);
  if(!seer||seer.claimed!=="seer")return {score:0,reasons:[]};
  let score=0;
  const reasons=[];
  const results=publicInfo.seerResults.filter(r=>r.seerId===seerId);
  const confirmations=state.publicRecords?.confirmedProofs||[];
  for(const r of results){
    const trueMediumIds=new Set(confirmations.filter(c=>c.role==="medium").map(c=>c.id));
    const meds=publicInfo.mediumResults.filter(m=>m.targetId===r.targetId&&trueMediumIds.has(m.mediumId));
    for(const m of meds){
      if(m.black!==r.black){score-=3.4;reasons.push(`${r.targetName}さんの判定が真霊媒結果と食い違っています`);}
      else if(r.order!=null&&m.order!=null&&r.order<m.order){
        score+=2.4;reasons.push(`${r.targetName}さんの先出し判定が真霊媒結果と一致しています`);
      }
    }
    const target=publicInfo.players.find(p=>p.id===r.targetId);
    const proof=confirmations.find(x=>x.id===r.targetId&&x.role==="resonator");
    const resCO=(state.publicRecords?.coEvents||[]).find(e=>e.playerId===r.targetId&&e.kind==="claim"&&e.role==="resonator");
    if(target&&proof&&!r.black&&resCO&&r.order!=null&&resCO.order!=null&&r.order<resCO.order){
      score+=0.25;reasons.push(`${target.name}さんの共鳴CO前に白を出しています`);
    }
  }
  if(results.length>=2&&score>=0){score+=0.2;reasons.push("公開結果に明確な矛盾はありません");}
  return {score,reasons};
}
function chooseTrustedSeer(publicInfo){
  const seers=publicInfo.players.filter(p=>p.alive&&p.claimed==="seer");
  if(!seers.length)return null;
  const ranked=seers.map(s=>({seer:s,...publicSeerCredibility(publicInfo,s.id)}))
                    .sort((a,b)=>b.score-a.score);
  return ranked[0]?.score>=1.0?ranked[0]:null;
}

function chooseSpeechTopic(observer){
  const publicInfo=buildPublicInfo();
  const privateInfo=buildPrivateInfo(observer);

  const candidates=publicInfo.players.filter(p=>p.alive&&p.id!==observer.id);
  if(!candidates.length)return {kind:"none",targetId:null,text:"今のところ特に意見はありません。"};

  const evals=shuffle([...candidates])
    .map(target=>{
      const pub=estimatePublicSuspicion(publicInfo,observer.id,target.id);
      return applyPrivateStrategy(observer,privateInfo,publicInfo,{target,...pub});
    })
    .sort((a,b)=>b.score-a.score);

  const brokenMap=getPublicBreakdowns();
  const brokenTarget=candidates.find(p=>
    brokenMap.has(p.id) &&
    speechTopicCountToday("broken",p.id)<2 &&
    !observerMentionedRecently(observer,"broken",p.id,1)
  );
  if(brokenTarget){
    const reason=brokenMap.get(brokenTarget.id)[0];
    return {kind:"broken",targetId:brokenTarget.id,text:`${brokenTarget.name}さんは破綻しています。${reason}。`};
  }

  const changedCo=(publicInfo.coEvents||[]).find(e=>e.day===state.day&&e.kind==="withdraw"&&
    candidates.some(p=>p.id===e.playerId)&&speechTopicCountToday("coChange",e.playerId)<2);
  if(changedCo){
    const p=publicInfo.players.find(x=>x.id===changedCo.playerId);
    return {kind:"coChange",targetId:p.id,text:`${p.name}さんはCOを撤回しています。以前の発言と今のCOがどうつながるのか確認したいです。`};
  }

  const confirmedMap=getPublicConfirmations();

  // 真確定は「全員が毎日復唱する情報」ではなく、原則として推理の前提に使う。
  // まだ誰もその確定に触れていない場合だけ、当日は最大2人まで直接言及。
  const newlyMentionable=candidates.find(p=>
    confirmedMap.has(p.id) && p.claimed!=="resonator" &&
    truthFirstMentionDay("confirmed",p.id)===null &&
    speechTopicCountToday("confirmed",p.id)<2
  );
  if(newlyMentionable && Math.random()<0.55){
    const reason=confirmedMap.get(newlyMentionable.id)[0];
    return {kind:"confirmed",targetId:newlyMentionable.id,text:`${newlyMentionable.name}さんは真確定で見ていいです。${reason}。`};
  }

  // 既知の真確定情報は、一定確率で「次の推理」へ接続する。
  // 同じCOMが前日も同じ前提話題を話していたら抑制。
  if(speechTopicCountToday("confirmedPremise")<Math.max(1,Math.ceil(candidates.length/3))){
    const premise=confirmedPremiseTopic(observer,publicInfo,confirmedMap);
    if(premise && !observerMentionedRecently(observer,"confirmedPremise",premise.targetId,1) && Math.random()<0.38){
      return premise;
    }
  }

  const top=evals.find(e=>!isPubliclyConfirmedTrue(e.target.id)&&speechTopicCountToday("gray",e.target.id)<2)||evals[0];

  if(publicInfo.day===1){
    const strongPublic=top.reasons.some(r=>r.includes("黒が出ています")||r.includes("白黒に割れています")||r.includes("食い違っています"));
    if(strongPublic&&top.score>=1.8){
      const reason=top.reasons[0]||"公開情報を見ると少し気になります";
      return {kind:"gray",targetId:top.target.id,text:`${top.target.name}さんは少し気になります。${reason}。ただ、まだ初日なので決め打ちはしません。`};
    }
    const gray=randomChoice(evals.filter(e=>!e.target.claimed&&e.target.villagerClaim!==true&&e.score>-10));
    if(gray&&Math.random()<0.45){
      return {kind:"gray",targetId:gray.target.id,text:`今のところ大きな決め手はないですが、${gray.target.name}さんはまだ情報が少ないので少し見ておきたいです。`};
    }
    return {kind:"wait",targetId:null,text:"まだ決め手が少ないので、今日はCOと結果をもう少し見たいです。"};
  }

  // 公開結果から信用できる占い師がいる場合は、疑い以外の意見も出す
  const trustedSeer=chooseTrustedSeer(publicInfo);
  if(trustedSeer &&
     speechTopicCountToday("trustSeer",trustedSeer.seer.id)<2 &&
     !observerMentionedRecently(observer,"trustSeer",trustedSeer.seer.id,1) &&
     Math.random()<0.34){
    const reason=trustedSeer.reasons[0]||"これまでの結果に大きな矛盾がありません";
    return {kind:"trustSeer",targetId:trustedSeer.seer.id,text:`${trustedSeer.seer.name}さんは今のところ少し信用しています。${reason}。`};
  }

  if(top.score>=3){
    const reason=top.reasons[0]||"公開情報を見るとかなり気になります";
    let text=`${top.target.name}さんを疑っています。${reason}。`;
    if(observer.lastSuspectId!=null&&observer.lastSuspectId!==top.target.id){
      const prev=publicInfo.players.find(p=>p.id===observer.lastSuspectId);
      if(prev)text=`昨日は${prev.name}さんを気にしていましたが、今日は${top.target.name}さんをより疑っています。${reason}。`;
    }
    return {kind:"suspect",targetId:top.target.id,text};
  }

  const split=publicInfo.players.find(p=>p.alive&&targetResultConflict(publicInfo,p.id));
  if(split)return {kind:"split",targetId:split.id,text:`${split.name}さんの占い結果が白黒に割れています。占い師の真偽を見る材料になりそうです。`};

  for(const s of publicInfo.players.filter(p=>p.alive&&p.claimed==="seer")){
    const c=seerVsMediumConflict(publicInfo,s.id);
    if(c)return {kind:"seerMediumConflict",targetId:s.id,text:`${s.name}さんの${c.targetName||"処刑者"}判定が霊媒結果と合っていません。${s.name}さんは少し疑って見たいです。`};
  }

  if(publicInfo.peace){
    const g=publicInfo.guardHints.find(x=>x.day===publicInfo.day);
    if(g)return {kind:"peace",targetId:g.targetId,text:`昨夜は平和でした。${g.knightName}さんの護衛先は${g.targetName}さんなので、護衛成功か妖狐噛みかを考えたいです。`};
    return {kind:"peace",targetId:null,text:"昨夜は平和でした。騎士の護衛成功か、妖狐を噛んだ可能性がありそうです。"};
  }

  const seers=publicInfo.players.filter(p=>p.alive&&p.claimed==="seer");
  const meds=publicInfo.players.filter(p=>p.alive&&p.claimed==="medium");
  const knights=publicInfo.players.filter(p=>p.alive&&p.claimed==="knight");

  if(seers.length>=2&&speechTopicCountToday("multiSeer")<2&&!observerMentionedRecently(observer,"multiSeer",null,1))
    return {kind:"multiSeer",targetId:null,text:"占い師が複数いるので、白黒の出し方と霊媒結果との整合性を見たいです。"};
  if(meds.length>=2&&speechTopicCountToday("multiMedium")<2&&!observerMentionedRecently(observer,"multiMedium",null,1))
    return {kind:"multiMedium",targetId:null,text:"霊媒師が複数いるので、処刑結果が割れるかどうかを見たいです。"};
  if(knights.length>=2&&speechTopicCountToday("multiKnight")<2&&!observerMentionedRecently(observer,"multiKnight",null,1))
    return {kind:"multiKnight",targetId:null,text:"騎士COが複数いるので、護衛先と平和の出方を見比べたいです。"};

  const res=publicInfo.players.find(p=>p.alive&&p.claimed==="resonator");
  if(res && speechTopicCountToday("trustResonator")<1 && Math.random()<0.12)
    return {kind:"trustResonator",targetId:res.id,text:`共鳴者の指定や推理を手がかりに、まだ情報の少ない灰を見たいです。`};

  // 白結果が重なっている人物への軽い信用
  const whiteCounts=new Map();
  publicInfo.seerResults.filter(r=>!r.black).forEach(r=>whiteCounts.set(r.targetId,(whiteCounts.get(r.targetId)||0)+1));
  const trustedWhite=publicInfo.players
    .filter(p=>p.alive&&p.id!==observer.id&&(whiteCounts.get(p.id)||0)>=2)
    .sort((a,b)=>(whiteCounts.get(b.id)||0)-(whiteCounts.get(a.id)||0))[0];
  if(trustedWhite){
    return {kind:"trustWhite",targetId:trustedWhite.id,text:`${trustedWhite.name}さんは複数の占い師から白が出ているので、今は比較的村寄りで見ています。`};
  }

  const cat=publicInfo.players.find(p=>p.alive&&p.claimed==="cat");
  if(cat)return {kind:"avoidCat",targetId:cat.id,text:`${cat.name}さんは猫又COなので、処刑は慎重にしたいです。`};

  if(top.score>=1){
    const reason=top.reasons[0]||"まだ情報が少ないです";
    return {kind:"gray",targetId:top.target.id,text:`${top.target.name}さんは少し気になります。${reason}。`};
  }

  return {kind:"wait",targetId:null,text:"まだ決め手が少ないので、今日はCOと結果をもう少し見たいです。"};
}

function generateComSpeech(observer){
  const topic=chooseSpeechTopic(observer);
  return {...topic,fullText:`${observer.name}：「${topic.text}」`};
}
function runDaySpeeches(){
  if(state.phase!=="day"||state.winner)return;
  const speakers=living().filter(p=>!p.isSelf&&(p.lastSpeechDay||0)!==state.day);
  if(!speakers.length)return;

  log(`── ${state.day}日目の意見 ──`,"system");
  speakers.forEach(p=>{
    const speech=generateComSpeech(p);
    if(!Array.isArray(p.speechHistory))p.speechHistory=[];
    p.speechHistory.push({day:state.day,kind:speech.kind,targetId:speech.targetId,text:speech.text});
    if(speech.targetId!=null&&["suspect","gray","seerMediumConflict","broken"].includes(speech.kind))p.lastSuspectId=speech.targetId;
    p.lastSpeechDay=state.day;
    p.lastSpeechText=speech.fullText;
    log(speech.fullText,"talk");
  });
}

function resolveNight(){
  if(state.phase!=="night"||state.winner)return;

  // 1. 騎士の護衛先を確定
  const guardTargets=[];
  roleLiving("knight").forEach(k=>{
    // 本人指示も無効な指示と同様に扱い、個別の通知なしで通常の自動護衛へ。
    let t=k.forcedGuardTarget!=null&&byId(k.forcedGuardTarget)?.alive?byId(k.forcedGuardTarget):null;
    if(t?.id===k.id)t=null;
    if(!t)t=randomChoice(living().filter(p=>p.id!==k.id));
    if(t){
      guardTargets.push(t.id);
      if(!k.guardHistory)k.guardHistory=[];
      k.guardHistory.push({day:state.day+1,target:t.id});
    }
    k.forcedGuardTarget=null;
  });

  // 2. 人狼の襲撃先を決定
  const wolves=roleLiving("wolf");
  let attacked=null;
  if(wolves.length)attacked=chooseWolfAttackTarget();

  // 3. 占い結果を生成
  //    襲撃死する占い師も占いは実行するが、翌朝の結果報告は不可
  const seersBefore=roleLiving("seer").slice();
  const fakeSeersBefore=living().filter(p=>hostile(p)).slice();

  // 先に襲撃死する人物を特定（護衛成功なら死なない）
  const attackedDies = attacked && attacked.alive && !guardTargets.includes(attacked.id);
  const doomedByWolf = attackedDies ? attacked.id : null;

  let foxKilled=[];
  seersBefore.forEach(s=>{
    // 襲撃死予定でも占い能力は成立。死亡した本人だけ結果を報告できない。
    let t=s.forcedSeerTarget!=null&&byId(s.forcedSeerTarget)?.alive?byId(s.forcedSeerTarget):null;
    if(!t)t=autoSeerTarget(s,s.seerResults);
    if(t){
      s.seerResults.push({day:state.day+1,target:t.id,black:t.role==="wolf"});
      if(t.role==="fox")foxKilled.push(t.id);
    }
    s.forcedSeerTarget=null;
  });

  fakeSeersBefore.forEach(s=>{
    const lockedTarget=s.forcedSeerTarget!=null;
    let t=s.forcedSeerTarget!=null&&byId(s.forcedSeerTarget)?.alive?byId(s.forcedSeerTarget):null;
    let plan=null;
    if(!t && s.role==="wolf"&&s.claimed==="seer")plan=chooseWolfFakeSeerAction(s);
    if(!t && plan)t=plan.target;
    if(!t)t=autoSeerTarget(s,s.fakeSeerResults);
    if(t)s.fakeSeerResults.push({day:state.day+1,target:t.id,black:plan&&plan.target.id===t.id?plan.black:chooseFakeBlack(s,t),lockedTarget});
    s.forcedSeerTarget=null;
  });

  // 4. 妖狐呪殺
  foxKilled=[...new Set(foxKilled)];
  foxKilled.forEach(id=>{
    const p=byId(id);
    if(p&&p.alive){
      p.alive=false;
      recordPublicDeath(p,state.day+1,"night","found-dead");
      log(`${p.name} が無残な姿で発見されました。`,"death");
    }
  });

  // 5. 人狼襲撃
  let attackDied=false;
  if(attacked&&attacked.alive){
    if(guardTargets.includes(attacked.id)){
      if(!foxKilled.length)log("平和な朝がやってきました。","result");
    }else if(attacked.role==="fox"){
      // 妖狐は人狼の襲撃では死亡しない。
      // ただし同じ夜に呪殺死体が出ている場合は「平和な朝」とは表示しない。
      if(!foxKilled.length)log("平和な朝がやってきました。","result");
    }else{
      attacked.alive=false;
      attackDied=true;
      recordPublicDeath(attacked,state.day+1,"night","found-dead");
      log(`${attacked.name} が無残な姿で発見されました。`,"death");

      // 猫又が人狼に襲撃された場合、生存している人狼からランダムに1匹を道連れ
      if(attacked.role==="cat"){
        const wolfVictim=randomChoice(roleLiving("wolf"));
        if(wolfVictim){
          wolfVictim.alive=false;
          recordPublicDeath(wolfVictim,state.day+1,"night","found-dead");
          // 通常の襲撃死と同じメッセージにして、猫又による道連れとは公開しない
          log(`${wolfVictim.name} が無残な姿で発見されました。`,"death");
        }
      }
    }
  }else if(!foxKilled.length){
    log("平和な朝がやってきました。","result");
  }

  // 霊媒結果は朝まで生存できた霊媒師だけが取得する。
  // 処刑直後には生成せず、夜の襲撃・道連れ処理が終わってから確定する。
  if(state.lastExecuted!=null){
    const executed=byId(state.lastExecuted);
    if(executed){
      roleLiving("medium").forEach(m=>{
        const already=(m.mediumResults||[]).some(r=>r.day===state.day+1&&r.target===executed.id);
        if(!already)m.mediumResults.push({day:state.day+1,target:executed.id,black:executed.role==="wolf"});
      });
      living().filter(x=>hostile(x)&&x.claimed==="medium").forEach(m=>{
        const already=(m.fakeMediumResults||[]).some(r=>r.day===state.day+1&&r.target===executed.id);
        if(!already)m.fakeMediumResults.push({day:state.day+1,target:executed.id,black:chooseFakeMediumBlack(m,executed)});
      });
    }
  }

  // 狼の騙り占い師は、事前指示が無いときだけ公開された朝の死体に合わせて白を出す。
  // 本当の呪殺原因（foxKilled）は参照しない。猫又の2死体とも区別できない。
  // 死体を占うよう前夜に明示指示された場合は、報告先を変更しない。
  const morningCorpses=(state.publicRecords?.deaths||[])
    .filter(d=>d.phase==="night"&&d.day===state.day+1).map(d=>d.playerId);
  const wolfFakeSeers=living().filter(x=>x.role==="wolf"&&x.fakeClaimRole==="seer"&&x.claimed==="seer");
  for(const liar of wolfFakeSeers){
    const last=(liar.fakeSeerResults||[]).find(r=>r.day===state.day+1);
    if(!last||last.lockedTarget||!morningCorpses.length)continue;
    // 公開上で呪殺の可能性がある2死体以上の朝のみ対応を強く優先。
    if(morningCorpses.length>=2){
      const chosen=randomChoice(morningCorpses);
      last.target=chosen;last.black=false;last.jusatsuResponse=true;
    }
  }

  commitPublicTruthProofs();

  // 襲撃結果を次夜以降の人狼AIに反映
  updateWolfAIAfterNight(attacked,guardTargets,attackDied);

  const w=checkWin(); if(w){finish(w);return}

  state.day++;
  state.phase="day";
  log(`${state.day}日目の朝になりました。`,"system");

  // 6. 朝の自動報告
  //    生存しているCO者だけが報告する。夜に死亡した者は報告しない。
  living().filter(p=>p.claimed==="seer").forEach(p=>{
    if(p.role==="seer")reportTrueSeer(p,false);
    else if(p.fakeClaimRole==="seer")reportFakeSeer(p,false);
  });
  living().filter(p=>p.claimed==="medium").forEach(p=>{
    if(p.role==="medium")reportTrueMedium(p,false);
    else if(p.fakeClaimRole==="medium")reportFakeMedium(p,false);
  });
  living().filter(p=>p.claimed==="knight").forEach(p=>reportKnight(p,false));

  runDaySpeeches();
  save();renderAll();
}

function checkWin(){
  const a=living(),w=a.filter(p=>p.role==="wolf").length,f=a.filter(p=>p.role==="fox").length,o=a.length-w-f;
  if(w===0)return f>0?"妖狐陣営の勝利":"村人陣営の勝利";
  if(w>=o)return f>0?"妖狐陣営の勝利":"人狼陣営の勝利";
  return null;
}
function finish(w){clearSelection();state.winner=w;state.phase="end";log(`ゲーム終了：${w}`,"system");save();renderAll()}
function save(){localStorage.setItem("jinro_v04_state",JSON.stringify(state))}
function load(){
  try{
    const r=localStorage.getItem("jinro_v04_state");
    if(!r){alert("保存データがありません");return}
    state=JSON.parse(r);
    state.selectionMode=null;state.selectionTitle=null;state._selectionAllowed=null;state._selectionCallback=null;
    if(state.logPersonFilterId===undefined)state.logPersonFilterId=null;
    if(!state.uiSettings)state.uiSettings={showConfirmedBadges:true,showBrokenBadges:true};
    if(state.uiSettings.showConfirmedBadges===undefined)state.uiSettings.showConfirmedBadges=true;
    if(state.uiSettings.showBrokenBadges===undefined)state.uiSettings.showBrokenBadges=true;
    ensurePublicRecords();
    (state.players||[]).forEach(p=>{
      if(p.coCheckedNone===undefined)p.coCheckedNone=false;
      if(!Array.isArray(p.coHistory))p.coHistory=[];
      if(p.villagerAnswerLocked===undefined)p.villagerAnswerLocked=p.villagerClaim!==null;
      if(!Array.isArray(p.speechHistory))p.speechHistory=[];
      if(p.deathDay===undefined)p.deathDay=null;
      if(p.deathPhase===undefined)p.deathPhase=null;
    });
    commitPublicTruthProofs();
    state.version="2.3.0";
    showGame();
  }catch(e){alert("保存データを読み込めませんでした")}
}
function reset(){
  if(confirm("現在のゲームを終了して設定画面に戻りますか？")){
    localStorage.removeItem("jinro_v04_state"); state=null; showSetup();
  }
}
function renderDebug(){
  if(!state)return;
  $("#debugText").innerHTML=state.players.map(p=>`${escapeHtml(p.name)}：${roleName(p.role)} / ${p.alive?"生存":"死亡"} / CO ${publicClaim(p)} / 騙り予定 ${p.fakeClaimRole?roleName(p.fakeClaimRole):"なし"} / 共鳴相方 ${(p.resonancePartners||[]).map(id=>byId(id)?.name).filter(Boolean).join("・")||"なし"} / CO確認 ${p.coCheckedNone?"COなし":publicClaim(p)} / 村人回答 ${p.villagerClaim===null?"未確認":(p.villagerClaim?"村人":"非村人")}`).join("<br>");
}

function openActionSheet(title,items){
  $("#actionSheetTitle").textContent=title;
  $("#actionSheetGrid").innerHTML=items.map(x=>`<button data-action="${x.id}">${x.label}</button>`).join("");
  $("#actionSheet").classList.remove("hidden");
  $("#actionSheetGrid").querySelectorAll("[data-action]").forEach(btn=>{
    btn.onclick=()=>{
      const item=items.find(x=>x.id===btn.dataset.action);
      $("#actionSheet").classList.add("hidden");
      if(item)item.run();
    };
  });
}
function closeActionSheet(){$("#actionSheet").classList.add("hidden")}
function openCoMenu(){
  if(state.phase!=="day"){log("CO指示は昼のみ使えます。","system");return}
  openActionSheet("COメニュー",[
    {id:"bseer",label:"黒出し占い師CO",run:blackSeerCO},
    {id:"bmed",label:"黒出し霊媒師CO",run:blackMediumCO},
    {id:"role",label:"役職CO",run:makeRolePanel},
    {id:"ind",label:"個別CO確認",run:individualCoCheck},
    {id:"vcheck",label:"個別村人CO",run:villagerCheck}
  ])
}
function openSeerMenu(){
  if(state.phase!=="day"){log("占い指示は昼のみ使えます。","system");return}
  openActionSheet("占いメニュー",[
    {id:"hidden",label:"潜伏占い指示",run:hiddenSeerInstruction},
    {id:"public",label:"CO済占い師へ個別指示",run:publicSeerInstruction}
  ])
}
function openGuardMenu(){
  if(state.phase!=="day"){log("護衛指示は昼のみ使えます。","system");return}
  openActionSheet("護衛メニュー",[
    {id:"hiddenGuard",label:"潜伏護衛指示",run:hiddenGuardInstruction},
    {id:"publicGuard",label:"CO済騎士へ個別指示",run:publicGuardInstruction}
  ])
}
function openFlowMenu(){
  openActionSheet("進行メニュー",[
    {id:"execute",label:"処刑対象を選ぶ",run:()=>state.phase==="day"?chooseExecution():log("処刑は昼のみです。","system")},
    {id:"night",label:"夜を解決する",run:()=>state.phase==="night"?resolveNight():log("まだ夜ではありません。","system")}
  ])
}

$("#playerCount").addEventListener("input",renderRoleConfig);
$("#startBtn").onclick=startGame;
$("#loadBtn").onclick=load;
$("#debugBtnTop").onclick=()=>$("#debugPanel").classList.toggle("hidden");
$("#resetBtnTop").onclick=reset;
$("#actionSheetClose").onclick=closeActionSheet;
$("#confirmExecuteBtn").onclick=confirmExecution;
$("#cancelExecuteBtn").onclick=cancelExecution;
$("#navCo").onclick=openCoMenu;
$("#navSeer").onclick=openSeerMenu;
$("#navGuard").onclick=openGuardMenu;
$("#navFlow").onclick=openFlowMenu;
$("#logPersonFilter").addEventListener("change",e=>{
  if(!state)return;
  state.logPersonFilterId=e.target.value===""?null:+e.target.value;
  save();
  renderLog();
});
$("#logToggleBtn").onclick=()=>{
  const e=$("#log"),collapsed=e.classList.toggle("collapsed");
  $("#logToggleBtn").textContent=collapsed?"ログを全部見る":"ログをたたむ";
};
document.querySelectorAll("[data-claimtab]").forEach(btn=>{
  btn.onclick=()=>{if(!state)return;state.claimTab=btn.dataset.claimtab;save();renderClaimBoard()}
});
renderRoleConfig();
renderRolePresets();
</script>
</body>
</html>
