<script>
(()=>{'use strict';const $=id=>document.getElementById(id),stage=$('stage'),bubble=$('bubble'),head=$('head'),bob=$('bob'),l=$('leftEar'),r=$('rightEar'),tail=$('tail'),eyelids=$('eyelids'),happy=$('happyEyes'),normal=$('normalEyes'),angry=$('angryBrows'),blush=$('blush'),mouth=$('mouthOpen'),smile=$('mouthSmile'),pupils=$('pupils');let mood='normal',talk=false,blinkUntil=0,nextBlink=1200,earBurst=0,lookX=0,lookY=0,lastTap=0;const msgs={normal:'やっほー！',happy:'えへへっ！',shy:'見つめないでよ…！',angry:'もーっ！',talk:'おしゃべり中♪'};function setMood(m){mood=m;document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));let selected={happy:'btnHappy',shy:'btnShy',angry:'btnAngry'}[m];if(selected)$(selected).classList.add('active');bubble.textContent=msgs[m]||msgs.normal}function burst(){earBurst=performance.now()+900}$('btnHappy').onclick=()=>{talk=false;setMood('happy')};$('btnShy').onclick=()=>{talk=false;setMood('shy');burst()};$('btnAngry').onclick=()=>{talk=false;setMood('angry')};$('btnTalk').onclick=()=>{talk=!talk;setMood(talk?'talk':'normal');$('btnTalk').classList.toggle('active',talk)};$('btnEar').onclick=()=>{burst();bubble.textContent='ぴこっ！'};$('btnReset').onclick=()=>{talk=false;setMood('normal')};function point(e){const rc=stage.getBoundingClientRect();lookX=Math.max(-1,Math.min(1,((e.clientX-rc.left)/rc.width-.5)*2));lookY=Math.max(-1,Math.min(1,((e.clientY-rc.top)/rc.height-.5)*2))}stage.addEventListener('pointermove',point);stage.addEventListener('pointerdown',e=>{point(e);if(performance.now()-lastTap>240){lastTap=performance.now();setMood('shy');burst();setTimeout(()=>{if(mood==='shy')setMood('normal')},1800)}});stage.addEventListener('pointerleave',()=>{lookX=0;lookY=0});let start=performance.now();function frame(now){let t=(now-start)/1000;if(now>nextBlink){blinkUntil=now+145;nextBlink=now+2100+Math.random()*3300}let isBlink=now<blinkUntil;eyelids.style.opacity=isBlink&&mood!=='happy'?'1':'0';normal.style.opacity=(mood==='happy'||isBlink)?'0':'1';happy.style.opacity=mood==='happy'?'1':'0';angry.style.opacity=mood==='angry'?'1':'0';blush.style.opacity=mood==='shy'?'1':'0';let open=talk&&(Math.sin(t*17)>.03);mouth.style.opacity=open?'1':'0';smile.style.opacity=open?'0':'1';let sway=Math.sin(t*1.25)*1.2;bob.style.transform=`translateY(${Math.sin(t*2.3)*3}px) scaleY(${1+Math.sin(t*2.3)*.003})`;head.style.transform=`translate(${lookX*5}px,${lookY*3}px) rotate(${lookX*3+sway}deg)`;pupils.style.transform=`translate(${lookX*4}px,${lookY*3}px)`;let twitch=now<earBurst?Math.sin(t*35)*13:Math.sin(t*2.1)*2;l.style.transform=`rotate(${-twitch}deg)`;r.style.transform=`rotate(${twitch*.9}deg)`;tail.style.transform=`rotate(${Math.sin(t*2.8)*9}deg)`;requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
